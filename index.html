          {veri.tahmini_teslimat&&<span><span style={{color:"var(--text-2)"}}>Tahmini teslim: </span><strong>{trTarih(veri.tahmini_teslimat)}</strong></span>}
        </div>
      )}
    </Card>
    {adimlar.length>0&&(
      <Card>
        <ST>📋 Süreç Adımları</ST>
        <OnarimTimeline readonly adimlar={adimlar.map(x=>({id:x.sira,ad:x.ad,durum:x.durum,tarih:trTarihZaman(x.tamamlanma_trh)}))}/>
      </Card>
    )}
    {veri.servis&&(
      <Card>
        <ST>🔧 Servis</ST>
        <div style={{fontWeight:700,fontSize:14,marginBottom:4}}>{veri.servis.ad}</div>
        {veri.servis.adres&&<div style={{fontSize:12,color:"var(--text-2)",marginBottom:8}}>{veri.servis.adres}</div>}
        {veri.servis.telefon&&<a href={`tel:${veri.servis.telefon}`} style={{fontSize:13,fontWeight:700,color:"#F59E0B"}}>📞 {veri.servis.telefon}</a>}
      </Card>
    )}
    <div style={{fontSize:10,color:"var(--text-2)",textAlign:"center",lineHeight:1.6}}>Son güncelleme {trTarihZaman(veri.son_guncelleme)} · Link {trTarihZaman(veri.link_son_gecerlilik)} tarihine kadar geçerli. Bu linki başkalarıyla paylaşmayın.</div>
  </>);
}

// ─── SİGORTA ACENTESİ PANELİ ──────────────────────────────────────────────
function AcentePanel({onCikis}){

// Servis kokpiti: servise atanan araçlar için hero, KPI, süreç şeridi, kanban, tablo ve ajanda
function ServisKokpit({servisAd,dosyalar,yukleniyor,hata,onYenile,okunmamis,onSec,onGit}){
  if(hata)return <HataKutusu hata={hata} onTekrar={onYenile}/>;
  if(yukleniyor&&!dosyalar.length)return <div className="ak-bos"><span style={{animation:"pulse .8s infinite"}}>Araçlar yükleniyor...</span></div>;
  const aktif=dosyalar.filter(x=>x.durum==="Aktif");
  const geciken=aktif.filter(x=>{const g=gunFarki(x.tahminiTeslim);return g!==null&&g<0;});
  const yakin=aktif.filter(x=>{const g=gunFarki(x.tahminiTeslim);return g!==null&&g>=0&&g<=7;});
  const atolyede=aktif.filter(x=>["Parça Temini","Onarım","Boya & Son Kontrol"].includes(x.aktifAdim));
  const onayda=aktif.filter(x=>x.onayDurumu==="bekliyor");
  const sutun=(s)=>aktif.filter(x=>x.aktifAdim===s.ad||(s.ad==="Araç Teslimi"&&!x.aktifAdim&&x.ilerleme>=100));
  const bugun=new Date().toLocaleDateString("tr-TR",{weekday:"long",day:"numeric",month:"long"});
  const ajanda=[
    ...geciken.map(x=>({g:"#ef4444",b:`Teslim gecikti · ${x.dosyaNo}`,s:`${x.plaka} · ${-gunFarki(x.tahminiTeslim)} gün geçti`,id:x.id,o:0})),
    ...dosyalar.filter(x=>okunmamis[x.id]>0).map(x=>({g:"#8b5cf6",b:`${okunmamis[x.id]} yeni mesaj · ${x.dosyaNo}`,s:`${x.plaka} · admin yazdı`,id:x.id,o:1})),
    ...onayda.map(x=>({g:"#f59e0b",b:`Admin onayı bekleniyor · ${x.dosyaNo}`,s:`${x.plaka} · ${x.arac}`,id:x.id,o:2})),
    ...yakin.map(x=>{const g=gunFarki(x.tahminiTeslim);return {g:"#3b82f6",b:`${g===0?"Bugün":g===1?"Yarın":`${g} gün sonra`} teslim · ${x.dosyaNo}`,s:`${x.plaka} · ${x.aktifAdim||"Hazır"}`,id:x.id,o:3+g/10};}),
  ].sort((a,b)=>a.o-b.o);
  return(
    <>
      <section className="ak-hero">
        <div className="ak-ust">{servisAd} · Servis Kontrol</div>
        <h2>Atölyenizdeki araçlar tek ekranda</h2>
        <p>{bugun} · {aktif.length} aktif araç · {dosyalar.length-aktif.length} tamamlanan</p>
        <div className="ak-hero-eylem">
          <button className="ana" onClick={()=>onGit("pano")}>Atölye Panosu</button>
          <button onClick={()=>onGit("stok")}>Depo & Parça</button>
        </div>
      </section>
      <section className="ak-kpis">
        {[{l:"Aktif araç",v:aktif.length,s:`${dosyalar.length} atanan araç`,k:"var(--ak-c-intake)"},
          {l:"Atölyede",v:atolyede.length,s:`${aktif.filter(x=>x.aktifAdim==="Parça Temini").length} parça bekliyor`,k:"var(--ak-c-repair)",git:"pano"},
          {l:"Onay bekleyen",v:onayda.length,s:onayda.length?"Admin kararı bekleniyor":"Bekleyen yok",k:"var(--ak-c-supply)"},
          {l:"Teslim riski",v:geciken.length,s:`7 gün içinde teslim: ${yakin.length}`,k:geciken.length?"#ef4444":"var(--ak-c-portal)"}].map(x=>(
          <div key={x.l} className="ak-kart ak-kpi" style={{"--k":x.k,cursor:x.git?"pointer":"default"}} onClick={()=>x.git&&onGit(x.git)}><div className="l">{x.l}</div><b>{x.v}</b><div className="s">{x.s}</div></div>
        ))}
      </section>
      <div className="ak-surec">
        {AK_SUREC.map(s=>{const n=sutun(s).length;return <div key={s.ad} className={`ak-adim${n?" dolu":""}`} style={{"--g":s.g}}><b>{s.k}</b><small>{n?`${n} araç`:"Boş"}</small></div>;})}
      </div>
      <section className="ak-kart">
        <div className="ak-baslik"><h3>Onarım Kanbanı</h3><span>{aktif.length} aktif araç</span></div>
        <div className="ak-kanban">
          {AK_SUREC.map(s=>{const ds=sutun(s);return(
            <div key={s.ad} className="ak-sutun" style={{"--g":s.g}}>
              <h4><span>{s.k}</span><span>{ds.length}</span></h4>
              {ds.map(x=>(
                <button key={x.id} className="ak-bilet" onClick={()=>onSec(x.id)}>
                  <b>{x.plaka}</b>
                  <p>{x.dosyaNo}<br/>{x.arac}{x.tahminiTeslim?` · teslim ${trTarih(x.tahminiTeslim)}`:""}</p>
                </button>
              ))}
            </div>
          );})}
        </div>
      </section>
      <div className="ak-iki">
        <section className="ak-kart" style={{overflowX:"auto"}}>
          <div className="ak-baslik"><h3>Araçlar</h3><span>{dosyalar.length} araç</span></div>
          {dosyalar.length===0?<div className="ak-bos">Henüz araç atanmadı.</div>:(
            <table className="ak-tablo">
              <thead><tr><th>Araç</th><th className="gizle">Model</th><th className="gizle">Müşteri</th><th>Aşama</th><th className="gizle">İlerleme</th><th>Teslim</th></tr></thead>
              <tbody>{dosyalar.map(x=>{const g=gunFarki(x.tahminiTeslim);return(
                <tr key={x.id} className="satir" onClick={()=>onSec(x.id)}>
                  <td><span className="no">{x.plaka}</span> <MesajRozet n={okunmamis[x.id]}/><span className="alt" style={{whiteSpace:"nowrap"}}>{x.dosyaNo}</span></td>
                  <td className="gizle">{x.arac}</td><td className="gizle">{x.sahip}</td>
                  <td>{x.durum==="Aktif"?<span className="ak-cip" style={{color:adimRenk(x.aktifAdim),background:`color-mix(in srgb,${adimRenk(x.aktifAdim)} 12%,white)`}}>{x.aktifAdim||"Hazır"}</span>:<span className="ak-cip ak-ok">{x.durum}</span>}</td>
                  <td className="gizle"><div className="ak-ilerleme"><div style={{width:`${x.ilerleme}%`}}/></div><span className="alt">%{x.ilerleme}</span></td>
                  <td>{x.tahminiTeslim?<span className={`ak-cip ${x.durum!=="Aktif"?"ak-gri":g<0?"ak-tehlike":g<=2?"ak-uyari":"ak-gri"}`}>{trTarih(x.tahminiTeslim)}</span>:"—"}</td>
                </tr>);})}</tbody>
            </table>
          )}
        </section>
        <section className="ak-kart" style={{alignSelf:"start"}}>
          <div className="ak-baslik"><h3>Bugünün Ajandası</h3><span>{ajanda.length} iş</span></div>
          {ajanda.length===0?<div className="ak-bos">Bekleyen iş yok.</div>:ajanda.slice(0,8).map((a,i)=>(
            <button key={i} className="ak-ajanda" style={{"--g":a.g}} onClick={()=>onSec(a.id)}><b>{a.b}</b><span>{a.s}</span></button>
          ))}
        </section>
      </div>
    </>
  );
}

function ServisPanel({servisBilgi,onCikis}){
  const [tab,setTab]=useState("araclar");
  const [dosyalar,setDosyalar]=useState([]);
  const [listeYukleniyor,setListeYukleniyor]=useState(true);
  const [listeHata,setListeHata]=useState("");
  const [seciliId,setSeciliId]=useState(null);
  const [detay,setDetay]=useState(null);
  const [detayYukleniyor,setDetayYukleniyor]=useState(false);
  const [detayHata,setDetayHata]=useState("");
  const [adimlar,setAdimlar]=useState([]);
  const [adimHata,setAdimHata]=useState("");
  const [adimLoading,setAdimLoading]=useState(false);
  const [islemler,setIslemler]=useState([]);
  const [onayDurumu,setOnayDurumu]=useState("taslak");
  const [isEmirleri,setIsEmirleri]=useState([]);
  const [muhasebeData,setMuhasebeData]=useState({});
  const [okunmamis,setOkunmamis]=useState({});
  const detaySeq=useRef(0);
  const [isMobile,setIsMobile]=useState(false);
  useEffect(()=>{const c=()=>setIsMobile(window.innerWidth<768);c();window.addEventListener("resize",c);return()=>window.removeEventListener("resize",c);},[]);

  const listeYukle=async(sessiz)=>{
    if(!sessiz)setListeYukleniyor(true);
    setListeHata("");
    try{const d=await apiCall("/dosyalar?limit=200");setDosyalar(esleListe(d.dosyalar));okunmamisYukle();}
    catch(e){setListeHata(e.message||"Dosyalar alınamadı.");}
    finally{setListeYukleniyor(false);}
  };
  const okunmamisYukle=()=>apiCall("/mesajlar/okunmamis").then(d=>setOkunmamis(d.dosyalar||{})).catch(()=>{});
  const detayYukle=async(id,sessiz)=>{
    const sira=++detaySeq.current;
    if(!sessiz)setDetayYukleniyor(true);
    setDetayHata("");
    try{
      const [d,i]=await Promise.all([apiCall(`/dosyalar/${id}`),apiCall(`/islemler/${id}`)]);
      if(sira!==detaySeq.current)return;
      const dm=esleDetay(d);
      setDetay(dm);setMuhasebeData(dm.muhasebe);
      setAdimlar((d.onarim_adimlari||[]).map(esleAdim));
      setIslemler((i.kalemler||[]).map(esleKalem));
      setOnayDurumu(i.onay_durumu||"taslak");
      setIsEmirleri(i.is_emirleri||[]);
    }catch(e){if(sira===detaySeq.current)setDetayHata(e.message||"Dosya alınamadı.");}
    finally{if(sira===detaySeq.current)setDetayYukleniyor(false);}
  };
  useEffect(()=>{listeYukle();},[]);
  const dosyaSec=(id,sekme)=>{setSeciliId(id);setDetay(null);setAdimHata("");detayYukle(id);setTab(sekme||"onarim");};
  const islemApi=seciliId?islemApiOlustur(seciliId,async()=>{await detayYukle(seciliId,true);listeYukle(true);}):null;

  // Sayaçlar API listesinden hesaplanır
  const atananDosyalar=dosyalar;
  const seciliOzet=dosyalar.find(d=>d.id===seciliId);
  const aktifAdim=adimlar.find(a=>a.durum==="aktif");
  const oP=adimlar.length?Math.round((adimlar.filter(a=>a.durum==="tamamlandi").length/adimlar.length)*100):0;
  const P=isMobile?12:24;

  const adimTamamla=async(id)=>{
    if(adimLoading||!seciliId)return;
    setAdimLoading(true);setAdimHata("");
    try{
      const r=await apiCall(`/dosyalar/${seciliId}/adim/${id}/tamamla`,"POST");
      setAdimlar((r.onarim_adimlari||[]).map(esleAdim));
      listeYukle(true);
    }catch(e){setAdimHata(e.message||"Adım tamamlanamadı.");}
    finally{setAdimLoading(false);}
  };

  // Kabuk: admin ile aynı yan menü + üst bar; araç seçiliyken maketteki dosya ekranı düzeni
  const DOSYA_SEKME=[{id:"onarim",l:"Onarım"},{id:"dvi",l:"Hasar Haritası"},{id:"muhasebe",l:"Muhasebe"},{id:"evrak",l:"Evrak"},{id:"fotolar",l:"Fotoğraf"},{id:"iletisim",l:"Mesaj"}];
  const dosyaGorunumu=!!seciliId&&DOSYA_SEKME.some(s=>s.id===tab);
  const toplamOkunmamis=Object.values(okunmamis).reduce((s,n)=>s+(Number(n)||0),0);
  const SERVIS_MENU=[
    {grup:"Genel",g:"var(--ak-c-system)",ogeler:[{id:"araclar",ico:"▦",ad:"Araçlarım"}]},
    {grup:"Kabul",g:"var(--ak-c-intake)",ogeler:[{id:"kabul",ico:"↦",ad:"Araç Kabul & Teslim"}]},
    {grup:"Onarım Operasyonları",g:"var(--ak-c-repair)",ogeler:[{id:"pano",ico:"⌘",ad:"Atölye Panosu"},{id:"kaporta",ico:"▧",ad:"Kaporta"},{id:"boya",ico:"◩",ad:"Boya"},{id:"mekanik",ico:"⚙",ad:"Mekanik"},{id:"gantt",ico:"≋",ad:"Gantt Planlama"},{id:"dvi-liste",ico:"◈",ad:"Hasar Haritaları"},{id:"operasyon",ico:"✦",ad:"Gecikmeler"}]},
    {grup:"Parça & Tedarik",g:"var(--ak-c-supply)",ogeler:[{id:"stok",ico:"⬡",ad:"Depo & Parça"},{id:"tedarikci",ico:"◎",ad:"Tedarikçi Karnesi"},{id:"protokol",ico:"▣",ad:"Sigorta Protokolleri"}]},
    {grup:"Finans",g:"var(--ak-c-finance)",ogeler:[{id:"finans",ico:"₺",ad:"Faturalar"}]},
    {grup:"Müşteri & Dosya",g:"var(--ak-c-portal)",ogeler:[{id:"medya",ico:"▥",ad:"Fotoğraf & Evrak"},{id:"portal",ico:"◉",ad:"Müşteri Takibi"}]},
  ];
  const sayfaBaslik={"dvi-liste":["Hasar Haritaları","Araç şeması üzerinde hasar noktaları"],protokol:["Sigorta Protokolleri","Şirkete göre ücret ve iskontolar (salt okunur)"],gantt:["Gantt Planlama","Araçların servis takvimi"],operasyon:["Gecikmeler","Darboğazlar ve gecikme nedenleri"],tedarikci:["Tedarikçi Karnesi","Teslim süresi ve zamanında gelme oranı"],finans:["Faturalar","Kesilen faturalar ve tahsilat"],kabul:["Araç Kabul & Teslim","Kabul ve teslim tutanakları"],kaporta:["Kaporta","Kaporta bölümü görevleri"],boya:["Boya","Boya bölümü görevleri"],mekanik:["Mekanik","Mekanik bölümü görevleri"],medya:["Fotoğraf & Evrak","Evrak tamamlanma durumu"],portal:["Müşteri Takibi","Müşteri takip linkleri"],araclar:["Araçlarım","Servise atanan araçlar, canlı veri"],pano:["Atölye Panosu","Hangi araç hangi bölümde"],stok:["Depo & Parça","Stok, parça siparişleri ve tedarikçiler"]}[tab]||["Araçlarım",""];
  const git=(id)=>{setTab(id);window.scrollTo(0,0);};
  const d=detay;

  return(
    <>
      <aside className="ak-side">
        <div className="ak-brand kucuk">{servisBilgi.ad}<small>Servis Paneli</small></div>
        <nav className="ak-nav">
          {SERVIS_MENU.map(m=>(
            <div key={m.grup}>
              <div className="ak-grup">{m.grup}</div>
              {m.ogeler.map(o=>(
                <button key={o.id} title={o.ad} onClick={()=>git(o.id)} className={!dosyaGorunumu&&tab===o.id?"aktif":""} style={{"--g":m.g}}>
                  <i className="ak-ico">{o.ico}</i><span className="ak-et">{o.ad}</span>
                  {o.id==="araclar"&&toplamOkunmamis>0&&<span className="ak-rozet">{toplamOkunmamis}</span>}
                </button>
              ))}
            </div>
          ))}
          {seciliId&&(
            <div>
              <div className="ak-grup">Seçili Araç</div>
              <button title={seciliOzet?.dosyaNo} onClick={()=>git("onarim")} className={dosyaGorunumu?"aktif":""} style={{"--g":"var(--ak-c-intake)"}}>
                <i className="ak-ico">◈</i><span className="ak-et">{seciliOzet?.plaka||seciliOzet?.dosyaNo||"Araç"}</span>
              </button>
            </div>
          )}
        </nav>
        <div className="ak-alt"><div className="ak-kim"><b>{servisBilgi.ad.split("–")[0].trim()}</b>Servis</div><button onClick={onCikis} title="Çıkış">Çıkış</button></div>
      </aside>
      <main className="ak-main">
        {dosyaGorunumu?(
          <>
            <div className="ak-top" style={{height:"auto",minHeight:66,padding:`10px ${P}px`}}>

              <div style={{padding:"8px 0",borderBottom:"1px solid var(--border)",display:"flex",justifyContent:"space-between"}}><span style={{fontSize:12,color:"var(--text-2)"}}>Adres</span><span style={{fontSize:12,fontWeight:600,textAlign:"right",maxWidth:"60%"}}>{servisBilgi.adres}</span></div>
              <div style={{padding:"8px 0",display:"flex",justifyContent:"space-between"}}><span style={{fontSize:12,color:"var(--text-2)"}}>Telefon</span><a href={`tel:${servisBilgi.telefon}`} style={{fontSize:12,fontWeight:600,color:"#A78BFA"}}>{servisBilgi.telefon}</a></div>
            </Card>
            <Card>
              <ST>👤 Araç Sahibi (Seçili Araç)</ST>

                  <div style={{padding:"8px 0",borderBottom:"1px solid var(--border)",display:"flex",justifyContent:"space-between"}}><span style={{fontSize:12,color:"var(--text-2)"}}>Araç</span><span style={{fontSize:12,fontWeight:600}}>{detay.arac.plaka}</span></div>

        )}

  );
}


// ─── SERVİS GİRİŞ HESABI (Admin) ─────────────────────────────────────────
// Hesap yoksa e-posta + şifreyle açar, varsa şifreyi yeniler
function GirisHesabiKarti({servis,onKaydedildi}){
  const hesapVar=!!servis.kullanici_email;
  const [email,setEmail]=useState("");
  const [sifre,setSifre]=useState("");
  const [kaydediliyor,setKaydediliyor]=useState(false);
  const [mesaj,setMesaj]=useState(null); // {tip:"ok"|"hata",metin}
  const inp={width:"100%",background:"var(--surface-1)",border:"1px solid var(--border-md)",borderRadius:8,padding:"8px 10px",fontSize:12,color:"var(--text-1)",boxSizing:"border-box"};
  const kaydet=async()=>{
    setMesaj(null);
    if(sifre.length<8){setMesaj({tip:"hata",metin:"Şifre en az 8 karakter olmalı."});return;}
    if(!hesapVar&&!email.trim()){setMesaj({tip:"hata",metin:"Giriş e-postası gerekli."});return;}
    setKaydediliyor(true);
    try{
      await apiCall(`/servisler/${servis.id}`,"PATCH",hesapVar?{sifre}:{sifre,kullanici_email:email.trim()});
      setSifre("");setEmail("");
      setMesaj({tip:"ok",metin:hesapVar?"Şifre güncellendi.":"Giriş hesabı açıldı."});
      onKaydedildi&&onKaydedildi();
    }catch(e){setMesaj({tip:"hata",metin:e.message||"Kaydedilemedi."});}
    finally{setKaydediliyor(false);}
  };
  return(
    <div style={{background:"var(--surface-2)",border:"1px solid var(--border)",borderRadius:12,padding:"14px 16px",marginBottom:24}}>
      <ST>Giriş Hesabı</ST>
      <div style={{fontSize:12,color:"var(--text-2)",marginBottom:10}}>
        {hesapVar?<>Giriş e-postası: <b style={{color:"var(--text-1)"}}>{servis.kullanici_email}</b></>:"Bu servisin giriş hesabı yok. E-posta ve şifre girerek açabilirsin."}
      </div>
      <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
        {!hesapVar&&<input type="email" placeholder="Giriş e-postası" value={email} onChange={e=>setEmail(e.target.value)} style={{...inp,flex:"1 1 200px",width:"auto"}}/>}
        <input type="password" placeholder={hesapVar?"Yeni şifre (en az 8)":"Şifre (en az 8)"} value={sifre} onChange={e=>setSifre(e.target.value)} style={{...inp,flex:"1 1 160px",width:"auto"}}/>
        <button onClick={kaydet} disabled={kaydediliyor} style={{background:"#4F46E5",color:"#fff",border:"none",borderRadius:8,padding:"8px 14px",fontSize:12,fontWeight:700,opacity:kaydediliyor?.6:1}}>
          {kaydediliyor?"Kaydediliyor...":hesapVar?"Şifreyi Güncelle":"Hesap Aç"}
        </button>
      </div>
      {mesaj&&<div style={{fontSize:12,marginTop:8,color:mesaj.tip==="ok"?"#10B981":"#EF4444"}}>{mesaj.metin}</div>}
    </div>
  );
}

// ─── SERVİS DETAY (Admin Görünümü) ────────────────────────────────────────
function ServisDetayAdmin({servisId, onGeri}){
  const [acikDosya,setAcikDosya]=useState(null);
  const [isMobile,setIsMobile]=useState(false);
  const [servis,setServis]=useState(null);
  const [dosyalar,setDosyalar]=useState([]);
  const [islemVeri,setIslemVeri]=useState({}); // dosyaId -> {onayDurumu,kalemler}
  const [yukleniyor,setYukleniyor]=useState(true);
  const [hata,setHata]=useState("");
  useEffect(()=>{const c=()=>setIsMobile(window.innerWidth<768);c();window.addEventListener("resize",c);return()=>window.removeEventListener("resize",c);},[]);

  const yukle=async()=>{
    setYukleniyor(true);setHata("");
    try{
      const [sl,dl]=await Promise.all([
        apiCall("/servisler"),
        apiCall(`/dosyalar?servis_id=${encodeURIComponent(servisId)}&limit=200`),
      ]);
      const s=(sl.servisler||[]).find(x=>x.id===servisId);
      if(!s)throw new Error("Servis bulunamadı");
      const liste=esleListe(dl.dosyalar);
      const iv={};
      await Promise.all(liste.map(async d=>{
        const r=await apiCall(`/islemler/${d.id}`);
        iv[d.id]={onayDurumu:r.onay_durumu||"taslak",kalemler:(r.kalemler||[]).map(esleKalem)};
      }));
      setServis(s);setDosyalar(liste);setIslemVeri(iv);
    }catch(e){setHata(e.message||"Servis bilgileri alınamadı.");}
    finally{setYukleniyor(false);}
  };
  useEffect(()=>{yukle();},[servisId]);
  const P=isMobile?12:24;
  const kalemler=(id)=>(islemVeri[id]?.kalemler||[]);
  const toplamFatura=dosyalar.reduce((sum,d)=>sum+kalemler(d.id).reduce((s,k)=>s+k.birimFiyat*k.miktar,0),0);
  const onaylananToplam=dosyalar.reduce((sum,d)=>sum+kalemler(d.id).filter(k=>k.durum==="onaylandi").reduce((s,k)=>s+k.birimFiyat*k.miktar,0),0);
  const bekleyenOnay=dosyalar.filter(d=>islemVeri[d.id]?.onayDurumu==="bekliyor").length;

  const DURUM_BADGE={
    taslak:    {l:"Taslak",         c:"var(--text-3)",bg:"rgba(100,116,139,0.12)"},
    bekliyor:  {l:"⏳ Onay Bekliyor",c:"#F59E0B",bg:"rgba(245,158,11,0.12)"},
    onaylandi: {l:"✓ Onaylandı",    c:"#10B981",bg:"rgba(16,185,129,0.12)"},
    reddedildi:{l:"✕ Reddedildi",   c:"#EF4444",bg:"rgba(239,68,68,0.12)"},
  };

  if(yukleniyor)return <YuklemeEkrani metin="Servis bilgileri yükleniyor..."/>;
  if(hata||!servis)return(
    <div style={{fontFamily:"'Inter',sans-serif",background:"var(--bg)",minHeight:"100vh",color:"var(--text-1)",padding:24}}>
      <button onClick={onGeri} style={{background:"var(--border)",border:"1px solid var(--border-md)",color:"var(--text-2)",borderRadius:7,padding:"5px 12px",fontSize:11,fontWeight:600,marginBottom:16}}>← Geri</button>
      <HataKutusu hata={hata||"Servis bulunamadı"} onTekrar={yukle}/>
    </div>
  );

  return(
    <div style={{fontFamily:"'Inter',sans-serif",background:"var(--bg)",minHeight:"100vh",color:"var(--text-1)"}}>
      {/* Header */}
      <div style={{background:"var(--surface-1)",borderBottom:"1px solid rgba(255,255,255,0.07)",padding:`0 ${P}px`,height:56,display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:50}}>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <button onClick={onGeri} style={{background:"var(--border)",border:"1px solid var(--border-md)",color:"var(--text-2)",borderRadius:7,padding:"5px 12px",fontSize:11,fontWeight:600}}>← Geri</button>
          <div style={{width:32,height:32,borderRadius:8,background:"linear-gradient(135deg,#5B21B6,#8B5CF6)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16}}>🔧</div>
          <div>
            <div style={{fontWeight:800,fontSize:14}}>{servis.ad}</div>
            <div style={{fontSize:10,color:"var(--text-2)"}}>{servis.adres}</div>
          </div>
        </div>
        {bekleyenOnay>0&&(
          <div style={{display:"flex",alignItems:"center",gap:6,background:"rgba(245,158,11,0.12)",border:"1px solid rgba(245,158,11,0.3)",borderRadius:8,padding:"5px 12px"}}>
            <span style={{fontSize:16}}>⏳</span>
            <span style={{fontSize:12,fontWeight:700,color:"#F59E0B"}}>{bekleyenOnay} Onay Bekliyor</span>
          </div>
        )}
      </div>

      <div style={{maxWidth:860,margin:"0 auto",padding:`${isMobile?16:32}px ${P}px`}}>

        {/* Servis özet kartları */}
        <div style={{display:"grid",gridTemplateColumns:isMobile?"1fr 1fr":"repeat(4,1fr)",gap:10,marginBottom:24}}>
          {[
            {l:"Toplam Araç",     v:dosyalar.length,                                   c:"#8B5CF6"},
            {l:"Bekleyen Onay",   v:bekleyenOnay,                                       c:bekleyenOnay>0?"#F59E0B":"var(--text-3)"},
            {l:"Toplam Fatura",   v:`${toplamFatura.toLocaleString("tr-TR")} ₺`,        c:"#EF4444"},
            {l:"Onaylanan Tutar", v:`${onaylananToplam.toLocaleString("tr-TR")} ₺`,     c:"#10B981"},
          ].map(k=>(
            <div key={k.l} style={{background:"var(--surface-2)",border:"1px solid var(--border)",borderRadius:12,padding:"12px 14px"}}>
              <div style={{fontSize:9,color:"var(--text-2)",fontWeight:700,marginBottom:5}}>{k.l.toUpperCase()}</div>
              <div style={{fontSize:isMobile?16:22,fontWeight:800,color:k.c}}>{k.v}</div>
            </div>
          ))}
        </div>

        <GirisHesabiKarti servis={servis} onKaydedildi={yukle}/>

        {/* Her dosya için kart */}
        {dosyalar.length===0?(
          <div style={{textAlign:"center",padding:"40px 20px",color:"rgba(15,23,42,0.06)"}}>
            <div style={{fontSize:44,marginBottom:12}}>🚗</div>
            <div style={{fontWeight:700,fontSize:14}}>Bu servise atanmış araç yok</div>
          </div>
        ):(
          <div style={{display:"flex",flexDirection:"column",gap:12}}>
            {dosyalar.map(d=>{
              const islVeri=islemVeri[d.id]||{onayDurumu:"taslak",kalemler:[]};
              const badge=DURUM_BADGE[islVeri.onayDurumu]||DURUM_BADGE.taslak;
              const toplamD=islVeri.kalemler.reduce((s,k)=>s+k.birimFiyat*k.miktar,0);
              const onaylananD=islVeri.kalemler.filter(k=>k.durum==="onaylandi").reduce((s,k)=>s+k.birimFiyat*k.miktar,0);
              const acik=acikDosya===d.id;
              const dc=d.durum==="Aktif"?"#4F46E5":"#10B981";

              return(
                <div key={d.id} style={{background:"var(--surface-2)",border:`1px solid ${acik?"rgba(139,92,246,0.35)":"var(--border)"}`,borderRadius:14,overflow:"hidden"}}>
                  {/* Dosya başlık satırı */}
                  <div style={{padding:"14px 16px",cursor:"pointer",display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}
                    onClick={()=>setAcikDosya(acik?null:d.id)}>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap",marginBottom:6}}>
                        <div style={{fontFamily:"var(--font-mono)",fontSize:11,fontWeight:700,color:"#818CF8",background:"rgba(79,70,229,0.12)",padding:"2px 8px",borderRadius:5}}>{d.dosyaNo}</div>

// Admin tüm dosyaları, servis yalnız kendine atananları görür (API kapsar).
function useApiVeri(url,bagimlilik=[]){
  const [veri,setVeri]=useState(null);const [hata,setHata]=useState("");
  const yukle=()=>{setHata("");apiCall(url).then(setVeri).catch(e=>setHata(e.message||"Veri alınamadı."));};
  useEffect(()=>{setVeri(null);yukle();},[url,...bagimlilik]);
  return [veri,hata,yukle];
}
function ModulDurum({hata,yukle,metin="Yükleniyor..."}){
  return hata?<HataKutusu hata={hata} onTekrar={yukle}/>:<div className="ak-bos"><span style={{animation:"pulse .8s infinite"}}>{metin}</span></div>;
}
function KpiSatiri({ogeler}){
  return <section className="ak-kpis">{ogeler.map(x=><div key={x.l} className="ak-kart ak-kpi" style={{"--k":x.k,cursor:"default"}}><div className="l">{x.l}</div><b>{x.v}</b><div className="s">{x.s}</div></div>)}</section>;
}
const aracAd=(x)=>[x.marka,x.model].filter(Boolean).join(" ");
const sureMetni=(ms)=>{const g=Math.round(ms/86400000);return g<=0?"aynı gün":`${g} gün`;};

// Araç Kabul & Teslim

  const ds=veri.dosyalar;
  const kabulBekleyen=ds.filter(x=>x.durum==="Aktif"&&!x.kabul_trh);
  const serviste=ds.filter(x=>x.kabul_trh&&!x.teslim_trh&&x.durum!=="İptal");
  const teslimEdilen=ds.filter(x=>x.teslim_trh);
  const hazir=serviste.filter(x=>x.kalan_adim<=1);
  const sureler=teslimEdilen.filter(x=>x.kabul_trh).map(x=>new Date(x.teslim_trh)-new Date(x.kabul_trh));
  const ort=sureler.length?Math.round(sureler.reduce((a,b)=>a+b,0)/sureler.length/86400000):null;
  const tablo=(liste,bos,sutunlar)=>liste.length===0?<div className="ak-bos">{bos}</div>:(
    <table className="ak-tablo"><thead><tr><th>Araç</th>{sutunlar.map(s=><th key={s[0]} className={s[2]||""}>{s[0]}</th>)}</tr></thead>
      <tbody>{liste.map(x=><tr key={x.dosya_id} className="satir" onClick={()=>onDosyaSec(x.dosya_id)}>
        <td><span className="no">{x.plaka||x.dosya_no}</span><span className="alt"><span style={{whiteSpace:"nowrap"}}>{x.dosya_no}</span> · {aracAd(x)}</span></td>
        {sutunlar.map(s=><td key={s[0]} className={s[2]||""}>{s[1](x)}</td>)}
      </tr>)}</tbody></table>);
  return(
    <>
      <KpiSatiri ogeler={[
        {l:"Kabul bekleyen",v:kabulBekleyen.length,s:"Tutanağı doldurulmamış aktif araç",k:"var(--ak-c-intake)"},
        {l:"Serviste",v:serviste.length,s:`${hazir.length} araç teslime hazır`,k:"var(--ak-c-repair)"},
        {l:"Teslim edilen",v:teslimEdilen.length,s:"Teslim tutanağı imzalı",k:"var(--ak-c-portal)"},
        {l:"Ortalama servis süresi",v:ort===null?"—":`${ort} gün`,s:"Kabulden teslime",k:"var(--ak-c-supply)"}]}/>
      <div className="ak-iki">
        <section className="ak-kart" style={{overflowX:"auto"}}>
          <div className="ak-baslik"><h3>Serviste olan araçlar</h3><span>{serviste.length}</span></div>
          {tablo(serviste,"Serviste araç yok.",[
            ["Kabul",x=><span className="alt">{trTarihZaman(x.kabul_trh)} · {Number(x.kabul_km).toLocaleString("tr-TR")} km</span>,"gizle"],
            ["Aşama",x=>x.kalan_adim<=1?<span className="ak-cip ak-ok">Teslime hazır</span>:<span className="ak-cip ak-bilgi">{x.aktif_adim||"—"}</span>],
            ["Teslim",x=>x.tahmini_teslimat?<span className={`ak-cip ${gunFarki(x.tahmini_teslimat)<0?"ak-tehlike":"ak-gri"}`}>{trTarih(x.tahmini_teslimat)}</span>:"—"]])}
        </section>
        <section className="ak-kart">
          <div className="ak-baslik"><h3>Kabul bekleyen</h3><span>{kabulBekleyen.length}</span></div>
          {kabulBekleyen.length===0?<div className="ak-bos">Tüm aktif araçların kabulü yapılmış.</div>:kabulBekleyen.map(x=>(
            <button key={x.dosya_id} className="ak-ajanda" style={{"--g":"var(--ak-c-intake)"}} onClick={()=>onDosyaSec(x.dosya_id)}><b>{x.plaka} · {x.dosya_no}</b><span>{aracAd(x)} · {x.sahip_ad||"—"} · Onarım sekmesinden kabul tutanağı</span></button>
          ))}
        </section>
      </div>
      <section className="ak-kart" style={{marginTop:14,overflowX:"auto"}}>
        <div className="ak-baslik"><h3>Teslim edilen araçlar</h3><span>{teslimEdilen.length}</span></div>

          ["Kilometre",x=>x.kabul_km!=null?`${Number(x.kabul_km).toLocaleString("tr-TR")} → ${Number(x.teslim_km).toLocaleString("tr-TR")}`:"—","gizle"],
          ["Süre",x=>x.kabul_trh?sureMetni(new Date(x.teslim_trh)-new Date(x.kabul_trh)):"—"]])}
      </section>
    </>
  );
}

// Ekspertiz & Sigorta
const EKSPER_CIP={"Onaylandı":"ak-ok","Kısmi Onay":"ak-uyari","Reddedildi":"ak-tehlike","İncelemede":"ak-bilgi","Beklemede":"ak-gri"};
function EkspertizSayfasi({onDosyaSec}){
  const [veri,hata,yukle]=useApiVeri("/moduller/ekspertiz");
  if(!veri)return <ModulDurum hata={hata} yukle={yukle}/>;
  const ds=veri.dosyalar.filter(x=>x.durum!=="İptal");
  const aktif=ds.filter(x=>x.durum==="Aktif");
  const ekspersiz=aktif.filter(x=>!x.eksper_ad);
  const bekleyen=ds.filter(x=>x.onay_bekleme_gun!==null);
  const toplam=(f)=>ds.reduce((s,x)=>s+Number(f(x)||0),0);
  const sirketler=Object.values(ds.reduce((m,x)=>{const k=x.sirket_ad||"Sigortasız";m[k]=m[k]||{ad:k,adet:0,muallak:0,teklif:0,onay:0};m[k].adet++;m[k].muallak+=Number(x.muallak_hasar||0);m[k].teklif+=Number(x.teklif_tutar||0);m[k].onay+=Number(x.onaylanan_tutar||0);return m;},{})).sort((a,b)=>b.teklif-a.teklif);
  return(
    <>
      <KpiSatiri ogeler={[
        {l:"Eksper atanmamış",v:ekspersiz.length,s:`${aktif.length} aktif dosyanın`,k:"var(--ak-c-intake)"},
        {l:"Onay bekleyen",v:bekleyen.length,s:bekleyen.length?`En eski ${Math.max(...bekleyen.map(x=>x.onay_bekleme_gun))} gündür`:"Bekleyen yok",k:"var(--ak-c-supply)"},
        {l:"Teklif toplamı",v:tlBicim(toplam(x=>x.teklif_tutar))||"0 ₺",s:"İptal edilmemiş iş emirleri",k:"var(--ak-c-repair)"},
        {l:"Onaylanan",v:tlBicim(toplam(x=>x.onaylanan_tutar))||"0 ₺",s:`Muallak ${tlBicim(toplam(x=>x.muallak_hasar))||"0 ₺"}`,k:"var(--ak-c-portal)"}]}/>
      <section className="ak-kart" style={{overflowX:"auto"}}>
        <div className="ak-baslik"><h3>Ekspertiz ve sigorta dosyaları</h3><span>{ds.length} dosya</span></div>
        <table className="ak-tablo">
          <thead><tr><th>Dosya</th><th className="gizle">Sigorta</th><th className="gizle">Eksper</th><th>Eksper kararı</th><th className="gizle">Teklif</th><th>Onaylanan</th><th className="gizle">Onay turu</th></tr></thead>
          <tbody>{ds.map(x=>(
            <tr key={x.dosya_id} className="satir" onClick={()=>onDosyaSec(x.dosya_id)}>
              <td><span className="no">{x.dosya_no}</span><span className="alt">{x.plaka} · {aracAd(x)}</span></td>
              <td className="gizle">{x.sirket_ad||"—"}<span className="alt">{[x.sigorta_bransi,x.hasar_no].filter(Boolean).join(" · ")}</span></td>
              <td className="gizle">{x.eksper_ad||<span className="ak-cip ak-uyari">Atanmadı</span>}<span className="alt">{[x.eksper_firma,trTarih(x.inceleme_tarihi)].filter(Boolean).join(" · ")}</span></td>
              <td><span className={`ak-cip ${EKSPER_CIP[x.eksper_onay]||"ak-gri"}`}>{x.eksper_onay}</span></td>
              <td className="gizle">{tlBicim(x.teklif_tutar)||"—"}</td>
              <td style={{fontWeight:600}}>{tlBicim(x.onaylanan_tutar)||"—"}</td>
              <td className="gizle">{x.onay_bekleme_gun!==null?<span className="ak-cip ak-uyari">{x.onay_bekleme_gun} gündür bekliyor</span>:<span className="alt">{x.is_emri_sayisi} iş emri</span>}</td>
            </tr>
          ))}</tbody>
        </table>
      </section>
      <section className="ak-kart" style={{marginTop:14,overflowX:"auto"}}>
        <div className="ak-baslik"><h3>Sigorta şirketine göre</h3><span>{sirketler.length} şirket</span></div>
        <table className="ak-tablo">
          <thead><tr><th>Sigorta şirketi</th><th>Dosya</th><th className="gizle">Muallak</th><th>Teklif</th><th>Onaylanan</th><th className="gizle">Onay oranı</th></tr></thead>
          <tbody>{sirketler.map(s=>(
            <tr key={s.ad}><td className="no">{s.ad}</td><td>{s.adet}</td><td className="gizle">{tlBicim(s.muallak)||"—"}</td><td>{tlBicim(s.teklif)||"—"}</td><td style={{fontWeight:600}}>{tlBicim(s.onay)||"—"}</td>
              <td className="gizle">{s.teklif?<><div className="ak-ilerleme"><div style={{width:`${Math.min(100,Math.round(s.onay/s.teklif*100))}%`}}/></div><span className="alt">%{Math.round(s.onay/s.teklif*100)}</span></>:"—"}</td></tr>
          ))}</tbody>
        </table>
      </section>
    </>
  );
}

// Kaporta / Boya / Mekanik operasyonu: bir bölümün görevleri durum sütunlarında
const BOLUM_SAYFA={kaporta:{g:"var(--ak-c-repair)"},boya:{g:"var(--ak-c-finance)"},mekanik:{g:"var(--ak-c-supply)"}};
const GOREV_SUTUN=[["bekliyor","Sırada","#94a3b8"],["devam","Devam ediyor","#3b82f6"],["beklemede","Beklemede","#f59e0b"],["tamam","Son 30 günde biten","#10b981"]];
function BolumSayfasi({bolum,onDosyaSec}){
  const [veri,hata,yukle]=useApiVeri(`/moduller/bolum/${bolum}`);
  if(!veri)return <ModulDurum hata={hata} yukle={yukle}/>;
  const gs=veri.gorevler;
  const acik=gs.filter(x=>x.durum!=="tamam");
  const biten=gs.filter(x=>x.durum==="tamam"&&x.sure_saat!=null);
  const ortSure=biten.length?(biten.reduce((s,x)=>s+Number(x.sure_saat),0)/biten.length):null;
  const ustalar=Object.entries(acik.reduce((m,x)=>{const u=x.sorumlu_usta||"Atanmadı";m[u]=(m[u]||0)+1;return m;},{})).sort((a,b)=>b[1]-a[1]);
  return(
    <>
      <KpiSatiri ogeler={[
        {l:"Açık görev",v:acik.length,s:`${new Set(acik.map(x=>x.dosya_id)).size} araçta`,k:BOLUM_SAYFA[bolum]?.g},
        {l:"Devam eden",v:gs.filter(x=>x.durum==="devam").length,s:`${gs.filter(x=>x.durum==="bekliyor").length} sırada`,k:"#3b82f6"},
        {l:"Beklemede",v:gs.filter(x=>x.durum==="beklemede").length,s:"Parça veya onay bekliyor",k:"#f59e0b"},
        {l:"Son 30 günde biten",v:gs.filter(x=>x.durum==="tamam").length,s:ortSure===null?"Süre verisi yok":`Ortalama ${ortSure<24?`${ortSure.toFixed(1)} saat`:`${(ortSure/24).toFixed(1)} gün`}`,k:"#10b981"}]}/>
      <section className="ak-kart">
        <div className="ak-baslik"><h3>{veri.bolum.ad} işleri</h3><span>Adımlar: {veri.bolum.adimlar.join(" → ")}</span></div>
        <div className="ak-kanban" style={{gridTemplateColumns:"repeat(4,minmax(180px,1fr))"}}>
          {GOREV_SUTUN.map(([d,ad,renk])=>{const ls=gs.filter(x=>x.durum===d);return(
            <div key={d} className="ak-sutun" style={{"--g":renk}}>
              <h4><span>{ad}</span><span>{ls.length}</span></h4>
              {ls.map(x=>(
                <button key={x.id} className="ak-bilet" onClick={()=>onDosyaSec(x.dosya_id)}>
                  <b>{x.plaka||x.dosya_no}</b>
                  <p>{x.aciklama||"Açıklama yok"}<br/>👷 {x.durum==="tamam"?(x.bitiren_usta||x.sorumlu_usta||"—"):(x.sorumlu_usta||"Usta atanmadı")} · {x.biten_adim}/{x.adim_sayisi} adım
                    {x.durum==="beklemede"&&x.bekleme_nedeni?<><br/>⏸ {x.bekleme_nedeni}</>:null}
                    {x.durum!=="tamam"?<><br/>{x.aktif_adim?`Sıradaki: ${x.aktif_adim}`:""}{x.gun?` · ${x.gun} gündür`:""}</>:<><br/>{trTarihZaman(x.bitis_trh)}{x.sure_saat!=null?` · ${Number(x.sure_saat)<24?`${x.sure_saat} saat`:`${(x.sure_saat/24).toFixed(1)} gün`}`:""}</>}
                  </p>
                </button>
              ))}
            </div>
          );})}
        </div>
      </section>
      {ustalar.length>0&&(
        <section className="ak-kart" style={{marginTop:14}}>
          <div className="ak-baslik"><h3>Usta yükü</h3><span>Açık görev sayısı</span></div>
          {ustalar.map(([u,n])=>(
            <div key={u} style={{display:"flex",alignItems:"center",gap:10,padding:"6px 0"}}>
              <span style={{width:140,fontSize:12,fontWeight:600}}>{u}</span>
              <div className="ak-ilerleme" style={{flex:1,height:8}}><div style={{width:`${n/ustalar[0][1]*100}%`,background:BOLUM_SAYFA[bolum]?.g}}/></div>
              <span style={{fontSize:12,color:"#556370",width:24,textAlign:"right"}}>{n}</span>
            </div>
          ))}
        </section>
      )}
    </>
  );
}

// Fotoğraf & Evrak
function MedyaSayfasi({onDosyaSec}){
  const [veri,hata,yukle]=useApiVeri("/moduller/medya");
  if(!veri)return <ModulDurum hata={hata} yukle={yukle}/>;
  const ds=veri.dosyalar;
  const eksikli=ds.filter(x=>x.evrak_eksik>0);
  const tam=ds.filter(x=>x.evrak_toplam>0&&x.evrak_tamam===x.evrak_toplam);
  const fotosuz=ds.filter(x=>x.durum==="Aktif"&&x.foto_sayisi===0);
  return(
    <>
      <KpiSatiri ogeler={[
        {l:"Toplam fotoğraf",v:ds.reduce((s,x)=>s+x.foto_sayisi,0),s:`${fotosuz.length} aktif dosyada fotoğraf yok`,k:"var(--ak-c-intake)"},
        {l:"Eksik evrak",v:ds.reduce((s,x)=>s+x.evrak_eksik,0),s:`${eksikli.length} dosyada`,k:"#ef4444"},
        {l:"Bekleyen evrak",v:ds.reduce((s,x)=>s+(x.evrak_toplam-x.evrak_tamam-x.evrak_eksik),0),s:"Henüz gelmedi",k:"var(--ak-c-supply)"},
        {l:"Evrakı tam dosya",v:tam.length,s:`${ds.length} dosyanın`,k:"var(--ak-c-portal)"}]}/>
      <div className="ak-iki">
        <section className="ak-kart" style={{overflowX:"auto"}}>
          <div className="ak-baslik"><h3>Dosya bazında</h3><span>{ds.length} dosya</span></div>
          <table className="ak-tablo">
            <thead><tr><th>Dosya</th><th>Fotoğraf</th><th>Evrak</th><th className="gizle">Durum</th></tr></thead>
            <tbody>{ds.map(x=>{const p=x.evrak_toplam?Math.round(x.evrak_tamam/x.evrak_toplam*100):0;return(
              <tr key={x.dosya_id} className="satir" onClick={()=>onDosyaSec(x.dosya_id)}>
                <td><span className="no">{x.plaka||x.dosya_no}</span><span className="alt"><span style={{whiteSpace:"nowrap"}}>{x.dosya_no}</span> · {aracAd(x)}</span></td>
                <td>{x.foto_sayisi?<span className="ak-cip ak-bilgi">📷 {x.foto_sayisi}</span>:<span className="ak-cip ak-gri">Yok</span>}<span className="alt">{x.son_foto?trTarihZaman(x.son_foto):""}</span></td>
                <td><div className="ak-ilerleme"><div style={{width:`${p}%`,background:x.evrak_eksik?"#ef4444":"#10b981"}}/></div><span className="alt">{x.evrak_tamam}/{x.evrak_toplam} tamam</span></td>
                <td className="gizle">{x.evrak_eksik?<span className="ak-cip ak-tehlike">{x.evrak_eksik} eksik</span>:p===100?<span className="ak-cip ak-ok">Tam</span>:<span className="ak-cip ak-gri">Bekliyor</span>}</td>
              </tr>);})}</tbody>
          </table>
        </section>
        <section className="ak-kart" style={{alignSelf:"start"}}>
          <div className="ak-baslik"><h3>Eksik evraklar</h3><span>{eksikli.length} dosya</span></div>
          {eksikli.length===0?<div className="ak-bos">Eksik işaretli evrak yok.</div>:eksikli.map(x=>(
            <button key={x.dosya_id} className="ak-ajanda" style={{"--g":"#ef4444"}} onClick={()=>onDosyaSec(x.dosya_id)}><b>{x.plaka} · {x.dosya_no}</b><span>{x.eksik_liste.join(", ")}</span></button>
          ))}
        </section>
      </div>
    </>
  );
}

// ─── PANEL MODÜLLERİ (Paket 2): finans, plan, satın alma, tedarikçi, operasyon, BI ──
// Grafik renkleri: tek seri mavi; iki seri mavi + turuncu (validate_palette ile doğrulandı).
// Durum renkleri (Gantt) her zaman etiket/lejantla birlikte.
const GR_MAVI="#2a78d6", GR_TURUNCU="#eb6834";
const DURUM_RENK={iyi:"#0ca30c",uyari:"#fab219",kritik:"#d03b3b"};
// Eksen üst sınırı: yarısı da tam sayı olan yuvarlak değer (4, 10, 20, 40, 100...)
const yuvarlakMaks=(m)=>{if(m<=4)return 4;const us=Math.pow(10,Math.floor(Math.log10(m)));return [1,2,4,5,10].map(k=>k*us).find(v=>v>=m&&(v/2)%1===0)||10*us;};
const AYLAR=["Oca","Şub","Mar","Nis","May","Haz","Tem","Ağu","Eyl","Eki","Kas","Ara"];
const ayEtiket=(ym)=>{const [y,a]=ym.split("-");return `${AYLAR[Number(a)-1]} ${y.slice(2)}`;};

// Dikey çubuk grafiği: tek eksen, aynı birim; ipucu tüm grubu kapsar (geniş hedef)
function CubukGrafik({etiketler,seriler,yukseklik=170,birim=""}){
  const maks=yuvarlakMaks(Math.max(1,...seriler.flatMap(s=>s.degerler)));
  return(
    <div>
      {seriler.length>1&&<div className="gr-lejant">{seriler.map(s=><span key={s.ad}><i style={{background:s.renk}}/>{s.ad}</span>)}</div>}
      <div className="gr-alan" style={{height:yukseklik,marginBottom:26}}>
        <div className="gr-izgara">{[1,0.5,0].map(o=><div key={o} style={{bottom:`${o*100}%`}}><span>{Math.round(maks*o)}</span></div>)}</div>
        <div className="gr-gruplar">
          {etiketler.map((e,i)=>(
            <div key={e} className="gr-grup">
              <div className="gr-ipucu">{e}{seriler.map(s=><div key={s.ad}>{s.ad}: <b>{s.degerler[i]}{birim}</b></div>)}</div>
              <div className="gr-cubuklar">{seriler.map(s=><div key={s.ad} className="gr-cubuk" style={{height:`${s.degerler[i]/maks*100}%`,background:s.renk}}/>)}</div>
              <div className="gr-etiket">{e}</div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}
// Yatay çubuk listesi: ad, çubuk, değer (değer yazı renginde)
function YatayCubuklar({satirlar,renk=GR_MAVI,bicim=(v)=>v}){
  const maks=Math.max(1e-9,...satirlar.map(x=>x.deger));
  return <div className="gr-yatay">{satirlar.map(x=>(
    <React.Fragment key={x.ad}><span className="ad" title={x.ad}>{x.ad}</span><div className="iz" title={`${x.ad}: ${bicim(x.deger)}`}><div style={{width:`${x.deger/maks*100}%`,background:x.renk||renk}}/></div><span className="dg">{bicim(x.deger)}</span></React.Fragment>
  ))}</div>;
}

const ALICI_AD={sigorta:"Sigorta",musteri:"Müşteri",acente:"Acente",diger:"Diğer"};
function FinansSayfasi({onDosyaSec}){
  const [veri,hata,yukle]=useApiVeri("/moduller/finans");
  if(!veri)return <ModulDurum hata={hata} yukle={yukle}/>;
  const fs=veri.faturalar, dis=veri.dis_faturalar;
  const top=(l,k)=>l.reduce((s,x)=>s+Number(x[k]||0),0);
  const acik=fs.filter(x=>Number(x.kalan)>0.005);
  const kova=[["0–30 gün",0,30],["31–60 gün",31,60],["61–90 gün",61,90],["90+ gün",91,1e9]].map(([ad,a,b])=>({ad,deger:acik.filter(x=>x.yas_gun>=a&&x.yas_gun<=b).reduce((s,x)=>s+Number(x.kalan),0)}));
  const alici=Object.keys(ALICI_AD).map(k=>{const l=fs.filter(x=>x.alici_tipi===k);return {k,ad:ALICI_AD[k],fatura:top(l,"toplam"),odenen:top(l,"odenen_tutar"),kalan:top(l,"kalan"),adet:l.length};}).filter(x=>x.adet);
  const durum=(x)=>Number(x.kalan)<=0.005?<span className="ak-cip ak-ok">Ödendi</span>:Number(x.odenen_tutar)>0?<span className="ak-cip ak-uyari">Kısmi</span>:<span className="ak-cip ak-gri">Bekliyor</span>;
  return(
    <>
      <KpiSatiri ogeler={[
        {l:"Faturalanan",v:tlBicim(top(fs,"toplam"))||"0 ₺",s:`${fs.length} servis faturası, KDV dahil`,k:"var(--ak-c-intake)"},
        {l:"Tahsil edilen",v:tlBicim(top(fs,"odenen_tutar"))||"0 ₺",s:`${fs.filter(x=>Number(x.kalan)<=0.005).length} fatura kapandı`,k:"var(--ak-c-portal)"},
        {l:"Açık alacak",v:tlBicim(top(acik,"kalan"))||"0 ₺",s:`${acik.length} faturada`,k:acik.length?"var(--ak-c-supply)":"var(--ak-c-portal)"},
        {l:"Dış hizmet gideri",v:tlBicim(top(dis,"toplam"))||"0 ₺",s:`${dis.filter(x=>!x.yansitildi).length} fatura servis faturasına yansımadı`,k:"var(--ak-c-finance)"}]}/>
      <div className="ak-iki">
        <section className="ak-kart" style={{overflowX:"auto"}}>
          <div className="ak-baslik"><h3>Alıcıya göre</h3><span>KDV dahil</span></div>
          {alici.length===0?<div className="ak-bos">Henüz servis faturası yok.</div>:(
            <table className="ak-tablo"><thead><tr><th>Alıcı</th><th>Fatura</th><th>Faturalanan</th><th className="gizle">Ödenen</th><th>Kalan</th></tr></thead>
              <tbody>{alici.map(x=><tr key={x.k}><td className="no">{x.ad}</td><td>{x.adet}</td><td>{tlBicim(x.fatura)}</td><td className="gizle">{tlBicim(x.odenen)||"0 ₺"}</td><td style={{fontWeight:600}}>{tlBicim(x.kalan)||"0 ₺"}</td></tr>)}</tbody></table>
          )}
        </section>
        <section className="ak-kart">
          <div className="ak-baslik"><h3>Açık alacak yaşı</h3><span>Fatura tarihinden bugüne</span></div>
          <YatayCubuklar satirlar={kova} bicim={(v)=>tlBicim(v)||"0 ₺"}/>
        </section>
      </div>
      <section className="ak-kart" style={{marginTop:14,overflowX:"auto"}}>
        <div className="ak-baslik"><h3>Servis faturaları</h3><span>{fs.length}</span></div>
        {fs.length===0?<div className="ak-bos">Fatura yok.</div>:(
          <table className="ak-tablo"><thead><tr><th>Dosya</th><th>Alıcı</th><th className="gizle">Fatura</th><th>Toplam</th><th className="gizle">Ödenen</th><th>Durum</th></tr></thead>
            <tbody>{fs.map(x=><tr key={x.id} className="satir" onClick={()=>onDosyaSec(x.dosya_id)}>
              <td><span className="no">{x.plaka||x.dosya_no}</span><span className="alt">{x.dosya_no}</span></td>
              <td>{x.alici_ad}<span className="alt">{ALICI_AD[x.alici_tipi]}</span></td>
              <td className="gizle">{x.fatura_no||"No yok"}<span className="alt">{trTarih(x.fatura_trh)||"Tarih yok"}</span></td>
              <td style={{fontWeight:600}}>{tlBicim(x.toplam)}</td>
              <td className="gizle">{tlBicim(x.odenen_tutar)||"0 ₺"}<span className="alt">{x.odeme_trh?trTarih(x.odeme_trh):""}</span></td>
              <td>{durum(x)}{Number(x.kalan)>0.005&&<span className="alt">{tlBicim(x.kalan)} · {x.yas_gun} gün</span>}</td>
            </tr>)}</tbody></table>

      <section className="ak-kart" style={{marginTop:14,overflowX:"auto"}}>
        <div className="ak-baslik"><h3>Dış hizmet faturaları</h3><span>{dis.length}</span></div>

          <table className="ak-tablo"><thead><tr><th>Dosya</th><th>Firma / hizmet</th><th className="gizle">Fatura</th><th>Toplam</th><th>Yansıtma</th></tr></thead>
            <tbody>{dis.map(x=><tr key={x.id} className="satir" onClick={()=>onDosyaSec(x.dosya_id)}>
              <td><span className="no">{x.plaka||x.dosya_no}</span><span className="alt">{x.dosya_no}</span></td>
              <td>{x.firma}<span className="alt">{x.hizmet}</span></td>
              <td className="gizle">{x.fatura_no||"—"}<span className="alt">{trTarih(x.fatura_trh)}</span></td>
              <td style={{fontWeight:600}}>{tlBicim(x.toplam)}</td>
              <td>{x.yansitildi?<span className="ak-cip ak-ok">Yansıtıldı</span>:<span className="ak-cip ak-uyari">Yansıtılmadı</span>}</td>
            </tr>)}</tbody></table>
        )}
      </section>
    </>
  );
}

// Gantt Planlama: dosya çubuğu (servise giriş → tahmini teslim) ve altında bölüm görevleri
const BOLUM_AD={sokum:"Söküm",kaporta:"Kaporta",boya:"Boya",mekanik:"Mekanik",elektrik:"Elektrik",montaj:"Montaj",dis_hizmet:"Dış hizmet"};
function GanttSayfasi({onDosyaSec}){
  const [veri,hata,yukle]=useApiVeri("/moduller/plan");
  const [gorevler,setGorevler]=useState(true);
  if(!veri)return <ModulDurum hata={hata} yukle={yukle}/>;
  const gun0=new Date();gun0.setHours(0,0,0,0);
  const bas=new Date(gun0.getTime()-14*864e5), GUN=42, bit=new Date(bas.getTime()+GUN*864e5);
  const yuzde=(t)=>Math.max(0,Math.min(100,(t-bas)/(bit-bas)*100));
  const tarih=(v)=>v?new Date(String(v).length<=10?`${v}T00:00:00`:v):null;
  const gunler=Array.from({length:GUN},(_,i)=>new Date(bas.getTime()+i*864e5));
  const ds=veri.dosyalar;
  const durumu=(x)=>{const g=gunFarki(x.tahmini_teslimat);return g===null?"plan":g<0?"kritik":g<=2?"uyari":"iyi";};
  const sayi={iyi:ds.filter(x=>durumu(x)==="iyi").length,uyari:ds.filter(x=>durumu(x)==="uyari").length,kritik:ds.filter(x=>durumu(x)==="kritik").length};
  const izgara=(<>{gunler.map((g,i)=><div key={i} className={`gt-gun${g.getDay()===1?" hafta":""}`} style={{left:`${i/GUN*100}%`}}/>)}<div className="gt-bugun" style={{left:`${yuzde(gun0.getTime()+12*36e5)}%`}} title="Bugün"/></>);
  return(
    <>
      <KpiSatiri ogeler={[
        {l:"Planlanan araç",v:ds.length,s:"Aktif dosya",k:"var(--ak-c-intake)"},
        {l:"Zamanında",v:sayi.iyi,s:"Teslime 3 günden fazla var",k:DURUM_RENK.iyi},
        {l:"Riskli",v:sayi.uyari,s:"Teslime 2 gün veya daha az",k:DURUM_RENK.uyari},
        {l:"Gecikmiş",v:sayi.kritik,s:"Tahmini teslim geçti",k:DURUM_RENK.kritik}]}/>
      <section className="ak-kart">
        <div className="ak-baslik">
          <h3>Atölye planı · {gunler[0].toLocaleDateString("tr-TR",{day:"numeric",month:"short"})} – {gunler[GUN-1].toLocaleDateString("tr-TR",{day:"numeric",month:"short"})}</h3>
          <div className="ak-filtre"><button className={gorevler?"sec":""} onClick={()=>setGorevler(v=>!v)}>Bölüm görevleri</button></div>
        </div>
        <div className="gr-lejant">
          <span><i style={{background:DURUM_RENK.iyi}}/>✓ Zamanında</span><span><i style={{background:DURUM_RENK.uyari}}/>! Riskli</span><span><i style={{background:DURUM_RENK.kritik}}/>✕ Gecikmiş</span><span><i style={{background:"#cbd5e1"}}/>Teslim tarihi yok</span>
          <span><i style={{background:"#1769e0",width:3}}/>Bugün</span><span>Koyu kısım: tamamlanan adım oranı</span>
        </div>
        {ds.length===0?<div className="ak-bos">Aktif dosya yok.</div>:(
          <div className="gt"><div className="gt-ic">
            <div className="gt-baslik"><div className="gt-ad">Araç</div><div className="gt-iz">{gunler.map((g,i)=>(g.getDay()===1||i===0)&&<div key={i} className="gt-gun hafta" style={{left:`${i/GUN*100}%`}}><span>{g.toLocaleDateString("tr-TR",{day:"numeric",month:"short"})}</span></div>)}</div></div>
            {ds.map(x=>{
              const d=durumu(x);const renk=d==="plan"?"#cbd5e1":DURUM_RENK[d];
              const t0=(tarih(x.arac_giris_trh)||tarih(x.created_at)).getTime();
              const tSon=tarih(x.tahmini_teslimat);const t1=Math.max(tSon?tSon.getTime()+864e5:gun0.getTime()+3*864e5,d==="kritik"?gun0.getTime()+864e5:0);
              const sol=yuzde(t0),gen=Math.max(1.5,yuzde(t1)-sol);
              const ipucu=`${x.dosya_no} · ${x.plaka}\nServise giriş: ${trTarih(x.arac_giris_trh)||"—"}\nTahmini teslim: ${trTarih(x.tahmini_teslimat)||"yok"}\nAşama: ${x.aktif_adim||"—"} · %${x.ilerleme||0}`;
              return(
                <React.Fragment key={x.dosya_id}>
                  <div className="gt-satir">
                    <div className="gt-ad"><b>{x.plaka||x.dosya_no}</b><span>{x.dosya_no} · {aracAd(x)}</span></div>
                    <div className="gt-iz">{izgara}
                      <div className="gt-bar" title={ipucu} onClick={()=>onDosyaSec(x.dosya_id)} style={{left:`${sol}%`,width:`${gen}%`,background:`color-mix(in srgb,${renk} 22%,white)`,border:`1px solid ${renk}`}}>
                        <div className="dolgu" style={{width:`${x.ilerleme||0}%`,background:renk}}/>
                        <em>{d==="kritik"?"✕ ":d==="uyari"?"! ":""}{x.aktif_adim||"Hazır"} · %{x.ilerleme||0}</em>
                      </div>
                    </div>
                  </div>
                  {gorevler&&x.gorevler.map(g=>{
                    const g0=tarih(g.baslama_trh||g.created_at).getTime(),g1=g.bitis_trh?tarih(g.bitis_trh).getTime():gun0.getTime()+864e5;
                    const s=yuzde(g0),w=Math.max(5,yuzde(g1)-s);const bitti=g.durum==="tamam";
                    return(
                      <div key={g.id} className="gt-satir alt">
                        <div className="gt-ad" style={{paddingLeft:22}}><span>↳ {BOLUM_AD[g.bolum]||g.bolum} · {g.sorumlu_usta||"usta yok"}</span></div>
                        <div className="gt-iz">{izgara}
                          <div className="gt-bar" title={`${BOLUM_AD[g.bolum]} · ${g.aciklama||""}\n${g.durum==="tamam"?"Bitti":g.durum==="beklemede"?"Beklemede":g.durum==="devam"?"Devam ediyor":"Sırada"}`} onClick={()=>onDosyaSec(x.dosya_id)}
                            style={{left:`${s}%`,width:`${w}%`,background:bitti?"#e2e8f0":"color-mix(in srgb,#8b5cf6 25%,white)",border:`1px solid ${bitti?"#cbd5e1":"#8b5cf6"}`,color:"#3b2a6d"}}>
                            <em>{BOLUM_AD[g.bolum]}{bitti?" ✓":g.durum==="beklemede"?" ⏸":""}</em>
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </React.Fragment>
              );
            })}
          </div></div>
        )}
      </section>
    </>
  );
}

const KARAR_AD={onarim:"Onarım",degisim:"Değişim",boya:"Boya",kontrol:"Kontrol",islem_yok:"İşlem yok"};
// Üstten görünüm araç şeması (viewBox 300x520): [bölge, x, y, w, h, etiket]
const DVI_BOLGE=[
  ["on_tampon",70,18,160,30,"Ön tampon"],["kaput",76,52,148,96,"Kaput"],["on_cam",84,150,132,38,"Ön cam"],["tavan",84,190,132,130,"Tavan"],

  ["sol_on_camurluk",34,56,40,92,"Ç"],["sol_on_kapi",34,152,40,92,"K"],["sol_arka_kapi",34,248,40,92,"K"],["sol_arka_camurluk",34,344,40,104,"Ç"],

];
const SIDDET_SIRA={hafif:1,orta:2,agir:3};
function HasarHaritasi({dosyaId,yazabilir}){
  const [noktalar,setNoktalar]=useState(null);const [hata,setHata]=useState("");const [sec,setSec]=useState("");
  const bos={hasar_tipi:"gocuk",siddet:"orta",karar:"onarim",notlar:""};
  const [form,setForm]=useState(bos);const [kaydediliyor,setKaydediliyor]=useState(false);
  const yukle=()=>apiCall(`/dvi/${dosyaId}`).then(r=>setNoktalar(r.noktalar)).catch(e=>setHata(e.message));
  useEffect(()=>{setNoktalar(null);setSec("");yukle();},[dosyaId]);
  if(!noktalar)return <Card><ST>🚗 Hasar Haritası</ST>{hata?<HataKutusu hata={hata} onTekrar={yukle}/>:<div style={{fontSize:12,color:"var(--text-2)"}}>Yükleniyor...</div>}</Card>;
  const enAgir=(b)=>noktalar.filter(x=>x.bolge===b).reduce((m,x)=>!m||SIDDET_SIRA[x.siddet]>SIDDET_SIRA[m]?x.siddet:m,null);
  const sayi=(b)=>noktalar.filter(x=>x.bolge===b).length;
  const kaydet=async()=>{
    if(!sec){setHata("Önce şemadan bir bölge seçin.");return;}
    setKaydediliyor(true);setHata("");
    try{await apiCall(`/dvi/${dosyaId}`,"POST",{bolge:sec,...form});setForm(bos);await yukle();}
    catch(e){setHata(e.message);}finally{setKaydediliyor(false);}
  };
  const sil=async(id)=>{if(!confirm("Hasar noktası silinsin mi?"))return;try{await apiCall(`/dvi/${dosyaId}/${id}`,"DELETE");await yukle();}catch(e){setHata(e.message);}};
  const secBtn=(aktif,renk="#1769e0")=>({padding:"5px 10px",borderRadius:7,fontSize:11,fontWeight:aktif?700:500,border:`1px solid ${aktif?renk:"var(--border)"}`,background:aktif?`${renk}18`:"#fff",color:aktif?renk:"var(--text-2)"});
  return(

// Sigorta protokolleri
const PROTOKOL_BOS={sirket_ad:"",baslangic:new Date().toISOString().slice(0,10),bitis:"",iscilik_saat_ucreti:"",parca_iskonto_yuzde:"0",malzeme_iskonto_yuzde:"0",muafiyet:"",notlar:""};
function ProtokolSayfasi({yazabilir}){
  const [veri,hata,yukle]=useApiVeri("/protokoller");
  const [form,setForm]=useState(null);const [isHata,setIsHata]=useState("");const [kayit,setKayit]=useState(false);
  if(!veri)return <ModulDurum hata={hata} yukle={yukle}/>;
  const ps=veri.protokoller;
  const sayiAl=(v)=>v===""||v===null||v===undefined?null:Number(String(v).replace(",","."));
  const kaydet=async()=>{
    setKayit(true);setIsHata("");
    try{
      const g={sirket_ad:form.sirket_ad,baslangic:form.baslangic,bitis:form.bitis||null,iscilik_saat_ucreti:sayiAl(form.iscilik_saat_ucreti),parca_iskonto_yuzde:sayiAl(form.parca_iskonto_yuzde)??0,malzeme_iskonto_yuzde:sayiAl(form.malzeme_iskonto_yuzde)??0,muafiyet:sayiAl(form.muafiyet),notlar:form.notlar||null};
      if(form.id)await apiCall(`/protokoller/${form.id}`,"PATCH",g);else await apiCall("/protokoller","POST",g);
      setForm(null);yukle();
    }catch(e){setIsHata(e.message);}finally{setKayit(false);}
  };
  const aktiflik=async(p)=>{try{await apiCall(`/protokoller/${p.id}`,"PATCH",{aktif:!p.aktif});yukle();}catch(e){setIsHata(e.message);}};
  const alan=(ad,etiket,tip="text",yer="")=>(<label style={{display:"block"}}><span style={{display:"block",fontSize:10,color:"#6f7e89",fontWeight:700,margin:"8px 0 4px"}}>{etiket}</span><input type={tip} value={form[ad]??""} placeholder={yer} onChange={e=>setForm(f=>({...f,[ad]:e.target.value}))} className="inp" style={{padding:"8px 10px"}}/></label>);
  return(
    <>
      <KpiSatiri ogeler={[
        {l:"Geçerli protokol",v:ps.filter(x=>x.gecerli).length,s:`${ps.length} kayıt`,k:"var(--ak-c-supply)"},
        {l:"Kapsanan aktif dosya",v:ps.filter(x=>x.gecerli).reduce((s,x)=>s+x.aktif_dosya,0),s:"Şirket adı eşleşen",k:"var(--ak-c-intake)"},
        {l:"Ortalama parça iskontosu",v:ps.filter(x=>x.gecerli).length?`%${(ps.filter(x=>x.gecerli).reduce((s,x)=>s+Number(x.parca_iskonto_yuzde),0)/ps.filter(x=>x.gecerli).length).toFixed(1)}`:"—",s:"Geçerli protokollerde",k:"var(--ak-c-portal)"},
        {l:"Süresi dolan / pasif",v:ps.filter(x=>!x.gecerli).length,s:"Kontrolde kullanılmaz",k:"var(--ak-c-system)"}]}/>
      {isHata&&<div style={{marginBottom:12}}><HataKutusu hata={isHata}/></div>}
      {form&&(
        <section className="ak-kart" style={{marginBottom:14}}>
          <div className="ak-baslik"><h3>{form.id?"Protokolü düzenle":"Yeni protokol"}</h3><button className="ak-btn" onClick={()=>setForm(null)}>Vazgeç</button></div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(180px,1fr))",gap:"0 12px"}}>
            {alan("sirket_ad","Sigorta şirketi","text","Dosyadaki adla aynı")}{alan("baslangic","Başlangıç","date")}{alan("bitis","Bitiş (boşsa süresiz)","date")}
            {alan("iscilik_saat_ucreti","İşçilik saat ücreti (₺)","text","Örn. 450")}{alan("parca_iskonto_yuzde","Parça iskontosu (%)")}{alan("malzeme_iskonto_yuzde","Malzeme iskontosu (%)")}
            {alan("muafiyet","Muafiyet (₺)")}{alan("notlar","Not")}
          </div>
          <button className="ak-btn ana" style={{marginTop:12}} disabled={kayit} onClick={kaydet}>{kayit?"Kaydediliyor...":"Kaydet"}</button>
        </section>
      )}
      <section className="ak-kart" style={{overflowX:"auto"}}>
        <div className="ak-baslik"><h3>Protokoller</h3>{yazabilir&&!form&&<button className="ak-btn ana" onClick={()=>setForm({...PROTOKOL_BOS})}>+ Protokol</button>}</div>
        {ps.length===0?<div className="ak-bos">Henüz protokol yok. Dosyanın Muhasebe sekmesindeki kontrol, şirketin geçerli protokolüyle çalışır.</div>:(
          <table className="ak-tablo"><thead><tr><th>Şirket</th><th>Geçerlilik</th><th>İşçilik / saat</th><th>Parça isk.</th><th className="gizle">Malzeme isk.</th><th className="gizle">Muafiyet</th><th className="gizle">Aktif dosya</th>{yazabilir&&<th></th>}</tr></thead>
            <tbody>{ps.map(p=><tr key={p.id}>
              <td><span className="no">{p.sirket_ad}</span><span className="alt">{p.notlar||""}</span></td>
              <td>{p.gecerli?<span className="ak-cip ak-ok">Geçerli</span>:<span className="ak-cip ak-gri">{p.aktif?"Süre dışı":"Pasif"}</span>}<span className="alt">{trTarih(p.baslangic)} – {p.bitis?trTarih(p.bitis):"süresiz"}</span></td>
              <td>{p.iscilik_saat_ucreti!==null?tlBicim(p.iscilik_saat_ucreti):"—"}</td>
              <td>%{Number(p.parca_iskonto_yuzde)}</td><td className="gizle">%{Number(p.malzeme_iskonto_yuzde)}</td>
              <td className="gizle">{p.muafiyet!==null?tlBicim(p.muafiyet):"—"}</td><td className="gizle">{p.aktif_dosya}</td>
              {yazabilir&&<td style={{whiteSpace:"nowrap"}}><button className="ak-btn" onClick={()=>setForm({...PROTOKOL_BOS,...Object.fromEntries(Object.entries(p).map(([k,v])=>[k,v===null?"":String(v)])),baslangic:String(p.baslangic).slice(0,10),bitis:p.bitis?String(p.bitis).slice(0,10):""})}>Düzenle</button> <button className="ak-btn" onClick={()=>aktiflik(p)}>{p.aktif?"Pasifleştir":"Etkinleştir"}</button></td>}
            </tr>)}</tbody></table>
        )}
      </section>
    </>
  );
}
// Dosya Muhasebe sekmesi: teklifin protokole göre kontrolü
function ProtokolKontrol({dosyaId}){
  const [veri,setVeri]=useState(null);const [hata,setHata]=useState("");
  useEffect(()=>{setVeri(null);apiCall(`/protokoller/dosya/${dosyaId}`).then(setVeri).catch(e=>setHata(e.message));},[dosyaId]);
  if(hata)return <Card><ST>▣ Sigorta Protokolü Kontrolü</ST><HataKutusu hata={hata}/></Card>;
  if(!veri)return null;
  if(!veri.protokol)return <Card><ST>▣ Sigorta Protokolü Kontrolü</ST><div style={{fontSize:12,color:"var(--text-2)"}}>{veri.sirket_ad?`${veri.sirket_ad} için geçerli protokol yok.`:"Dosyada sigorta şirketi yok."} Protokoller admin panelinde tanımlanır.</div></Card>;
  const {protokol:p,kontrol:k}=veri;
  const satir=(l,v,vurgu)=><div style={{display:"flex",justifyContent:"space-between",gap:10,padding:"6px 0",borderBottom:"1px solid var(--border)",fontSize:12}}><span style={{color:"var(--text-2)"}}>{l}</span><span style={{fontWeight:vurgu?800:600}}>{v}</span></div>;
  return(
    <Card>
      <ST>▣ Sigorta Protokolü Kontrolü · {p.sirket_ad}</ST>
      {satir("Sigortaya ait teklif (KDV hariç)",tlBicim(k.teklif_sigorta)||"0 ₺")}
      {satir(`Parça iskontosu (%${Number(p.parca_iskonto_yuzde)} × ${tlBicim(k.parca_toplam)||"0 ₺"})`,`− ${tlBicim(k.parca_iskonto)||"0 ₺"}`)}
      {satir(`Malzeme iskontosu (%${Number(p.malzeme_iskonto_yuzde)} × ${tlBicim(k.malzeme_toplam)||"0 ₺"})`,`− ${tlBicim(k.malzeme_iskonto)||"0 ₺"}`)}
      {satir(`İşçilik saat ücreti fazlası (protokol ${p.iscilik_saat_ucreti!==null?tlBicim(p.iscilik_saat_ucreti):"tanımsız"})`,`− ${tlBicim(k.iscilik_fark)||"0 ₺"}`)}
      {satir("Protokole göre beklenen tutar",tlBicim(k.beklenen)||"0 ₺",true)}
      {k.iscilik_fazla.length>0&&<div style={{marginTop:10,padding:10,borderRadius:10,background:"#fff6df",fontSize:11,color:"#a16207"}}>⚠ Protokolün üstünde fiyatlanan işçilik: {k.iscilik_fazla.map(x=>`${x.aciklama} (${tlBicim(x.birim_fiyat)}/saat)`).join(", ")}</div>}
      {k.muafiyet_uyumlu===false&&<div style={{marginTop:8,padding:10,borderRadius:10,background:"#fff0ee",fontSize:11,color:"#b42318"}}>✕ Dosyadaki muafiyet ({tlBicim(k.dosya_muafiyet)}) protokoldekinden ({tlBicim(p.muafiyet)}) farklı.</div>}
      {k.muafiyet_uyumlu===true&&<div style={{marginTop:8,fontSize:11,color:"#087c55"}}>✓ Muafiyet protokolle uyumlu.</div>}
      <div style={{fontSize:10,color:"var(--text-2)",marginTop:8}}>Yalnız ödeyeni sigorta olan, reddedilmemiş kalemler hesaba girer.</div>
    </Card>
  );
}

        </section>
      </div>

        <div className="ak-baslik"><h3>İade geçmişi</h3><span>{gecmis.length}</span></div>

        )}
      </section>
    </>
  );
}

// Kokpit: hero, KPI, süreç şeridi, kanban, aktif dosyalar, gün ajandası, servisler
function AdminDashboard({onDosyaSec,onGit,onYeniDosya,onServisDetay}){
  const [veri,setVeri]=useState(null);const [hata,setHata]=useState("");
  const yukle=async()=>{
    setHata("");
    try{
      const [o,l,b]=await Promise.all([apiCall("/raporlar/ozet"),apiCall("/dosyalar?durum=Aktif&limit=200"),apiCall("/is-emirleri/bekleyen-onaylar").catch(()=>({onaylar:[]}))]);
      setVeri({ozet:o,aktif:esleListe(l.dosyalar),onaylar:b.onaylar||[]});
    }catch(e){setHata(e.message||"Kokpit verisi alınamadı.");}
  };
  useEffect(()=>{yukle();},[]);
  if(hata)return <HataKutusu hata={hata} onTekrar={yukle}/>;
  if(!veri)return <div className="ak-bos"><span style={{animation:"pulse .8s infinite"}}>Kokpit yükleniyor...</span></div>;
  const {ozet,aktif,onaylar}=veri;
  const geciken=aktif.filter(d=>{const g=gunFarki(d.tahminiTeslim);return g!==null&&g<0;});
  const yakinTeslim=aktif.filter(d=>{const g=gunFarki(d.tahminiTeslim);return g!==null&&g>=0&&g<=7;});
  const atolyede=aktif.filter(d=>["Parça Temini","Onarım","Boya & Son Kontrol"].includes(d.aktifAdim));
  const onayTutar=onaylar.reduce((s,o)=>s+Number(o.tutar||0),0);
  const sutun=(s)=>aktif.filter(d=>d.aktifAdim===s.ad||(s.ad==="Araç Teslimi"&&!d.aktifAdim&&d.ilerleme>=100));
  const bugun=new Date().toLocaleDateString("tr-TR",{weekday:"long",day:"numeric",month:"long"});
  const ajanda=[
    ...geciken.map(d=>({g:"#ef4444",b:`Teslim gecikti · ${d.dosyaNo}`,s:`${d.plaka} · ${-gunFarki(d.tahminiTeslim)} gün geçti (${trTarih(d.tahminiTeslim)})`,id:d.id,o:0})),
    ...onaylar.map(o=>({g:"#f59e0b",b:`Onay bekliyor · ${o.dosya_no}`,s:`${o.plaka||""} · ${o.tur==="ek"?"Ek hasar":"Ana iş emri"} · ${Number(o.gun)||0} gündür · ${tlBicim(o.tutar)}`,id:o.dosya_id,o:1})),

                  <td><span className="ak-cip" style={{color:adimRenk(d.aktifAdim),background:`color-mix(in srgb,${adimRenk(d.aktifAdim)} 12%,white)`}}>{d.aktifAdim||"Hazır"}</span></td>
                  <td>{d.tahminiTeslim?<span className={`ak-cip ${g<0?"ak-tehlike":g<=2?"ak-uyari":"ak-gri"}`}>{trTarih(d.tahminiTeslim)}</span>:"—"}</td>
                </tr>);})}</tbody>

// Hasar dosyaları: arama, durum filtresi, tablo (mobilde dar sütunlar gizlenir)
function DosyaListesi({onDosyaSec,onYeniDosya}){
  const [arama,setArama]=useState("");const [durum,setDurum]=useState("");
  const [dosyalar,setDosyalar]=useState([]);const [toplam,setToplam]=useState(0);
  const [yukleniyor,setYukleniyor]=useState(true);const [hata,setHata]=useState("");const [yenile,setYenile]=useState(0);
  const [okunmamis,setOkunmamis]=useState({});
  const seq=useRef(0);
  useEffect(()=>{apiCall("/mesajlar/okunmamis").then(m=>setOkunmamis(m.dosyalar||{})).catch(()=>{});},[]);
  useEffect(()=>{
    const sira=++seq.current;setYukleniyor(true);setHata("");
    const t=setTimeout(async()=>{
      try{
        const q=new URLSearchParams({limit:"200"});
        if(arama.trim())q.set("arama",arama.trim());
        if(durum)q.set("durum",durum);
        const d=await apiCall(`/dosyalar?${q.toString()}`);
        if(sira!==seq.current)return;
        setDosyalar(esleListe(d.dosyalar));setToplam(d.toplam||0);
      }catch(e){if(sira===seq.current)setHata(e.message||"Dosyalar alınamadı.");}
      finally{if(sira===seq.current)setYukleniyor(false);}
    },arama.trim()?300:0);
    return()=>clearTimeout(t);
  },[arama,durum,yenile]);
  const dCip={Aktif:"ak-bilgi",Tamamlandı:"ak-ok",Askıda:"ak-uyari",İptal:"ak-gri"};
  return(
    <section className="ak-kart" style={{overflowX:"auto"}}>
      <div className="ak-ara">
        <input value={arama} onChange={e=>setArama(e.target.value)} placeholder="🔍  Plaka, dosya no veya müşteri adı" autoFocus/>
        <div className="ak-filtre">{[["","Tümü"],["Aktif","Aktif"],["Tamamlandı","Tamamlandı"],["Askıda","Askıda"],["İptal","İptal"]].map(([v,l])=><button key={l} className={durum===v?"sec":""} onClick={()=>setDurum(v)}>{l}</button>)}</div>
      </div>
      <div className="ak-baslik"><span>{yukleniyor?"Yükleniyor...":`${toplam} dosya`}</span></div>
      {hata?<HataKutusu hata={hata} onTekrar={()=>setYenile(n=>n+1)}/>:dosyalar.length===0&&!yukleniyor?(
        <div className="ak-bos">Sonuç bulunamadı. <button className="ak-btn ana" style={{marginLeft:8}} onClick={onYeniDosya}>+ Yeni dosya</button></div>
      ):(
        <table className="ak-tablo">
          <thead><tr><th>Dosya</th><th className="gizle">Araç</th><th className="gizle">Müşteri</th><th className="gizle">Sigorta</th><th className="gizle">Servis</th><th>Durum</th><th className="gizle">İlerleme</th><th className="gizle">Muallak</th></tr></thead>
          <tbody>{dosyalar.map(d=>(
            <tr key={d.id} className="satir" onClick={()=>onDosyaSec(d.id)}>
              <td><span className="no">{d.dosyaNo}</span> <MesajRozet n={okunmamis[d.id]}/><span className="alt">{d.plaka} · {d.tarih}</span></td>
              <td className="gizle">{d.arac}</td><td className="gizle">{d.sahip}</td><td className="gizle">{d.sigorta}</td>
              <td className="gizle">{d.servisAd||<span className="ak-cip ak-uyari">Atanmadı</span>}</td>
              <td><span className={`ak-cip ${dCip[d.durum]||"ak-gri"}`}>{d.durum}</span>{d.durum==="Aktif"&&d.aktifAdim&&<span className="alt">{d.aktifAdim}</span>}</td>
              <td className="gizle"><div className="ak-ilerleme"><div style={{width:`${d.ilerleme}%`}}/></div><span className="alt">%{d.ilerleme}</span></td>
              <td className="gizle" style={{fontWeight:600}}>{d.muallakHasar||"—"}</td>
            </tr>
          ))}</tbody>
        </table>
      )}
    </section>
  );
}

function ServislerSayfasi({onServisDetay}){
  const [ozet,setOzet]=useState(null);const [servisler,setServisler]=useState(null);const [hata,setHata]=useState("");
  const yukle=()=>{setHata("");Promise.all([apiCall("/raporlar/ozet"),apiCall("/servisler")]).then(([o,s])=>{setOzet(o);setServisler(s.servisler||[]);}).catch(e=>setHata(e.message));};
  useEffect(()=>{yukle();},[]);
  if(hata)return <HataKutusu hata={hata} onTekrar={yukle}/>;
  if(!servisler)return <div className="ak-bos">Yükleniyor...</div>;
  const so=(id)=>(ozet?.servisler||[]).find(x=>x.id===id)||{};
  return(
    <div className="ak-servisler">
      {servisler.map(s=>{const o=so(s.id);return(
        <button key={s.id} className="ak-kart ak-kpi" style={{"--k":s.aktif?"var(--ak-c-repair)":"#cbd5e1",textAlign:"left"}} onClick={()=>onServisDetay(s.id)}>
          <div style={{display:"flex",justifyContent:"space-between",gap:8}}><b style={{fontSize:15,marginTop:0}}>{s.ad}</b>{!s.aktif&&<span className="ak-cip ak-gri">Pasif</span>}</div>
          <div className="s" style={{marginTop:6}}>{s.adres||"Adres yok"}{s.telefon?` · ${s.telefon}`:""}</div>
          <div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:10}}>
            <span className="ak-cip ak-mor">{Number(o.dosya_sayisi)||0} aktif araç</span>
            {Number(o.bekleyen_onay)>0&&<span className="ak-cip ak-uyari">{o.bekleyen_onay} onay bekliyor</span>}
            {Number(o.toplam_muallak)>0&&<span className="ak-cip ak-gri">{tlBicim(o.toplam_muallak)}</span>}
          </div>
        </button>
      );})}
    </div>
  );
}

function YeniDosyaWizard({onKapat,onKaydet}){
  const [adim,setAdim]=useState(1);

  const [kaydediliyor,setKaydediliyor]=useState(false);

// ─── SERVİS ATAMA MODALI ──────────────────────────────────────────────────
function ServisAtamaModal({dosya,servisler,onAta,onKapat}){
  const [secilen,setSecilen]=useState(dosya.atananServis||null);
  const [not,setNot]=useState(dosya.atamaNotu||"");
  const [loading,setLoading]=useState(false);
  const [hata,setHata]=useState("");
  const aktifler=(servisler||[]).filter(s=>s.aktif);
  const ata=async()=>{
    if(!secilen){setHata("Servis seçin.");return;}
    setLoading(true);setHata("");
    try{await onAta(secilen,not.trim());onKapat();}
    catch(e){setHata(e.message||"Servis atanamadı.");setLoading(false);}
  };
  return(
    <div onClick={onKapat} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.7)",zIndex:300,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
      <div onClick={e=>e.stopPropagation()} style={{background:"var(--bg)",border:"1px solid var(--border-md)",borderRadius:16,width:"100%",maxWidth:460,maxHeight:"90vh",overflowY:"auto",padding:20,animation:"popIn .25s ease"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
          <div style={{fontWeight:800,fontSize:15}}>🔧 Servis Ata</div>
          <button onClick={onKapat} style={{background:"var(--border)",border:"1px solid var(--border-md)",color:"var(--text-2)",borderRadius:"50%",width:30,height:30,fontSize:16}}>×</button>
        </div>
        <div style={{fontSize:11,color:"var(--text-2)",marginBottom:12}}>Dosya: <strong style={{fontFamily:"var(--font-mono)",color:"#818CF8"}}>{dosya.dosyaNo}</strong></div>
        {aktifler.length===0&&<div style={{fontSize:12,color:"var(--text-2)",padding:"10px 0"}}>Atanabilecek aktif servis yok.</div>}
        <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:14}}>
          {aktifler.map(s=>(
            <button key={s.id} onClick={()=>{setSecilen(s.id);setHata("");}} style={{background:secilen===s.id?"var(--violet-dim)":"var(--surface-2)",border:`1px solid ${secilen===s.id?"rgba(139,92,246,0.4)":"var(--border)"}`,borderRadius:10,padding:"10px 14px",textAlign:"left",display:"flex",alignItems:"center",gap:10}}>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontWeight:600,fontSize:12,color:secilen===s.id?"#C4B5FD":"var(--text-1)"}}>{s.ad}</div>
                {(s.adres||s.telefon)&&<div style={{fontSize:10,color:"var(--text-2)",marginTop:1}}>{[s.adres,s.telefon].filter(Boolean).join(" · ")}</div>}
              </div>
              {secilen===s.id&&<div style={{width:18,height:18,borderRadius:"50%",background:"#8B5CF6",display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,color:"#fff",flexShrink:0}}>✓</div>}
            </button>
          ))}
        </div>
        <div style={{fontSize:10,color:"var(--text-2)",fontWeight:700,letterSpacing:".6px",marginBottom:6}}>ATAMA NOTU (isteğe bağlı)</div>
        <textarea value={not} onChange={e=>setNot(e.target.value)} rows={2} style={{width:"100%",background:"var(--border)",border:"1px solid var(--border-md)",borderRadius:8,color:"var(--text-1)",padding:"9px 12px",fontSize:12,resize:"none",marginBottom:12}}/>
        {hata&&<div style={{marginBottom:10}}><HataKutusu hata={hata}/></div>}
        <button onClick={ata} disabled={loading||!secilen} style={{width:"100%",background:secilen?"linear-gradient(135deg,#7C3AED,#6D28D9)":"rgba(139,92,246,0.3)",border:"none",color:"#fff",borderRadius:9,padding:12,fontSize:13,fontWeight:800}}>{loading?"Atanıyor...":"Servisi Ata"}</button>
      </div>
    </div>
  );
}

// ─── ADMIN PANELİ (Dosya Detayı + Muhasebe) ──────────────────────────────
function AdminPanel({dosyaId,onCikis,ilkSekme}){
  const [dosya,setDosya]=useState(null);
  const [adimlar,setAdimlar]=useState([]);
  // Evrak ve fotoğraflar API'den (özet kartları ve sekme rozetleri için listeler burada tutulur)
  const [evrak,setEvrak]=useState([]);
  const [photos,setPhotos]=useState([]);
  const [isEmirleri,setIsEmirleri]=useState([]);
  const [mesajlar,setMesajlar]=useState([]);
  const [smsMesajlar,setSmsMesajlar]=useState(GECMIS_SMS);
  const [tab,setTab]=useState(ilkSekme||"ozet");
  const [isMobile,setIsMobile]=useState(false);
  const [editMode,setEditMode]=useState(null);
  const [saving,setSaving]=useState(null);
  const [aktifKat,setAktifKat]=useState("tumu");
  const [lightboxFoto,setLightboxFoto]=useState(null);
  const [silOnayi,setSilOnayi]=useState(null);
  const [etiketDuzenle,setEtiketDuzenle]=useState(null);
  const [yeniEtiket,setYeniEtiket]=useState("");
  const [hedef,setHedef]=useState("Eksper");
  const [mesajMetin,setMesajMetin]=useState("");
  const [smsAktif,setSmsAktif]=useState(true);
  const [smsSaati,setSmsSaati]=useState("10:00");
  const [smsGon,setSmsGon]=useState(false);
  const [smsOk,setSmsOk]=useState(false);
  const [toast,setToast]=useState(null);
  const [servisModal,setServisModal]=useState(false);
  const [muhasebeEdit,setMuhasebeEdit]=useState(false);
  const [muhasebe,setMuhasebe]=useState({});
  const [islemler,setIslemler]=useState([]);
  const [onayDurumu,setOnayDurumu]=useState("taslak");
  const [yukleniyor,setYukleniyor]=useState(true);
  const [yuklemeHata,setYuklemeHata]=useState("");
  const [kayitHata,setKayitHata]=useState("");
  const [adimLoading,setAdimLoading]=useState(false);
  const [tumDosyalar,setTumDosyalar]=useState([]);
  const [servisler,setServisler]=useState([]);
  const [faturaVeri,setFaturaVeri]=useState(null);
  const orijinalRef=useRef(null);
  const seqRef=useRef(0);
  const fotoRef=useRef();
  useEffect(()=>{const c=()=>setIsMobile(window.innerWidth<768);c();window.addEventListener("resize",c);return()=>window.removeEventListener("resize",c);},[]);

  // Dosya, işlem kalemleri, dosya listesi ve servisler API'den gelir
  const yukle=async(sessiz)=>{
    const sira=++seqRef.current;
    if(!sessiz)setYukleniyor(true);
    setYuklemeHata("");
    try{
      const [d,i,l,sv,ev,ft,ms]=await Promise.all([
        apiCall(`/dosyalar/${dosyaId}`),
        apiCall(`/islemler/${dosyaId}`),
        apiCall("/dosyalar?limit=200").catch(()=>({dosyalar:[]})),
        apiCall("/servisler").catch(()=>({servisler:[]})),
        apiCall(`/evrak/${dosyaId}`).catch(()=>({evrak:[]})),
        apiCall(`/fotograflar/${dosyaId}`).catch(()=>({fotograflar:[]})),
        apiCall(`/mesajlar/${dosyaId}?isaretle=hayir`).catch(()=>({mesajlar:[]})),
      ]);
      if(sira!==seqRef.current)return;
      const dm=esleDetay(d);
      orijinalRef.current=JSON.parse(JSON.stringify(dm));
      setDosya(dm);setMuhasebe(dm.muhasebe);
      setAdimlar((d.onarim_adimlari||[]).map(esleAdim));
      setIslemler((i.kalemler||[]).map(esleKalem));
      setOnayDurumu(i.onay_durumu||"taslak");
      setTumDosyalar(esleListe(l.dosyalar));
      setServisler(sv.servisler||[]);
      setIsEmirleri(i.is_emirleri||[]);
      setEvrak((ev.evrak||[]).map(esleEvrak));
      setPhotos((ft.fotograflar||[]).map(esleFoto));
      setMesajlar((ms.mesajlar||[]).map(m=>({id:m.id,gonderen:m.gonderen_rol==="admin"?"Admin":"Servis",hedef:m.hedef_rol==="admin"?"Admin":"Servis",tarih:mesajZamani(m.created_at),mesaj:m.mesaj})));
    }catch(e){if(sira===seqRef.current)setYuklemeHata(e.message||"Dosya alınamadı.");}
    finally{if(sira===seqRef.current)setYukleniyor(false);}
  };
  useEffect(()=>{setDosya(null);yukle();},[dosyaId]);
  if(!dosya&&yukleniyor)return <YuklemeEkrani metin="Dosya yükleniyor..."/>;
  if(!dosya)return(
    <div style={{fontFamily:"'Inter',sans-serif",background:"var(--bg)",minHeight:"100vh",color:"var(--text-1)",padding:24}}>
      <button onClick={onCikis} style={{background:"var(--border)",border:"1px solid var(--border-md)",color:"var(--text-2)",borderRadius:7,padding:"5px 12px",fontSize:11,fontWeight:600,marginBottom:16}}>← Dosyalar</button>
      <HataKutusu hata={yuklemeHata||"Dosya bulunamadı"} onTekrar={()=>yukle()}/>
    </div>
  );
  const islemApi=islemApiOlustur(dosyaId,()=>yukle(true));

  const exportCSV=() => {
    const rows=[
      ["Dosya No","Araç","Plaka","Sahip","Sigorta","Muallak Hasar","Servis Fatura","Sigorta Ödemesi","Onaylanan Tutar","Net Fark","Durum"],
      ...tumDosyalar.map(d=>[d.dosyaNo,d.arac,d.plaka,d.sahip,d.sigorta,d.muallakHasar,d.id===dosya.id?servisFaturaMetin:"—",d.id===dosya.id?muhasebe.sigortaOdeme||"":"—",d.id===dosya.id?muhasebe.onaylananTutar||"":"—",d.id===dosya.id&&muhasebe.sigortaOdeme&&muhasebe.servisFatura?`${(parseFloat(muhasebe.servisFatura.replace(/[^\d,]/g,"").replace(",","."))||0)-(parseFloat(muhasebe.sigortaOdeme.replace(/[^\d,]/g,"").replace(",","."))||0)} TL`:"—",d.durum])
    ];
    const csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");
    const blob=new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8;"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);
    a.download=`HasarTrack_Muhasebe_${new Date().toLocaleDateString("tr-TR").replace(/\./g,"-")}.csv`;
    a.click();
  };

  const exportPDF=()=>{

  const fark=faturaTutar-odeme;

  const setD=(yol,val)=>setDosya(prev=>{const next={...prev};const parts=yol.split(".");let obj=next;for(let i=0;i<parts.length-1;i++){obj[parts[i]]={...obj[parts[i]]};obj=obj[parts[i]];}obj[parts[parts.length-1]]=val;return next;});
