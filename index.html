<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<meta name="referrer" content="no-referrer"/>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2716%27 fill=%27%23142636%27/%3E%3Ctext x=%2732%27 y=%2744%27 font-family=%27Arial%27 font-size=%2734%27 font-weight=%27800%27 fill=%27%2306b6d4%27 text-anchor=%27middle%27%3EH%3C/text%3E%3C/svg%3E"/>
<title>HasarTrack</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:          #F0F4F8;
  --surface-1:   #FFFFFF;
  --surface-2:   #F8FAFC;
  --surface-3:   #EEF2F7;
  --border:      rgba(15,23,42,0.08);
  --border-md:   rgba(15,23,42,0.14);
  --border-hi:   rgba(15,23,42,0.26);
  --text-1:      #0F172A;
  --text-2:      #475569;
  --text-3:      #94A3B8;
  --blue:        #2563EB;
  --blue-dim:    rgba(37,99,235,0.08);
  --indigo:      #4F46E5;
  --indigo-dim:  rgba(79,70,229,0.08);
  --violet:      #7C3AED;
  --violet-dim:  rgba(124,58,237,0.08);
  --green:       #059669;
  --green-dim:   rgba(5,150,105,0.08);
  --amber:       #D97706;
  --amber-dim:   rgba(217,119,6,0.08);
  --red:         #DC2626;
  --red-dim:     rgba(220,38,38,0.08);
  --radius-sm:   6px;
  --radius-md:   10px;
  --radius-lg:   14px;
  --font-body:   'Plus Jakarta Sans','Segoe UI',sans-serif;
  --font-mono:   'IBM Plex Mono','JetBrains Mono',monospace;
  --shadow-sm:   0 1px 3px rgba(15,23,42,0.08),0 1px 2px rgba(15,23,42,0.04);
  --shadow-md:   0 4px 12px rgba(15,23,42,0.1),0 2px 4px rgba(15,23,42,0.06);
  --shadow-lg:   0 8px 24px rgba(15,23,42,0.12),0 4px 8px rgba(15,23,42,0.06);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body,#root{height:100%}
body{background:var(--bg);color:var(--text-1);font-family:var(--font-body);-webkit-font-smoothing:antialiased;font-size:14px}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#94A3B8}
button{transition:all .15s ease;font-family:inherit;cursor:pointer;outline:none}
button:active{transform:scale(0.97)}
input,textarea,select{outline:none;font-family:inherit}
input::placeholder,textarea::placeholder{color:var(--text-3)}

.glass-header{
  background:rgba(255,255,255,0.85);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
}
.card{
  background:var(--surface-1);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  padding:18px;
  box-shadow:var(--shadow-sm);
}
.stat-card{
  background:var(--surface-1);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  padding:16px 18px;
  box-shadow:var(--shadow-sm);
  position:relative;overflow:hidden;
  transition:box-shadow .2s,border-color .2s;
}
.stat-card:hover{box-shadow:var(--shadow-md);border-color:var(--border-md)}
.stat-card .glow{position:absolute;top:-20px;right:-20px;width:80px;height:80px;border-radius:50%;filter:blur(28px);opacity:.12;pointer-events:none}

.inp{
  width:100%;
  background:#FFFFFF;
  border:1.5px solid var(--border-md);
  border-radius:var(--radius-md);
  color:var(--text-1);
  padding:11px 14px;
  font-size:13px;
  transition:border-color .2s,box-shadow .2s;
}
.inp:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,0.12)}
.inp.error{border-color:var(--red);background:rgba(220,38,38,0.03)}

.badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;letter-spacing:.2px;padding:3px 9px;border-radius:20px;border:1px solid transparent;white-space:nowrap}

.btn-primary{background:linear-gradient(135deg,#2563EB,#1D4ED8);border:none;color:#fff;border-radius:var(--radius-md);font-weight:700;font-size:13px;box-shadow:0 2px 8px rgba(37,99,235,0.3);transition:all .2s}
.btn-primary:hover{box-shadow:0 4px 16px rgba(37,99,235,0.4);filter:brightness(1.05)}
.btn-ghost{background:#F8FAFC;border:1px solid var(--border-md);color:var(--text-2);border-radius:var(--radius-md);font-size:12px;font-weight:600;transition:all .15s}
.btn-ghost:hover{background:#F1F5F9;border-color:var(--border-hi);color:var(--text-1)}
.btn-danger{background:rgba(220,38,38,0.08);border:1px solid rgba(220,38,38,0.2);color:#DC2626;border-radius:var(--radius-md);font-size:11px;font-weight:700;transition:all .15s}
.btn-danger:hover{background:rgba(220,38,38,0.14)}

.nav-tab{padding:13px 14px;background:none;border:none;border-radius:0;font-size:12px;font-weight:500;color:var(--text-3);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;transition:color .15s,border-color .15s}
.nav-tab:hover{color:var(--text-2)}
.nav-tab.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:600}
.nav-tab:active{transform:none}

.mob-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,0.95);backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -4px 16px rgba(15,23,42,0.08)}
.mob-nav-btn{flex:1;background:none;border:none;padding:8px 2px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;transition:none}
.mob-nav-btn:active{transform:none}

.toggle{position:relative;width:44px;height:24px;display:inline-block}
.toggle input{opacity:0;width:0;height:0}
.slider{position:absolute;cursor:pointer;inset:0;background:#E2E8F0;border-radius:24px;transition:.25s;border:1px solid var(--border-md)}
.slider:before{content:"";position:absolute;height:16px;width:16px;left:4px;bottom:3px;background:#fff;border-radius:50%;transition:.25s;box-shadow:0 1px 3px rgba(15,23,42,0.2)}
input:checked+.slider{background:var(--blue);border-color:transparent}
input:checked+.slider:before{transform:translateX(20px)}

.photo-card{transition:transform .2s,box-shadow .2s}
.photo-card:hover{transform:scale(1.02);box-shadow:var(--shadow-md)}
.photo-card:hover .photo-overlay{opacity:1!important}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes fadeUp{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes popIn{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}

/* ── Admin kabuğu (Hasar Merkezi V30 tasarım dili) ── */
:root{--ak-side:245px;--ak-c-intake:#06b6d4;--ak-c-repair:#8b5cf6;--ak-c-supply:#f59e0b;--ak-c-portal:#10b981;--ak-c-finance:#ec4899;--ak-c-system:#94a3b8}
.ak-side{position:fixed;left:0;top:0;bottom:0;width:var(--ak-side);height:100dvh;background:linear-gradient(180deg,#0c1720 0%,#111e29 58%,#0c1720 100%);color:#dbe5ec;display:flex;flex-direction:column;z-index:40;padding:18px 12px 12px}
.ak-brand{font-weight:800;font-size:19px;padding:4px 10px 18px;margin:0 4px 6px;border-bottom:1px solid #ffffff12;letter-spacing:-.3px;color:#fff}
.ak-brand small{display:block;color:#7f94a3;font-size:10px;font-weight:600;margin-top:4px;letter-spacing:.2px}
.ak-nav{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:#435461 transparent}
.ak-grup{font-size:9px;letter-spacing:1.1px;font-weight:800;color:#718695;padding:16px 12px 6px;text-transform:uppercase}
.ak-nav button{width:100%;display:flex;align-items:center;gap:10px;border:0;border-left:3px solid transparent;background:transparent;color:#aebdca;text-align:left;padding:8px 10px;border-radius:10px;margin:2px 0;font-size:13px;font-weight:500}
.ak-nav button:hover{background:#20303d;color:#fff}
.ak-nav button:active{transform:none}
.ak-nav .ak-ico{width:27px;height:27px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-style:normal;flex-shrink:0;color:var(--g);background:color-mix(in srgb,var(--g) 13%,transparent)}
.ak-nav button.aktif{color:#fff;border-left-color:var(--g);background:color-mix(in srgb,var(--g) 13%,transparent)}
.ak-nav .ak-et{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ak-nav .ak-rozet{font-size:9px;font-weight:800;padding:2px 7px;border-radius:999px;background:#f59e0b;color:#1c1300}
.ak-nav .ak-yakinda{font-size:8px;font-weight:700;padding:2px 6px;border-radius:999px;background:#ffffff10;color:#7f94a3;letter-spacing:.3px}
.ak-alt{border-top:1px solid #ffffff12;padding:12px 8px 2px;display:flex;align-items:center;gap:10px}
.ak-alt .ak-kim{flex:1;min-width:0;font-size:11px;color:#aebdca}.ak-alt .ak-kim b{display:block;color:#fff;font-size:12px}
.ak-alt button{border:1px solid #ffffff20;background:#ffffff0d;color:#fca5a5;border-radius:8px;padding:6px 10px;font-size:11px;font-weight:700}
.ak-main{margin-left:var(--ak-side);min-height:100vh;min-width:0;background:#f4f6f8}
.ak-main .mob-nav{left:var(--ak-side)}
.ak-top{position:sticky;top:0;z-index:20;height:66px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 26px;background:#ffffffc7;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid #e7ebee}
.ak-top h1{font-size:21px;font-weight:800;letter-spacing:-.4px;color:#17212b}.ak-top p{font-size:11px;color:#7a8792;margin-top:2px}
.ak-eylem{display:flex;gap:8px;align-items:center}
.ak-btn{border:1px solid #d7dee4;background:#fff;color:#17212b;padding:8px 12px;border-radius:9px;font-size:12px;font-weight:600;white-space:nowrap}
.ak-btn:hover{border-color:#b8c4ce}
.ak-btn.ana{background:#1769e0;border-color:#1769e0;color:#fff;box-shadow:0 2px 8px #1769e040}
.ak-btn.ana:hover{background:#125bc7}
.ak-icerik{padding:20px 26px 48px}
.ak-hero{background:linear-gradient(125deg,#142636,#1c3345 55%,#203b4e);color:#fff;border-radius:18px;padding:20px 22px;margin-bottom:16px;box-shadow:0 10px 30px #1325361c}
.ak-hero .ak-ust{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:#8fc9e9;font-weight:800}
.ak-hero h2{margin:5px 0;font-size:23px;font-weight:800;letter-spacing:-.4px}.ak-hero p{color:#b9c9d5;font-size:12px}
.ak-hero-eylem{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.ak-hero-eylem button{background:#ffffff10;color:#fff;border:1px solid #ffffff24;padding:9px 14px;border-radius:9px;font-size:12px;font-weight:600}
.ak-hero-eylem button:hover{background:#ffffff1c}
.ak-hero-eylem button.ana{background:#fff;color:#163044;border-color:#fff}
.ak-kart{background:#fff;border:1px solid #e5e9ed;border-radius:14px;padding:16px;box-shadow:0 1px 2px #00000008}
.ak-kart h3{margin:0;font-size:15px;font-weight:700;color:#253440}
.ak-baslik{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.ak-baslik span{font-size:11px;color:#7a8792}
.ak-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}
.ak-kpi{cursor:pointer;transition:.15s;border-top:3px solid var(--k,#dbe3e9)}
.ak-kpi:hover{transform:translateY(-1px);box-shadow:0 5px 18px #1d2d3b12}
.ak-kpi .l{font-size:12px;color:#75838f}.ak-kpi b{font-size:27px;display:block;margin-top:6px;letter-spacing:-.5px;color:#17212b}.ak-kpi .s{font-size:11px;color:#71808c;margin-top:2px}
.ak-surec{display:flex;align-items:stretch;overflow-x:auto;margin-bottom:14px;padding-bottom:3px}
.ak-adim{min-width:112px;flex:1;position:relative;padding:10px 14px 9px 20px;background:#fff;border-top:1px solid #e5e9ed;border-bottom:1px solid #e5e9ed;cursor:default}
.ak-adim:first-child{border-left:1px solid #e5e9ed;border-radius:11px 0 0 11px;padding-left:14px}.ak-adim:last-child{border-right:1px solid #e5e9ed;border-radius:0 11px 11px 0}
.ak-adim:after{content:"";position:absolute;right:-9px;top:12px;width:18px;height:18px;background:inherit;border-top:1px solid #e5e9ed;border-right:1px solid #e5e9ed;transform:rotate(45deg);z-index:2}
.ak-adim:last-child:after{display:none}
.ak-adim b{font-size:10px;display:block;position:relative;z-index:3;color:#253440}.ak-adim small{font-size:10px;color:#7b8994;position:relative;z-index:3}
.ak-adim.dolu{background:#eff6ff;box-shadow:inset 0 3px var(--g)}.ak-adim.dolu b{color:#1e40af}
.ak-kanban{display:grid;grid-template-columns:repeat(8,minmax(118px,1fr));gap:10px;overflow-x:auto;padding-bottom:4px}
.ak-sutun{background:#f6f8fa;border-radius:12px;padding:10px;min-height:160px;border-top:3px solid var(--g)}
.ak-sutun h4{font-size:11px;color:#556370;margin:2px 2px 4px;display:flex;justify-content:space-between}
.ak-bilet{background:#fff;border:1px solid #e3e8ec;border-radius:10px;padding:9px 10px;margin:8px 0;cursor:pointer;text-align:left;width:100%;display:block}
.ak-bilet:hover{border-color:#8db5ed}.ak-bilet:active{transform:none}
.ak-bilet b{font-size:11px;color:#17212b;white-space:nowrap}.ak-bilet p{font-size:10px;color:#778590;margin-top:4px;line-height:1.4}
.ak-iki{display:grid;grid-template-columns:1.35fr .65fr;gap:14px;margin-top:14px}
.ak-tablo{width:100%;border-collapse:collapse}
.ak-tablo th,.ak-tablo td{text-align:left;padding:11px 9px;border-bottom:1px solid #edf0f2;font-size:12px;vertical-align:middle}
.ak-tablo th{color:#778590;font-weight:600;font-size:11px}
.ak-tablo tr.satir{cursor:pointer}.ak-tablo tr.satir:hover{background:#f7f9fb}
.ak-tablo .no{font-weight:700;color:#17212b;white-space:nowrap}.ak-tablo .alt{display:block;color:#7a8792;font-size:11px;margin-top:2px}
.ak-cip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 9px;font-size:10px;font-weight:700;white-space:nowrap}
.ak-cip:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.ak-ok{color:#087c55;background:#e9fbf4}.ak-uyari{color:#a16207;background:#fff6df}.ak-bilgi{color:#2563eb;background:#edf5ff}.ak-tehlike{color:#b42318;background:#fff0ee}.ak-mor{color:#6d3ed1;background:#f3efff}.ak-gri{color:#556370;background:#eef2f5}
.ak-ajanda{display:block;width:100%;text-align:left;border:1px solid #e6ebef;border-left:3px solid var(--g);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:#fff;cursor:pointer}
.ak-ajanda:hover{box-shadow:0 4px 14px #21384b12}.ak-ajanda:active{transform:none}
.ak-ajanda b{font-size:12px;color:#17212b;display:block}.ak-ajanda span{font-size:11px;color:#7a8792}
.ak-bos{font-size:12px;color:#7a8792;padding:18px 4px;text-align:center}
.ak-ara{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.ak-ara input{flex:1;min-width:220px;border:1px solid #d9e0e5;border-radius:10px;padding:11px 14px;font-size:13px;background:#fff}
.ak-ara input:focus{border-color:#1769e0;box-shadow:0 0 0 3px #1769e01f}
.ak-filtre{display:flex;gap:6px;flex-wrap:wrap}
.ak-filtre button{border:1px solid #d7dee4;background:#fff;color:#556370;border-radius:999px;padding:6px 12px;font-size:11px;font-weight:600}
.ak-filtre button.sec{background:#1769e0;border-color:#1769e0;color:#fff}
.ak-ilerleme{height:5px;background:#edf0f2;border-radius:3px;overflow:hidden;min-width:60px}.ak-ilerleme div{height:100%;background:#1769e0;border-radius:3px}
.ak-servisler{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
@media(max-width:1150px){.ak-iki{grid-template-columns:1fr}}
@media(max-width:950px){
  :root{--ak-side:76px}
  .ak-brand{font-size:0;padding:4px 0 14px;text-align:center}.ak-brand:before{content:"HM";font-size:18px}.ak-brand small{display:none}
  .ak-grup,.ak-nav .ak-et,.ak-nav .ak-yakinda,.ak-alt .ak-kim{display:none}
  .ak-nav button{justify-content:center;padding:9px 6px;border-left-width:2px;position:relative}
  .ak-nav .ak-rozet{position:absolute;top:2px;right:4px;padding:1px 5px}
  .ak-alt{justify-content:center;padding:10px 0 2px}.ak-alt button{padding:6px 7px}
  .ak-kpis{grid-template-columns:repeat(2,1fr)}
  .ak-top{padding:0 18px}.ak-icerik{padding:16px 18px 40px}
}
@media(max-width:620px){
  :root{--ak-side:58px}
  .ak-side{padding:14px 6px 10px}
  .ak-top{height:auto;min-height:58px;padding:10px 12px}.ak-top h1{font-size:17px}.ak-top p{display:none}
  .ak-eylem .ak-btn:not(.ana){display:none}.ak-btn.ana{padding:8px 10px;font-size:11px}
  .ak-icerik{padding:12px 12px 90px}
  .ak-hero{padding:16px}.ak-hero h2{font-size:19px}
  .ak-kpis{grid-template-columns:1fr 1fr;gap:10px}.ak-kpi b{font-size:22px}
  .ak-tablo .gizle{display:none}
}

/* ── Dosya detayı (maket "Dijital Hasar Dosyası") ── */
.ak-geri{border:0;background:transparent;color:#1769e0;padding:0;font-size:12px;font-weight:600;margin-bottom:2px}
.ak-geri:active{transform:none}
.ak-adim.bitti{background:#ecfdf5}.ak-adim.bitti b{color:#087c55}
.ak-adim.simdi{background:#eff6ff;box-shadow:inset 0 3px #3b82f6}.ak-adim.simdi b{color:#2563eb}
.ak-adim.bekler{background:#fffaf0}.ak-adim.bekler b{color:#a16207}
.ak-oncelik{height:4px;border-radius:5px;background:linear-gradient(90deg,#06b6d4 0 16%,#8b5cf6 16% 48%,#ec4899 48% 64%,#f59e0b 64% 80%,#10b981 80% 100%);margin:-4px 0 14px}
.ak-kutular{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.ak-kutular div{background:#f7f9fa;border-radius:10px;padding:10px 11px;min-width:0}
.ak-kutular span{display:block;color:#7b8994;font-size:10px;margin-bottom:4px}
.ak-kutular b{font-size:12px;color:#17212b;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ak-sekmeler{display:flex;gap:2px;border-top:1px solid #e3e8ec;margin:14px -16px -16px;padding:0 8px;overflow-x:auto}
.ak-sekmeler button{border:0;background:transparent;padding:12px 12px;color:#6c7a85;font-size:12px;font-weight:600;border-bottom:2px solid transparent;white-space:nowrap;position:relative}
.ak-sekmeler button:active{transform:none}
.ak-sekmeler button.aktif{color:#1769e0;border-bottom-color:#1769e0}
.ak-sekmeler .say{position:absolute;top:6px;right:0;border-radius:999px;padding:0 5px;font-size:8px;font-weight:800;color:#fff}
.ak-akis{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ak-zaman{border-left:2px solid #dce3e8;margin-left:7px}
.ak-olay{padding:0 0 14px 17px;position:relative}
.ak-olay:before{content:"";width:9px;height:9px;border-radius:50%;background:var(--g,#1769e0);position:absolute;left:-5.5px;top:3px}
.ak-olay b{font-size:12px;color:#17212b}.ak-olay p{margin:3px 0 0;font-size:11px;color:#7a8792}
.ak-dosya-baslik{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:800px){.ak-akis{grid-template-columns:1fr}}
.ak-brand.kucuk{font-size:16px}@media(max-width:950px){.ak-brand.kucuk{font-size:0}}
@media(max-width:620px){.ak-kutular{grid-template-columns:1fr 1fr;gap:8px}.ak-kutular div{padding:8px 9px}.ak-dosya-baslik{white-space:normal}}

/* ── Giriş ekranları ── */
.gk{min-height:100vh;display:grid;grid-template-columns:minmax(380px,44%) 1fr;background:#f4f6f8}
.gk-sol{position:relative;overflow:hidden;background:linear-gradient(160deg,#0c1720 0%,#142636 45%,#203b4e 100%);color:#fff;padding:44px 52px;display:flex;flex-direction:column;justify-content:space-between;gap:32px}
.gk-sol:before{content:"";position:absolute;width:420px;height:420px;right:-160px;top:-140px;border-radius:50%;background:radial-gradient(circle,#06b6d433,transparent 70%);pointer-events:none}
.gk-sol:after{content:"";position:absolute;width:360px;height:360px;left:-140px;bottom:-160px;border-radius:50%;background:radial-gradient(circle,#8b5cf62e,transparent 70%);pointer-events:none}
.gk-sol>*{position:relative;z-index:1}
.gk-marka{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:-.3px;margin-bottom:44px}
.gk-marka span{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#1769e0,#06b6d4);display:inline-flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 6px 18px #1769e055}
.gk-ust{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:#8fc9e9;font-weight:800}
.gk-sol h1{font-size:30px;line-height:1.2;font-weight:800;letter-spacing:-.6px;margin:10px 0 12px;max-width:440px}
.gk-sol p{color:#b9c9d5;font-size:13px;line-height:1.7;max-width:420px}
.gk-surec{display:flex;flex-wrap:wrap;gap:6px;margin-top:22px}
.gk-surec span{font-size:11px;font-weight:700;padding:6px 11px;border-radius:999px;background:color-mix(in srgb,var(--g) 16%,transparent);color:color-mix(in srgb,var(--g) 70%,white);border:1px solid color-mix(in srgb,var(--g) 35%,transparent)}
.gk-liste{list-style:none;display:grid;gap:14px}

.gk-sag{display:flex;align-items:center;justify-content:center;padding:40px 24px}
.gk-kutu{width:100%;max-width:440px;animation:popIn .3s ease}

.gk-alt{font-size:13px;color:#71808c;margin:6px 0 22px}
.gk-rol{width:100%;display:flex;align-items:center;gap:14px;text-align:left;background:#fff;border:1px solid #e5e9ed;border-left:3px solid var(--g);border-radius:14px;padding:14px 16px;margin-bottom:10px;box-shadow:0 1px 2px #00000008}

.gk-rol-metin{flex:1;min-width:0}.gk-rol-metin b{display:flex;align-items:center;gap:8px;font-size:14px;color:#17212b}
.gk-rol-metin small{display:block;font-size:12px;color:#7a8792;margin-top:3px}

  .gk-sol h1{font-size:20px;margin:6px 0 0}

  .gk-sag{align-items:flex-start;padding:22px 16px 40px}

<script type="text/babel">
// ─── API BAĞLANTISI ──────────────────────────────────────────────────────
// Canlı API adresi (sonunda /api ile). Canlıya alırken burayı doldurun.
const API_URL_CANLI = "https://hasartrack-api.vercel.app/api";
const API_URL = ["localhost","127.0.0.1"].includes(location.hostname)
  ? "http://localhost:3001/api"
  : API_URL_CANLI;

// API yardımcı fonksiyonu
// Hata nesnesine status eklenir. 401'de token silinir ve "ht-oturum-bitti" olayı atılır
// (giriş uçları hariç: yanlış şifre oturumu bitirmez).
async function apiCall(endpoint, method="GET", body=null) {
  if (!API_URL) throw new Error("API adresi yapılandırılmamış");
  const token = localStorage.getItem("ht_token");
  const opts = {
    method,
    headers: {
      "Content-Type": "application/json",
      ...(token ? { "Authorization": `Bearer ${token}` } : {})
    },
    ...(body ? { body: JSON.stringify(body) } : {})
  };
  let res;
  try {
    res = await fetch(`${API_URL}${endpoint}`, opts);
  } catch (e) {
    const err = new Error("Sunucuya ulaşılamadı");
    err.status = 0;
    throw err;
  }
  if (!res.ok) {
    const j = await res.json().catch(() => ({}));
    const err = new Error(j.error || `HTTP ${res.status}`);
    err.status = res.status;
    if (res.status === 401 && token && !endpoint.startsWith("/auth/")) {
      localStorage.removeItem("ht_token");
      window.dispatchEvent(new Event("ht-oturum-bitti"));
    }
    throw err;
  }
  return res.json();
}

const {useState,useEffect,useRef} = React;

// ─── API EŞLEME KATMANI ──────────────────────────────────────────────────
// API snake_case + sayı/ISO tarih döner; ekran bileşenleri camelCase + TL/GG.AA.YYYY metni kullanır.
// Dönüşümler yalnız burada yapılır.
function tlBicim(n){
  if(n===null||n===undefined||n==="")return "";
  const x=Number(n);
  if(Number.isNaN(x))return "";
  return x.toLocaleString("tr-TR",{maximumFractionDigits:2})+" ₺";
}
// "24.800 ₺" -> 24800, "24.800,50" -> 24800.5, "" -> null, geçersiz -> hata (istek atılmaz)
function tlSayi(s){
  if(s===null||s===undefined)return null;
  if(typeof s==="number"){if(!Number.isFinite(s))throw new Error("Geçersiz tutar");return s;}
  let t=String(s).replace(/₺|TL/gi,"").replace(/\s/g,"");
  if(t==="")return null;
  if(t.includes(","))t=t.replace(/\./g,"").replace(",",".");
  else if(/^\d{1,3}(\.\d{3})+$/.test(t))t=t.replace(/\./g,"");
  if(!/^\d+(\.\d+)?$/.test(t))throw new Error(`Geçersiz tutar: "${s}"`);
  return Number(t);
}
function tlSayiGuvenli(s){try{return tlSayi(s)||0;}catch(e){return 0;}}
// "2026-03-04" -> "04.03.2026"
function trTarih(iso){
  if(!iso)return "";
  const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso));
  return m?`${m[3]}.${m[2]}.${m[1]}`:"";
}
// Zaman damgası (UTC ISO) -> yerel "GG.AA.YYYY"
function trTarihZaman(ts){
  if(!ts)return "";
  const d=new Date(ts);
  return Number.isNaN(d.getTime())?"":d.toLocaleDateString("tr-TR");
}
// "04.03.2026" -> "2026-03-04"; "" -> null; geçersiz -> hata
function isoTarih(tr){
  if(tr===null||tr===undefined)return null;
  const t=String(tr).trim();
  if(t==="")return null;
  let y,a,g;
  let m=/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/.exec(t);
  if(m){g=+m[1];a=+m[2];y=+m[3];}
  else{m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(t);if(m){y=+m[1];a=+m[2];g=+m[3];}}
  const d=m?new Date(Date.UTC(y,a-1,g)):null;
  if(!d||d.getUTCFullYear()!==y||d.getUTCMonth()!==a-1||d.getUTCDate()!==g)
    throw new Error(`Tarih GG.AA.YYYY biçiminde olmalı: "${t}"`);
  return `${String(y).padStart(4,"0")}-${String(a).padStart(2,"0")}-${String(g).padStart(2,"0")}`;
}
const bos=(v)=>v===null||v===undefined?"":String(v);
// document.write ile basılan kullanıcı metinleri için HTML kaçışı
const htmlKac=(v)=>bos(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);

function esleListe(rows){
  return (rows||[]).map(r=>({
    id:r.id, dosyaNo:r.dosya_no, plaka:bos(r.plaka), sahip:bos(r.sahip_ad),
    arac:[r.marka,r.model].filter(Boolean).join(" ")+(r.yil?` (${r.yil})`:""),
    sigorta:bos(r.sigorta), bransi:bos(r.sigorta_bransi), muallakHasar:tlBicim(r.muallak_hasar),
    tarih:trTarihZaman(r.created_at), durum:r.durum, oncelik:r.oncelik,
    aktifAdim:bos(r.aktif_adim), ilerleme:Number(r.ilerleme)||0,
    atananServis:r.atanan_servis||null, servisAd:bos(r.servis_ad), onayDurumu:r.onay_durumu||"taslak",
    girisTrh:r.arac_giris_trh||null, tahminiTeslim:r.tahmini_teslimat||null,
  }));
}
function esleDetay(d){
  const a=d.arac||{},s=d.sahip||{},si=d.sigorta||{},e=d.eksper||{},om=d.onarim_merkezi||{},m=d.muhasebe||{};
  return {
    id:d.id, dosyaNo:d.dosya_no, acilisTarihi:trTarihZaman(d.created_at),
    oncelik:d.oncelik, durum:d.durum, sigortaBransi:bos(d.sigorta_bransi),
    muallakHasar:tlBicim(d.muallak_hasar), atananServis:d.atanan_servis||null, atamaNotu:bos(d.atama_notu),
    arac:{plaka:bos(a.plaka),marka:bos(a.marka),model:bos(a.model),yil:bos(a.yil),renk:bos(a.renk),
      sase:bos(a.sase_no),motorNo:bos(a.motor_no),ruhsatSeri:bos(a.ruhsat_seri),
      kazaTarihi:trTarih(a.kaza_tarihi),kazaAciklama:bos(a.kaza_aciklama)},
    sahip:{ad:bos(s.ad_soyad),tc:bos(s.tc_vergi),telefon:bos(s.telefon),email:bos(s.email),adres:bos(s.adres)},
    onarimMerkezi:{ad:bos(om.ad),yetkili:bos(om.yetkili_kisi),telefon:bos(om.telefon),email:bos(om.email),
      adres:bos(om.adres),aracGiris:trTarih(om.arac_giris_trh),tahminiTamir:trTarih(om.tahmini_teslimat)},
    sigortaSirketi:{ad:bos(si.sirket_ad),hasarNo:bos(si.hasar_no),temsilci:bos(si.temsilci_ad),telefon:bos(si.temsilci_tel),
      email:bos(si.temsilci_mail),police:bos(si.police_no),teminat:bos(si.teminat_turu),muafiyet:tlBicim(si.muafiyet)},
    eksper:{ad:bos(e.ad_soyad),firma:bos(e.firma),lisans:bos(e.lisans_no),telefon:bos(e.telefon),email:bos(e.email),
      incelemeTarihi:trTarih(e.inceleme_tarihi),tahminiHasar:tlBicim(e.tahmini_hasar),onayDurumu:e.onay_durumu||"Beklemede"},
    muhasebe:{servisFatura:tlBicim(m.servis_fatura_tutar),servisFaturaTarihi:trTarih(m.servis_fatura_trh),
      servisFaturaNo:bos(m.servis_fatura_no),sigortaOdeme:tlBicim(m.sigorta_odeme_tutar),
      sigortaOdemeTarihi:trTarih(m.sigorta_odeme_trh),onaylananTutar:tlBicim(m.onaylanan_tutar),notlar:bos(m.notlar)},
  };
}
function esleAdim(a){
  return {id:a.id,sira:a.sira,ad:a.ad,tarih:trTarihZaman(a.tamamlanma_trh),durum:a.durum,not:bos(a.not_metni),otoSms:!!a.oto_sms};
}
function esleKalem(k){
  return {id:k.id,kategori:k.kategori||"Diğer",aciklama:k.aciklama,birim:k.birim||"Adet",
    miktar:Number(k.miktar)||0,birimFiyat:Number(k.birim_fiyat)||0,durum:k.durum||"bekliyor",odeyen:k.odeyen||"sigorta",
    isEmriId:k.is_emri_id||null,onaylayanTip:k.onaylayan_tip||null,onaylayanAd:k.onaylayan_ad||""};
}
// Yeni dosya sihirbazı formu -> POST /dosyalar gövdesi
function esleWizard(f){
  const yil=String(f.yil||"").trim();
  if(yil&&!/^\d{4}$/.test(yil))throw new Error("Model yılı 4 haneli olmalı");
  return {
    arac:{plaka:f.plaka,marka:f.marka,model:f.model,yil:yil?Number(yil):null,renk:f.renk,
      saseNo:f.saseNo,motorNo:f.motorNo,ruhsatSeri:f.ruhsatSeriNo},
    sahip:{adSoyad:f.sahipAd,tcVergi:f.tc,telefon:f.telefon,email:f.email},
    sigorta:{sirketAd:f.sigortaSirketi,bransi:f.bransi,muallakHasar:tlSayi(f.muallakHasar),
      policeNo:f.policeNo,hasarNo:f.hasarNo,teminatTuru:f.teminat,muafiyet:tlSayi(f.muafiyet)},
    kaza:{tarih:isoTarih(f.kazaTarihi),aciklama:f.kazaAciklama},
  };
}
// Ekran alanı -> [alt_tablo, kolon, tip]. Yalnız burada tanımlı alanlar PATCH ile gönderilir.
const ALAN_HARITASI = {
  "sigortaBransi":["dosyalar","sigorta_bransi","metin"],
  "muallakHasar":["dosyalar","muallak_hasar","para"],
  "sigortaSirketi.ad":["sigorta","sirket_ad","metin"],
  "sigortaSirketi.hasarNo":["sigorta","hasar_no","metin"],
  "sigortaSirketi.police":["sigorta","police_no","metin"],
  "sigortaSirketi.teminat":["sigorta","teminat_turu","metin"],
  "sigortaSirketi.muafiyet":["sigorta","muafiyet","para"],
  "sigortaSirketi.temsilci":["sigorta","temsilci_ad","metin"],
  "sigortaSirketi.telefon":["sigorta","temsilci_tel","metin"],
  "sahip.ad":["sahip","ad_soyad","metin"],
  "sahip.tc":["sahip","tc_vergi","metin"],
  "sahip.telefon":["sahip","telefon","metin"],
  "sahip.email":["sahip","email","metin"],
  "arac.marka":["arac","marka","metin"],
  "arac.model":["arac","model","metin"],
  "arac.yil":["arac","yil","tamsayi"],
  "arac.plaka":["arac","plaka","metin"],
  "arac.renk":["arac","renk","metin"],
  "arac.sase":["arac","sase_no","metin"],
  "arac.kazaTarihi":["arac","kaza_tarihi","tarih"],
  "arac.kazaAciklama":["arac","kaza_aciklama","metin"],
  "onarimMerkezi.ad":["onarim_merkezi","ad","metin"],
  "onarimMerkezi.yetkili":["onarim_merkezi","yetkili_kisi","metin"],
  "onarimMerkezi.telefon":["onarim_merkezi","telefon","metin"],
  "onarimMerkezi.aracGiris":["onarim_merkezi","arac_giris_trh","tarih"],
  "onarimMerkezi.tahminiTamir":["onarim_merkezi","tahmini_teslimat","tarih"],
  "eksper.ad":["eksper","ad_soyad","metin"],
  "eksper.firma":["eksper","firma","metin"],
  "eksper.lisans":["eksper","lisans_no","metin"],
  "eksper.incelemeTarihi":["eksper","inceleme_tarihi","tarih"],
  "eksper.tahminiHasar":["eksper","tahmini_hasar","para"],
  "eksper.onayDurumu":["eksper","onay_durumu","metin"],
  "muhasebe.sigortaOdemeTarihi":["muhasebe","sigorta_odeme_trh","tarih"],
  "muhasebe.sigortaOdeme":["muhasebe","sigorta_odeme_tutar","para"],
  "muhasebe.notlar":["muhasebe","notlar","metin"],
};
const yolDeger=(o,yol)=>yol.split(".").reduce((x,k)=>x==null?x:x[k],o);
function apiDeger(tip,v){
  if(tip==="para")return tlSayi(v);
  if(tip==="tarih")return isoTarih(v);
  if(tip==="tamsayi"){
    const t=bos(v).trim();if(t==="")return null;
    if(!/^\d+$/.test(t))throw new Error(`Geçersiz sayı: "${v}"`);
    return Number(t);
  }
  return v===undefined||v===null?"":v;
}
// Yalnız değişen alanları sırayla PATCH eder. Dönüşüm hataları istek atılmadan yakalanır.
// İlk API hatasında durur; o ana kadar kaydedilenler onUygula ile bildirilir.
async function dosyaKaydet(dosyaId,yollar,eski,yeni,onUygula){
  const isler=[];
  for(const yol of yollar){
    const h=ALAN_HARITASI[yol];if(!h)continue;
    const a=bos(yolDeger(eski,yol)),b=bos(yolDeger(yeni,yol));
    if(a===b)continue;
    isler.push({yol,alt_tablo:h[0]==="dosyalar"?undefined:h[0],alan:h[1],deger:apiDeger(h[2],b)});
  }
  for(const i of isler){
    await apiCall(`/dosyalar/${dosyaId}`,"PATCH",{alt_tablo:i.alt_tablo,alan:i.alan,deger:i.deger});
    if(onUygula)onUygula(i.yol);
  }
  return isler.length;
}
// İşlem kalemleri için ortak API işlemleri (servis ve admin panelleri). yenile: ekranı API'den tazeler.
function islemApiOlustur(dosyaId,yenile){
  const u=`/islemler/${dosyaId}`;
  return {
    kalemEkle:async(f)=>{await apiCall(u,"POST",{kategori:f.kategori,aciklama:f.aciklama,birim:f.birim,miktar:f.miktar,birim_fiyat:f.birimFiyat,odeyen:f.odeyen,is_emri_id:f.isEmriId});await yenile();},
    kalemToplu:async(liste,isEmriId)=>{await apiCall(`${u}/toplu`,"POST",{is_emri_id:isEmriId,kalemler:liste.map(k=>({kategori:k.kategori,aciklama:k.aciklama,birim:k.birim,miktar:k.miktar,birim_fiyat:k.birimFiyat,odeyen:k.odeyen}))});await yenile();},
    kalemKaydet:async(id,alanlar)=>{await apiCall(`${u}/${id}`,"PATCH",alanlar);await yenile();},
    kalemSil:async(id)=>{await apiCall(`${u}/${id}`,"DELETE");await yenile();},
    onayaGonder:async(isEmriId)=>{await apiCall(`${u}/onaya-gonder`,"POST",{is_emri_id:isEmriId});await yenile();},
    adminKarar:async(karar,not,ek)=>{await apiCall(`${u}/admin-karar`,"POST",{karar,not_metni:not||undefined,...(ek||{})});await yenile();},
    // Ek hasar: ana iş emri onaylandıktan sonra yeni iş emri (kendi onay turu)
    ekHasar:async(aciklama)=>{const r=await apiCall(`/is-emirleri/${dosyaId}`,"POST",{aciklama});await yenile();return r;},
  };
}

            <div style={{display:"flex",alignItems:"center",gap:6}}>
              <span style={{fontSize:13,fontWeight:a.durum==="aktif"?700:500,color:a.durum==="bekliyor"?"var(--text-3)":a.durum==="aktif"?"#818CF8":"var(--text-1)"}}>{a.ad}</span>
              {a.otoSms&&!readonly&&<span style={{fontSize:8,fontWeight:700,padding:"1px 5px",borderRadius:3,background:"rgba(16,185,129,0.15)",color:"#10B981",border:"1px solid rgba(16,185,129,0.2)"}}>📱 Oto-SMS</span>}
            </div>
            <div style={{display:"flex",gap:6,flexShrink:0,alignItems:"center"}}>
              {a.tarih&&<span style={{fontSize:10,color:"var(--text-2)",fontFamily:"var(--font-mono)"}}>{a.tarih}</span>}
              {!readonly&&a.durum!=="tamamlandi"&&onTamamla&&<button onClick={()=>onTamamla(a.id)} style={{background:"rgba(16,185,129,0.12)",border:"1px solid rgba(16,185,129,0.25)",color:"#10B981",borderRadius:5,padding:"2px 8px",fontSize:9,fontWeight:700}}>Tamamla</button>}
            </div>
          </div>
          {a.not&&<div style={{fontSize:11,color:"var(--text-2)",lineHeight:1.5}}>{a.not}</div>}
        </div>
      </div>
    ))}</div>
  );
}


// ─── STOK: SERVİS DEPOSU VE PARÇA SİPARİŞLERİ ──────────────────────────────
// Servis yazar; admin okur (servisId ile). Stok miktarı hareketlerden hesaplanır (API).
const SIPARIS_DURUM={siparis:{l:"Sipariş verildi",c:"#64748B"},yolda:{l:"Yolda",c:"#3B82F6"},kismi:{l:"Kısmen geldi",c:"#F59E0B"},geldi:{l:"Geldi",c:"#10B981"},iptal:{l:"İptal",c:"#EF4444"}};
const HAREKET_TIP={giris:{l:"Giriş",c:"#10B981",isaret:"+"},cikis:{l:"Çıkış",c:"#EF4444",isaret:"−"},duzeltme:{l:"Düzeltme",c:"#F59E0B",isaret:"±"}};
const sayiMetni=(n)=>Number(n||0).toLocaleString("tr-TR",{maximumFractionDigits:2});
const bugunIso=()=>new Date().toISOString().slice(0,10);

function StokYonetim({rol,servisId}){
  const yazar=rol==="servis";
  const q=rol==="admin"?`?servis_id=${encodeURIComponent(servisId)}`:"";
  const [veri,setVeri]=useState(null);
  const [hata,setHata]=useState("");
  const [islemHata,setIslemHata]=useState("");
  const [sekme,setSekme]=useState("genel");
  const [arama,setArama]=useState("");
  const [sipFiltre,setSipFiltre]=useState("acik");
  const [dosyalar,setDosyalar]=useState([]);
  const [hareketForm,setHareketForm]=useState(null); // {parca,tip,adet,birim_maliyet,dosya_id,aciklama}
  const [parcaForm,setParcaForm]=useState(null);     // {id?,ad,oem_no,kategori,birim,min_stok}
  const [tedForm,setTedForm]=useState(null);         // {ad,telefon,email,vkn,notlar}
  const [sipForm,setSipForm]=useState(null);         // {tedarikci_id,dosya_id,siparis_no,tahmini_gelis,notlar,kalemler:[{parca_id,yeni_ad,adet,birim_fiyat}]}
  const [teslimForm,setTeslimForm]=useState(null);   // {siparis,adetler:{kalemId:adet},araca_tak}
  const [calisiyor,setCalisiyor]=useState(false);
  const yukle=async()=>{
    try{setVeri(await apiCall(`/stok/ozet${q}`));setHata("");}
    catch(e){setHata(e.message||"Stok bilgisi alınamadı.");}
  };
  useEffect(()=>{setVeri(null);yukle();if(yazar)apiCall("/dosyalar?limit=200").then(d=>setDosyalar(esleListe(d.dosyalar))).catch(()=>{});},[rol,servisId]);
  const calis=async(fn)=>{
    if(calisiyor)return;
    setCalisiyor(true);setIslemHata("");
    try{await fn();await yukle();}
    catch(e){setIslemHata(e.message||"İşlem başarısız.");}
    finally{setCalisiyor(false);}
  };
  if(!veri)return hata?<HataKutusu hata={hata} onTekrar={yukle}/>:<Card><span style={{fontSize:12,color:"var(--text-2)",animation:"pulse .8s infinite"}}>Stok yükleniyor...</span></Card>;

  const {parcalar,siparisler,tedarikciler,hareketler}=veri;
  const aktifParcalar=parcalar.filter(p=>p.aktif);
  const kritik=aktifParcalar.filter(p=>p.kritik);
  const acikSiparis=siparisler.filter(s=>["siparis","yolda","kismi"].includes(s.durum));
  const geciken=acikSiparis.filter(s=>s.geciken);
  const depoDegeri=parcalar.reduce((t,p)=>t+Number(p.stok)*Number(p.ort_maliyet||0),0);
  const inp={background:"var(--border)",border:"1px solid var(--border-hi)",borderRadius:7,color:"var(--text-1)",padding:"7px 9px",fontSize:12,width:"100%"};
  const lbl=(t)=><div style={{fontSize:10,color:"var(--text-2)",fontWeight:700,marginBottom:3}}>{t}</div>;
  const th={textAlign:"left",padding:"8px 10px",color:"var(--text-3)",fontWeight:700,fontSize:10,whiteSpace:"nowrap"};
  const td={padding:"8px 10px",fontSize:12,borderTop:"1px solid var(--border)"};
  const plakaAd=(id)=>{const d=dosyalar.find(x=>x.id===id);return d?`${d.plaka} · ${d.dosyaNo}`:"";};
  const formKutusu=(baslik,icerik,kaydet,kapat)=>(
    <Card style={{border:"1.5px solid rgba(59,130,246,0.35)"}}>
      <ST>{baslik}</ST>
      {icerik}
      <div style={{display:"flex",gap:8,marginTop:12}}>
        <button onClick={kaydet} disabled={calisiyor} style={{background:"#2563EB",border:"none",color:"#fff",borderRadius:8,padding:"8px 16px",fontSize:12,fontWeight:700}}>{calisiyor?"Kaydediliyor...":"Kaydet"}</button>
        <button onClick={kapat} style={{background:"var(--border)",border:"1px solid var(--border-md)",color:"var(--text-2)",borderRadius:8,padding:"8px 12px",fontSize:12}}>Vazgeç</button>
      </div>
    </Card>
  );
  const SEKMELER=[{id:"genel",l:"Genel",mi:"📦"},{id:"depo",l:`Depo (${aktifParcalar.length})`,mi:"🗂️"},{id:"siparis",l:`Siparişler (${acikSiparis.length})`,mi:"🚚",uyari:geciken.length},{id:"hareket",l:"Hareketler",mi:"↕️"},{id:"tedarikci",l:"Tedarikçiler",mi:"🏭"}];

  const siparisKarti=(s)=>{const sd=SIPARIS_DURUM[s.durum]||SIPARIS_DURUM.siparis;const acik=["siparis","yolda","kismi"].includes(s.durum);return(
    <div key={s.id} style={{border:`1px solid ${s.geciken?"rgba(239,68,68,0.4)":"var(--border)"}`,borderRadius:10,padding:"10px 12px",background:"var(--surface-2)"}}>
      <div style={{display:"flex",justifyContent:"space-between",gap:8,flexWrap:"wrap"}}>
        <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>
          <span style={{fontWeight:800,fontSize:13}}>{s.tedarikci_ad||"Tedarikçi belirtilmedi"}</span>
          <Chip renk={sd.c} sm>{sd.l}</Chip>
          {s.geciken&&<Chip renk="#EF4444" sm>Gecikti</Chip>}
          {s.plaka&&<span style={{fontSize:11,color:"#7C3AED",fontWeight:700}}>🚗 {s.plaka}</span>}
        </div>
        <span style={{fontWeight:800,fontFamily:"var(--font-mono)",fontSize:13}}>{tlBicim(s.toplam)}</span>
      </div>
      <div style={{fontSize:11,color:"var(--text-2)",marginTop:3}}>
        {[s.siparis_no&&`No ${s.siparis_no}`,`Sipariş ${trTarih(s.siparis_trh)}`,s.tahmini_gelis&&`Tahmini geliş ${trTarih(s.tahmini_gelis)}`,s.gelis_trh&&`Geldi ${trTarih(s.gelis_trh)}`,s.fatura_no&&`Fatura ${s.fatura_no}`].filter(Boolean).join(" · ")}
      </div>
      <div style={{marginTop:6,display:"flex",flexDirection:"column",gap:2}}>
        {s.kalemler.map(k=><div key={k.id} style={{fontSize:12,display:"flex",gap:8,flexWrap:"wrap"}}>
          <span style={{flex:1,minWidth:140}}>{k.parca_ad}</span>
          <span style={{color:Number(k.gelen_adet)>=Number(k.adet)?"#10B981":"var(--text-2)"}}>{sayiMetni(k.gelen_adet)}/{sayiMetni(k.adet)} {k.birim}</span>
          {k.birim_fiyat!==null&&<span style={{color:"var(--text-3)",fontFamily:"var(--font-mono)"}}>{tlBicim(k.birim_fiyat)}</span>}
        </div>)}
      </div>
      {s.notlar&&<div style={{fontSize:11,color:"var(--text-2)",marginTop:4}}>📝 {s.notlar}</div>}
      {yazar&&acik&&<div style={{display:"flex",gap:6,marginTop:8,flexWrap:"wrap"}}>
        <button onClick={()=>setTeslimForm({siparis:s,araca_tak:!!s.dosya_id,adetler:Object.fromEntries(s.kalemler.map(k=>[k.id,String(Math.max(0,Number(k.adet)-Number(k.gelen_adet)))]))})} style={kucukBtn("#10B981")}>📥 Teslim al</button>
        {s.durum==="siparis"&&<button onClick={()=>calis(()=>apiCall(`/stok/siparisler/${s.id}`,"PATCH",{durum:"yolda"}))} style={kucukBtn("#3B82F6")}>Yolda</button>}
        {s.durum!=="kismi"&&<button onClick={()=>{if(window.confirm("Sipariş iptal edilsin mi?"))calis(()=>apiCall(`/stok/siparisler/${s.id}`,"PATCH",{durum:"iptal"}));}} style={kucukBtn("#EF4444")}>İptal</button>}
      </div>}
    </div>
  );};

  return(
    <div style={{display:"flex",flexDirection:"column",gap:14}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}}>
        <div style={{fontWeight:800,fontSize:16}}>📦 Depo ve Parça Siparişleri {!yazar&&<span style={{fontSize:11,color:"var(--text-3)",fontWeight:600}}>· salt okunur</span>}</div>
        {yazar&&<div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
          <button onClick={()=>{setSekme("siparis");setSipForm({tedarikci_id:"",dosya_id:"",siparis_no:"",tahmini_gelis:"",notlar:"",kalemler:[{parca_id:"",yeni_ad:"",adet:"1",birim_fiyat:""}]});}} style={{background:"#2563EB",border:"none",color:"#fff",borderRadius:8,padding:"8px 14px",fontSize:12,fontWeight:700}}>+ Sipariş</button>
          <button onClick={()=>{setSekme("depo");setParcaForm({ad:"",oem_no:"",kategori:"",birim:"Adet",min_stok:"0"});}} style={kucukBtn("#2563EB")}>+ Parça kartı</button>
        </div>}
      </div>
      <div style={{display:"flex",gap:4,flexWrap:"wrap",borderBottom:"1px solid var(--border)"}}>
        {SEKMELER.map(t=><button key={t.id} onClick={()=>setSekme(t.id)} style={{padding:"8px 12px",fontSize:12,fontWeight:700,border:"none",borderBottom:`2px solid ${sekme===t.id?"#2563EB":"transparent"}`,background:"transparent",color:sekme===t.id?"#2563EB":"var(--text-2)"}}>{t.mi} {t.l}{t.uyari>0&&<span style={{marginLeft:5,background:"#EF4444",color:"#fff",borderRadius:8,padding:"0 6px",fontSize:10}}>{t.uyari}</span>}</button>)}
      </div>
      {islemHata&&<HataKutusu hata={islemHata}/>}

      {/* Formlar */}
      {parcaForm&&formKutusu(parcaForm.id?"Parça kartını düzenle":"Yeni parça kartı",
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))",gap:8}}>
          {[["ad","PARÇA ADI","örn. Ön tampon"],["oem_no","OEM NO",""],["kategori","KATEGORİ","örn. Kaporta"],["birim","BİRİM","Adet"],["min_stok","ASGARİ STOK","0"]].map(([k,l,ph])=>
            <div key={k}>{lbl(l)}<input type={k==="min_stok"?"number":"text"} value={parcaForm[k]} onChange={e=>setParcaForm(p=>({...p,[k]:e.target.value}))} placeholder={ph} style={inp}/></div>)}
        </div>,
        ()=>calis(async()=>{const {id,...b}=parcaForm;await apiCall(id?`/stok/parcalar/${id}`:"/stok/parcalar",id?"PATCH":"POST",{...b,min_stok:b.min_stok===""?0:Number(b.min_stok)});setParcaForm(null);}),
        ()=>setParcaForm(null))}
      {hareketForm&&formKutusu(`${hareketForm.parca.ad}: ${hareketForm.tip==="giris"?"depoya giriş":hareketForm.tip==="cikis"?"araca tak / çıkış":"sayım düzeltmesi"}`,
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(160px,1fr))",gap:8}}>
          <div>{lbl(hareketForm.tip==="duzeltme"?"ADET (EKSİ OLABİLİR)":"ADET")}<input type="number" value={hareketForm.adet} onChange={e=>setHareketForm(p=>({...p,adet:e.target.value}))} style={inp}/></div>
          {hareketForm.tip==="giris"&&<div>{lbl("BİRİM MALİYET (KDV HARİÇ) ₺")}<input type="number" value={hareketForm.birim_maliyet} onChange={e=>setHareketForm(p=>({...p,birim_maliyet:e.target.value}))} style={inp}/></div>}
          {hareketForm.tip==="cikis"&&<div>{lbl("TAKILDIĞI ARAÇ")}<select value={hareketForm.dosya_id} onChange={e=>setHareketForm(p=>({...p,dosya_id:e.target.value}))} style={inp}><option value="">Araç seçilmedi (sarf/fire)</option>{dosyalar.map(d=><option key={d.id} value={d.id}>{d.plaka} · {d.dosyaNo}</option>)}</select></div>}
          <div style={{gridColumn:"1 / -1"}}>{lbl("AÇIKLAMA")}<input value={hareketForm.aciklama} onChange={e=>setHareketForm(p=>({...p,aciklama:e.target.value}))} placeholder={hareketForm.tip==="duzeltme"?"örn. sayım farkı":"isteğe bağlı"} style={inp}/></div>
          <div style={{fontSize:11,color:"var(--text-2)",gridColumn:"1 / -1"}}>Depoda şu an: <strong>{sayiMetni(hareketForm.parca.stok)} {hareketForm.parca.birim}</strong></div>
        </div>,
        ()=>calis(async()=>{const f=hareketForm;await apiCall("/stok/hareketler","POST",{parca_id:f.parca.id,tip:f.tip,adet:Number(f.adet),birim_maliyet:f.birim_maliyet===""?undefined:Number(f.birim_maliyet),dosya_id:f.dosya_id||undefined,aciklama:f.aciklama});setHareketForm(null);}),
        ()=>setHareketForm(null))}
      {tedForm&&formKutusu("Yeni tedarikçi",
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))",gap:8}}>
          {[["ad","FİRMA ADI"],["telefon","TELEFON"],["email","E-POSTA"],["vkn","VKN"],["notlar","NOT"]].map(([k,l])=>
            <div key={k}>{lbl(l)}<input value={tedForm[k]} onChange={e=>setTedForm(p=>({...p,[k]:e.target.value}))} style={inp}/></div>)}
        </div>,
        ()=>calis(async()=>{await apiCall("/stok/tedarikciler","POST",tedForm);setTedForm(null);}),
        ()=>setTedForm(null))}
      {sipForm&&formKutusu("Yeni parça siparişi",
        <div style={{display:"flex",flexDirection:"column",gap:10}}>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(170px,1fr))",gap:8}}>
            <div>{lbl("TEDARİKÇİ")}<select value={sipForm.tedarikci_id} onChange={e=>setSipForm(p=>({...p,tedarikci_id:e.target.value}))} style={inp}><option value="">Seçilmedi</option>{tedarikciler.filter(t=>t.aktif).map(t=><option key={t.id} value={t.id}>{t.ad}</option>)}</select></div>
            <div>{lbl("HANGİ ARAÇ İÇİN")}<select value={sipForm.dosya_id} onChange={e=>setSipForm(p=>({...p,dosya_id:e.target.value}))} style={inp}><option value="">Depo için (araç yok)</option>{dosyalar.map(d=><option key={d.id} value={d.id}>{d.plaka} · {d.dosyaNo}</option>)}</select></div>
            <div>{lbl("SİPARİŞ NO")}<input value={sipForm.siparis_no} onChange={e=>setSipForm(p=>({...p,siparis_no:e.target.value}))} style={inp}/></div>
            <div>{lbl("TAHMİNİ GELİŞ")}<input type="date" min={bugunIso()} value={sipForm.tahmini_gelis} onChange={e=>setSipForm(p=>({...p,tahmini_gelis:e.target.value}))} style={inp}/></div>
          </div>
          {lbl("KALEMLER")}
          {sipForm.kalemler.map((k,i)=>{const set=(a,v)=>setSipForm(p=>({...p,kalemler:p.kalemler.map((x,j)=>j===i?{...x,[a]:v}:x)}));return(
            <div key={i} style={{display:"grid",gridTemplateColumns:"2fr 1.5fr 0.7fr 1fr auto",gap:6,alignItems:"center"}}>
              <select value={k.parca_id} onChange={e=>set("parca_id",e.target.value)} style={inp}><option value="">+ Yeni parça (adını yazın)</option>{aktifParcalar.map(p=><option key={p.id} value={p.id}>{p.ad}{p.oem_no?` (${p.oem_no})`:""}</option>)}</select>
              <input value={k.yeni_ad} disabled={!!k.parca_id} onChange={e=>set("yeni_ad",e.target.value)} placeholder={k.parca_id?"":"Yeni parça adı"} style={{...inp,opacity:k.parca_id?.4:1}}/>
              <input type="number" value={k.adet} onChange={e=>set("adet",e.target.value)} placeholder="Adet" style={inp}/>
              <input type="number" value={k.birim_fiyat} onChange={e=>set("birim_fiyat",e.target.value)} placeholder="Birim ₺ (KDV hariç)" style={inp}/>
              <button onClick={()=>setSipForm(p=>({...p,kalemler:p.kalemler.filter((_,j)=>j!==i)}))} disabled={sipForm.kalemler.length===1} style={kucukBtn("#64748B")}>×</button>
            </div>
          );})}
          <button onClick={()=>setSipForm(p=>({...p,kalemler:[...p.kalemler,{parca_id:"",yeni_ad:"",adet:"1",birim_fiyat:""}]}))} style={{...kucukBtn("#2563EB"),alignSelf:"flex-start"}}>+ Kalem</button>
          <div>{lbl("NOT")}<input value={sipForm.notlar} onChange={e=>setSipForm(p=>({...p,notlar:e.target.value}))} style={inp}/></div>
        </div>,
        ()=>calis(async()=>{
          const f=sipForm;
          const kalemler=f.kalemler.map(k=>{
            if(!k.parca_id&&!k.yeni_ad.trim())throw new Error("Her kalem için parça seçin veya yeni parça adı yazın");
            return {...(k.parca_id?{parca_id:k.parca_id}:{yeni_parca:{ad:k.yeni_ad.trim()}}),adet:Number(k.adet),birim_fiyat:k.birim_fiyat===""?undefined:Number(k.birim_fiyat)};
          });
          await apiCall("/stok/siparisler","POST",{tedarikci_id:f.tedarikci_id||undefined,dosya_id:f.dosya_id||undefined,siparis_no:f.siparis_no,tahmini_gelis:f.tahmini_gelis||undefined,notlar:f.notlar,kalemler});
          setSipForm(null);
        }),
        ()=>setSipForm(null))}
      {teslimForm&&formKutusu(`Teslim al: ${teslimForm.siparis.tedarikci_ad||"sipariş"}`,
        <div style={{display:"flex",flexDirection:"column",gap:6}}>
          {teslimForm.siparis.kalemler.filter(k=>Number(k.gelen_adet)<Number(k.adet)).map(k=>(
            <div key={k.id} style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
              <span style={{flex:1,minWidth:150,fontSize:12}}>{k.parca_ad} <span style={{color:"var(--text-3)"}}>(kalan {sayiMetni(Number(k.adet)-Number(k.gelen_adet))})</span></span>
              <input type="number" value={teslimForm.adetler[k.id]} onChange={e=>setTeslimForm(p=>({...p,adetler:{...p.adetler,[k.id]:e.target.value}}))} style={{...inp,width:100}}/>
            </div>
          ))}
          {teslimForm.siparis.dosya_id&&<label style={{display:"flex",gap:8,alignItems:"center",fontSize:12,marginTop:4}}><input type="checkbox" checked={teslimForm.araca_tak} onChange={e=>setTeslimForm(p=>({...p,araca_tak:e.target.checked}))}/> Gelen parçalar doğrudan {teslimForm.siparis.plaka} aracına takıldı (depoya girip çıkar)</label>}
        </div>,
        ()=>calis(async()=>{
          const kalemler=Object.entries(teslimForm.adetler).filter(([,a])=>Number(a)>0).map(([kalem_id,a])=>({kalem_id,adet:Number(a)}));
          if(!kalemler.length)throw new Error("Teslim alınan adet girin");
          await apiCall(`/stok/siparisler/${teslimForm.siparis.id}/teslim`,"POST",{kalemler,araca_tak:teslimForm.araca_tak});
          setTeslimForm(null);
        }),
        ()=>setTeslimForm(null))}

      {sekme==="genel"&&(
        <>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))",gap:10}}>
            {[{l:"Parça çeşidi",v:aktifParcalar.length,c:"#2563EB"},{l:"Kritik stok",v:kritik.length,c:kritik.length?"#EF4444":"#10B981"},{l:"Açık sipariş",v:acikSiparis.length,c:"#3B82F6"},{l:"Geciken sipariş",v:geciken.length,c:geciken.length?"#EF4444":"#10B981"},{l:"Depo değeri",v:tlBicim(depoDegeri)||"0 ₺",c:"#7C3AED"}].map(k=>(
              <Card key={k.l}><div style={{fontSize:9,color:"var(--text-2)",fontWeight:700,marginBottom:6}}>{k.l.toLocaleUpperCase("tr-TR")}</div><div style={{fontSize:20,fontWeight:800,color:k.c}}>{k.v}</div></Card>
            ))}
          </div>
          {kritik.length>0&&<Card style={{border:"1px solid rgba(239,68,68,0.3)"}}>
            <ST>⚠️ Kritik stok</ST>
            {kritik.map(p=><div key={p.id} style={{display:"flex",justifyContent:"space-between",gap:8,padding:"6px 0",borderTop:"1px solid var(--border)",fontSize:12,flexWrap:"wrap"}}>
              <span>{p.ad}{p.oem_no&&<span style={{color:"var(--text-3)"}}> · {p.oem_no}</span>}</span>
              <span><strong style={{color:"#EF4444"}}>{sayiMetni(p.stok)}</strong> / asgari {sayiMetni(p.min_stok)} {p.birim}{Number(p.yoldaki)>0&&<span style={{color:"#3B82F6"}}> · yolda {sayiMetni(p.yoldaki)}</span>}</span>
            </div>)}
          </Card>}
          <Card>
            <ST>🚚 Açık siparişler</ST>
            {acikSiparis.length===0?<div style={{fontSize:12,color:"var(--text-2)"}}>Açık sipariş yok.</div>
              :<div style={{display:"flex",flexDirection:"column",gap:8}}>{[...acikSiparis].sort((a,b)=>(b.geciken-a.geciken)||String(a.tahmini_gelis||"9").localeCompare(String(b.tahmini_gelis||"9"))).map(siparisKarti)}</div>}
          </Card>
        </>
      )}

      {sekme==="depo"&&(
        <Card style={{padding:0,overflow:"hidden"}}>
          <div style={{padding:10}}><input value={arama} onChange={e=>setArama(e.target.value)} placeholder="Parça adı, OEM veya kategori ara..." style={inp}/></div>
          <div style={{overflowX:"auto"}}>
            <table style={{width:"100%",borderCollapse:"collapse"}}>
              <thead><tr><th style={th}>Parça</th><th style={th}>Kategori</th><th style={{...th,textAlign:"right"}}>Stok</th><th style={{...th,textAlign:"right"}}>Yolda</th><th style={{...th,textAlign:"right"}}>Ort. maliyet</th><th style={{...th,textAlign:"right"}}>Değer</th>{yazar&&<th style={th}/>}</tr></thead>
              <tbody>
                {parcalar.filter(p=>!arama||`${p.ad} ${p.oem_no||""} ${p.kategori||""}`.toLocaleLowerCase("tr-TR").includes(arama.toLocaleLowerCase("tr-TR"))).map(p=>(
                  <tr key={p.id} style={{opacity:p.aktif?1:.5,background:p.kritik?"rgba(239,68,68,0.04)":"transparent"}}>
                    <td style={td}><div style={{fontWeight:700}}>{p.ad}</div>{p.oem_no&&<div style={{fontSize:10,color:"var(--text-3)",fontFamily:"var(--font-mono)"}}>{p.oem_no}</div>}</td>
                    <td style={{...td,color:"var(--text-2)"}}>{p.kategori||"—"}</td>
                    <td style={{...td,textAlign:"right",fontWeight:800,color:p.kritik?"#EF4444":"var(--text-1)"}}>{sayiMetni(p.stok)} <span style={{fontWeight:400,color:"var(--text-3)",fontSize:10}}>{p.birim} · asg. {sayiMetni(p.min_stok)}</span></td>
                    <td style={{...td,textAlign:"right",color:"#3B82F6"}}>{Number(p.yoldaki)>0?sayiMetni(p.yoldaki):"—"}</td>
                    <td style={{...td,textAlign:"right",fontFamily:"var(--font-mono)"}}>{p.ort_maliyet!==null?tlBicim(p.ort_maliyet):"—"}</td>
                    <td style={{...td,textAlign:"right",fontFamily:"var(--font-mono)"}}>{tlBicim(Number(p.stok)*Number(p.ort_maliyet||0))||"—"}</td>
                    {yazar&&<td style={{...td,whiteSpace:"nowrap"}}>
                      <div style={{display:"flex",gap:4}}>
                        <button onClick={()=>setHareketForm({parca:p,tip:"giris",adet:"1",birim_maliyet:"",dosya_id:"",aciklama:""})} style={kucukBtn("#10B981")}>Giriş</button>
                        <button onClick={()=>setHareketForm({parca:p,tip:"cikis",adet:"1",birim_maliyet:"",dosya_id:"",aciklama:""})} disabled={Number(p.stok)<=0} style={kucukBtn("#EF4444")}>Araca tak</button>
                        <button onClick={()=>setHareketForm({parca:p,tip:"duzeltme",adet:"",birim_maliyet:"",dosya_id:"",aciklama:""})} style={kucukBtn("#F59E0B")}>Düzelt</button>
                        <button onClick={()=>setParcaForm({id:p.id,ad:p.ad,oem_no:p.oem_no||"",kategori:p.kategori||"",birim:p.birim,min_stok:String(Number(p.min_stok))})} title="Kartı düzenle" style={kucukBtn("#64748B")}>✏️</button>
                      </div>
                    </td>}
                  </tr>
                ))}
              </tbody>
            </table>
            {parcalar.length===0&&<div style={{padding:16,fontSize:12,color:"var(--text-2)"}}>Henüz parça kartı yok.{yazar&&" Sipariş verirken yeni parça yazarsanız kart otomatik açılır."}</div>}
          </div>
        </Card>
      )}

      {sekme==="siparis"&&(
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          <div style={{display:"flex",gap:6}}>{[["acik","Açık"],["tumu","Tümü"]].map(([k,l])=><button key={k} onClick={()=>setSipFiltre(k)} style={{...kucukBtn(sipFiltre===k?"#2563EB":"#64748B")}}>{l}</button>)}</div>
          {(sipFiltre==="acik"?acikSiparis:siparisler).length===0&&<div style={{fontSize:12,color:"var(--text-2)"}}>Sipariş yok.</div>}
          {(sipFiltre==="acik"?acikSiparis:siparisler).map(siparisKarti)}
        </div>
      )}

      {sekme==="hareket"&&(
        <Card style={{padding:0,overflow:"hidden"}}>
          <div style={{overflowX:"auto"}}>
            <table style={{width:"100%",borderCollapse:"collapse"}}>
              <thead><tr><th style={th}>Tarih</th><th style={th}>Tip</th><th style={th}>Parça</th><th style={{...th,textAlign:"right"}}>Adet</th><th style={th}>Araç</th><th style={th}>Açıklama</th></tr></thead>
              <tbody>{hareketler.map(h=>{const t=HAREKET_TIP[h.tip]||HAREKET_TIP.duzeltme;return(
                <tr key={h.id}>
                  <td style={{...td,whiteSpace:"nowrap",color:"var(--text-2)"}}>{mesajZamani(h.created_at)}</td>
                  <td style={td}><span style={{color:t.c,fontWeight:700}}>{t.l}</span></td>
                  <td style={td}>{h.parca_ad}</td>
                  <td style={{...td,textAlign:"right",fontWeight:700,color:t.c}}>{h.tip==="cikis"||Number(h.adet)<0?"−":"+"}{sayiMetni(Math.abs(Number(h.adet)))} {h.birim}</td>
                  <td style={{...td,color:"#7C3AED"}}>{h.plaka||"—"}</td>
                  <td style={{...td,color:"var(--text-2)"}}>{h.aciklama||""}{h.kullanici_ad&&<span style={{color:"var(--text-3)"}}> · {h.kullanici_ad}</span>}</td>
                </tr>
              );})}</tbody>
            </table>
            {hareketler.length===0&&<div style={{padding:16,fontSize:12,color:"var(--text-2)"}}>Henüz stok hareketi yok.</div>}
          </div>
        </Card>
      )}

      {sekme==="tedarikci"&&(
        <Card>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
            <ST>🏭 Tedarikçiler ({tedarikciler.length})</ST>
            {yazar&&<button onClick={()=>setTedForm({ad:"",telefon:"",email:"",vkn:"",notlar:""})} style={kucukBtn("#2563EB")}>+ Tedarikçi</button>}
          </div>
          {tedarikciler.length===0&&<div style={{fontSize:12,color:"var(--text-2)"}}>Henüz tedarikçi yok.</div>}
          {tedarikciler.map(t=>{const n=siparisler.filter(s=>s.tedarikci_id===t.id).length;return(
            <div key={t.id} style={{display:"flex",justifyContent:"space-between",gap:8,padding:"8px 0",borderTop:"1px solid var(--border)",flexWrap:"wrap",opacity:t.aktif?1:.5}}>
              <div><div style={{fontWeight:700,fontSize:13}}>{t.ad}{!t.aktif&&" (pasif)"}</div><div style={{fontSize:11,color:"var(--text-2)"}}>{[t.telefon,t.email,t.vkn&&`VKN ${t.vkn}`,t.notlar].filter(Boolean).join(" · ")||"İletişim bilgisi yok"}</div></div>
              <div style={{display:"flex",gap:6,alignItems:"center"}}>
                <span style={{fontSize:11,color:"var(--text-2)"}}>{n} sipariş</span>
                {yazar&&<button onClick={()=>calis(()=>apiCall(`/stok/tedarikciler/${t.id}`,"PATCH",{aktif:!t.aktif}))} style={kucukBtn("#64748B")}>{t.aktif?"Pasif yap":"Aktif yap"}</button>}
              </div>
            </div>
          );})}
        </Card>
      )}
    </div>
  );
}

// Dosya içinde: bu araç için sipariş edilen ve takılan parçalar
function DosyaParcalari({dosyaId}){
  const [veri,setVeri]=useState(null);
  const [hata,setHata]=useState("");
  const yukle=()=>apiCall(`/stok/dosya/${dosyaId}`).then(d=>{setVeri(d);setHata("");}).catch(e=>setHata(e.message||"Parça bilgisi alınamadı."));
  useEffect(()=>{setVeri(null);yukle();},[dosyaId]);
  if(hata)return <HataKutusu hata={hata} onTekrar={yukle}/>;
  if(!veri)return null;
  const maliyet=veri.takilan.reduce((t,h)=>t+Number(h.adet)*Number(h.ort_maliyet||0),0);
  return(
    <Card>
      <ST>🔩 Parçalar</ST>
      {veri.siparisler.length===0&&veri.takilan.length===0&&<div style={{fontSize:12,color:"var(--text-2)"}}>Bu araç için sipariş edilen veya takılan parça yok.</div>}
      {veri.siparisler.map(s=>{const sd=SIPARIS_DURUM[s.durum]||SIPARIS_DURUM.siparis;return(
        <div key={s.id} style={{padding:"7px 0",borderTop:"1px solid var(--border)",fontSize:12}}>
          <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>
            <strong>Sipariş{s.siparis_no?` ${s.siparis_no}`:""}</strong><Chip renk={sd.c} sm>{sd.l}</Chip>{s.geciken&&<Chip renk="#EF4444" sm>Gecikti</Chip>}
            <span style={{color:"var(--text-2)"}}>{s.tedarikci_ad||""}{s.tahmini_gelis&&` · tahmini ${trTarih(s.tahmini_gelis)}`}</span>
          </div>
          <div style={{color:"var(--text-2)",marginTop:2}}>{s.kalemler.map(k=>`${k.parca_ad} ${sayiMetni(k.gelen_adet)}/${sayiMetni(k.adet)}`).join(" · ")}</div>
        </div>
      );})}
      {veri.takilan.length>0&&<div style={{paddingTop:8,borderTop:"1px solid var(--border)"}}>
        <div style={{fontSize:11,fontWeight:700,color:"var(--text-2)",marginBottom:4}}>TAKILAN PARÇALAR</div>
        {veri.takilan.map(h=><div key={h.id} style={{display:"flex",justifyContent:"space-between",fontSize:12,padding:"3px 0",gap:8}}>
          <span>{h.parca_ad}{h.oem_no&&<span style={{color:"var(--text-3)"}}> · {h.oem_no}</span>} <span style={{color:"var(--text-3)"}}>({trTarihZaman(h.created_at)})</span></span>
          <span>{sayiMetni(h.adet)} {h.birim}{h.ort_maliyet!==null&&<span style={{color:"var(--text-3)",fontFamily:"var(--font-mono)"}}> · {tlBicim(Number(h.adet)*Number(h.ort_maliyet))}</span>}</span>
        </div>)}
        {maliyet>0&&<div style={{textAlign:"right",fontSize:12,fontWeight:800,marginTop:4}}>Parça maliyeti: {tlBicim(maliyet)}</div>}
      </div>}
    </Card>
  );
}

// ─── MUHASEBE İŞ AKIŞI v2 ────────────────────────────────────────────────
// Servis girer (50+ kalem desteği) → Onaya gönderir → Admin onaylar

// ─── İŞ EMİRLERİ, BÖLÜM GÖREVLERİ, PANO ─────────────────────────────────────
// Servis tek hesapla girer; görev adımını bitiren usta adıyla bildirir. Bildirilmeyen görev açık kalır.
const BOLUMLER_UI=[
  {id:"sokum",l:"Söküm",c:"#64748B"},{id:"kaporta",l:"Kaporta",c:"#4F46E5"},{id:"boya",l:"Boya",c:"#8B5CF6"},
  {id:"mekanik",l:"Mekanik",c:"#EF4444"},{id:"elektrik",l:"Elektrik",c:"#F59E0B"},{id:"montaj",l:"Montaj",c:"#10B981"},
  {id:"dis_hizmet",l:"Dış hizmet",c:"#0EA5E9"},
];
const bolumBul=(id)=>BOLUMLER_UI.find(b=>b.id===id)||{id,l:id,c:"#64748B"};
const GOREV_DURUM={bekliyor:{l:"Bekliyor",c:"#64748B"},devam:{l:"Devam ediyor",c:"#3B82F6"},beklemede:{l:"Beklemede",c:"#F59E0B"},tamam:{l:"Tamamlandı",c:"#10B981"}};
const ONAY_ROZET={taslak:{l:"Taslak",c:"#64748B"},bekliyor:{l:"Onay bekliyor",c:"#F59E0B"},onaylandi:{l:"Onaylandı",c:"#10B981"},reddedildi:{l:"Reddedildi",c:"#EF4444"}};
const ONAYLAYAN_AD={eksper:"Eksper",musteri:"Müşteri",admin:"Admin"};
const isEmriAdi=(ie)=>ie.tur==="ana"?"Ana iş emri":`Ek hasar #${ie.no-1}`;
const gunMetni=(g)=>Number(g)>0?`${g} gündür`:"bugün";
const kucukBtn=(c)=>({background:`${c}14`,border:`1px solid ${c}50`,color:c,borderRadius:7,padding:"4px 10px",fontSize:11,fontWeight:700});
const kucukInp={background:"var(--border)",border:"1px solid var(--border-hi)",borderRadius:7,color:"var(--text-1)",padding:"6px 9px",fontSize:12};
// Son kullanılan usta adı (cihaz başına, kolaylık için)
const sonUsta={al:()=>{try{return localStorage.getItem("ht_son_usta")||"";}catch(e){return "";}},yaz:(v)=>{try{localStorage.setItem("ht_son_usta",v);}catch(e){}}};

function IsEmriPaneli({dosyaId,yenileAnahtar,onDegisti}){
  const [veri,setVeri]=useState(null);
  const [hata,setHata]=useState("");
  const [islemde,setIslemde]=useState(false);
  const [yeniGorev,setYeniGorev]=useState(null); // {isEmriId,bolum,aciklama,sorumlu_usta}
  const [bitir,setBitir]=useState(null);         // {gorev,adim,usta}
  const [bekleme,setBekleme]=useState(null);     // {gorev,neden}
  const seq=useRef(0);
  const yukle=async()=>{
    const s=++seq.current;
    try{const d=await apiCall(`/is-emirleri/${dosyaId}`);if(s===seq.current){setVeri(d);setHata("");}}
    catch(e){if(s===seq.current)setHata(e.message||"İş emirleri alınamadı.");}
  };
  useEffect(()=>{yukle();},[dosyaId,yenileAnahtar]);
  const calis=async(fn)=>{
    if(islemde)return;
    setIslemde(true);setHata("");
    try{await fn();await yukle();if(onDegisti)onDegisti();return true;}
    catch(e){setHata(e.message||"İşlem başarısız.");return false;}
    finally{setIslemde(false);}
  };
  const u=(ie)=>`/is-emirleri/${dosyaId}/${ie}/gorevler`;
  const gorevEkle=()=>calis(async()=>{
    await apiCall(u(yeniGorev.isEmriId),"POST",{bolum:yeniGorev.bolum,aciklama:yeniGorev.aciklama,sorumlu_usta:yeniGorev.sorumlu_usta});
    setYeniGorev(null);
  });
  const durumYap=(g,durum,neden)=>calis(async()=>{await apiCall(`${u(g.is_emri_id)}/${g.id}`,"PATCH",{durum,bekleme_nedeni:neden});setBekleme(null);});
  const gorevSil=(g)=>{if(window.confirm(`${bolumBul(g.bolum).l} görevi silinsin mi?`))calis(()=>apiCall(`${u(g.is_emri_id)}/${g.id}`,"DELETE"));};
  const adimBitir=()=>calis(async()=>{
    const usta=bitir.usta.trim();
    if(!usta)throw new Error("İşi bitiren ustanın adını yazın");
    await apiCall(`${u(bitir.gorev.is_emri_id)}/${bitir.gorev.id}/adimlar/${bitir.adim.id}/tamamla`,"POST",{usta});
    sonUsta.yaz(usta);setBitir(null);
  });

  if(!veri)return hata?<HataKutusu hata={hata} onTekrar={yukle}/>:<Card><span style={{fontSize:12,color:"var(--text-2)",animation:"pulse .8s infinite"}}>İş emirleri yükleniyor...</span></Card>;
  const isEmirleri=veri.is_emirleri.filter(ie=>ie.durum!=="iptal");
  return(
    <div style={{display:"flex",flexDirection:"column",gap:12}}>
      {hata&&<HataKutusu hata={hata}/>}
      {isEmirleri.map(ie=>{
        const oz=ONAY_ROZET[ie.onay_durumu]||ONAY_ROZET.taslak;
        const acik=ie.gorevler.filter(g=>g.durum!=="tamam").length;
        return(
          <Card key={ie.id}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8,flexWrap:"wrap",marginBottom:10}}>
              <div>
                <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
                  <span style={{fontWeight:800,fontSize:14}}>🧾 {isEmriAdi(ie)}</span>
                  <Chip renk={oz.c} sm>{oz.l}{ie.onay_durumu==="bekliyor"?` · ${gunMetni(ie.bekleme_gun)}`:""}</Chip>
                </div>
                {ie.aciklama&&<div style={{fontSize:12,color:"var(--text-2)",marginTop:4}}>{ie.aciklama}</div>}
                <div style={{fontSize:11,color:"var(--text-3)",marginTop:3}}>{ie.gorevler.length} bölüm görevi · {acik} açık</div>
              </div>
              <button onClick={()=>setYeniGorev({isEmriId:ie.id,bolum:"kaporta",aciklama:"",sorumlu_usta:""})} style={kucukBtn("#8B5CF6")}>+ Bölüm görevi</button>
            </div>

            {yeniGorev?.isEmriId===ie.id&&(
              <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))",gap:8,padding:10,background:"rgba(139,92,246,0.05)",borderRadius:9,marginBottom:10}}>
                <select value={yeniGorev.bolum} onChange={e=>setYeniGorev(p=>({...p,bolum:e.target.value}))} style={kucukInp}>{BOLUMLER_UI.map(b=><option key={b.id} value={b.id}>{b.l}</option>)}</select>
                <input value={yeniGorev.aciklama} onChange={e=>setYeniGorev(p=>({...p,aciklama:e.target.value}))} placeholder="Yapılacak iş (örn. sağ ön çamurluk)" style={kucukInp}/>
                <input value={yeniGorev.sorumlu_usta} onChange={e=>setYeniGorev(p=>({...p,sorumlu_usta:e.target.value}))} placeholder="Sorumlu usta (isteğe bağlı)" style={kucukInp}/>
                <div style={{display:"flex",gap:6}}>
                  <button onClick={gorevEkle} disabled={islemde} style={{...kucukBtn("#8B5CF6"),background:"#8B5CF6",color:"#fff"}}>Ekle</button>
                  <button onClick={()=>setYeniGorev(null)} style={kucukBtn("#64748B")}>Vazgeç</button>
                </div>
              </div>
            )}

            {ie.gorevler.length===0&&<div style={{fontSize:12,color:"var(--text-2)"}}>Henüz bölüm görevi yok. İşi bölümlere ayırarak aracın hangi bölümde olduğunu takip edin.</div>}
            <div style={{display:"flex",flexDirection:"column",gap:8}}>
              {ie.gorevler.map(g=>{
                const b=bolumBul(g.bolum),gd=GOREV_DURUM[g.durum]||GOREV_DURUM.bekliyor;
                const biten=g.adimlar.filter(a=>a.durum==="tamam").length;
                return(
                  <div key={g.id} style={{border:`1px solid ${b.c}35`,borderLeft:`4px solid ${b.c}`,borderRadius:10,padding:"10px 12px",background:"var(--surface-2)"}}>
                    <div style={{display:"flex",justifyContent:"space-between",gap:8,flexWrap:"wrap"}}>
                      <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>
                        <span style={{fontWeight:800,fontSize:13,color:b.c}}>{b.l}</span>
                        <Chip renk={gd.c} sm>{gd.l}</Chip>
                        <span style={{fontSize:11,color:"var(--text-2)"}}>{biten}/{g.adimlar.length} adım</span>
                        {g.durum!=="tamam"&&<span style={{fontSize:11,color:Number(g.gun)>=3?"#EF4444":"var(--text-3)"}}>· {gunMetni(g.gun)}</span>}
                      </div>
                      {g.durum!=="tamam"&&(
                        <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
                          {g.durum==="bekliyor"&&<button onClick={()=>durumYap(g,"devam")} style={kucukBtn("#3B82F6")}>Başladı</button>}
                          {g.durum==="beklemede"&&<button onClick={()=>durumYap(g,"devam")} style={kucukBtn("#3B82F6")}>Devam et</button>}
                          {g.durum!=="beklemede"&&<button onClick={()=>setBekleme({gorev:g,neden:""})} style={kucukBtn("#F59E0B")}>Beklemeye al</button>}
                          {biten===0&&<button onClick={()=>gorevSil(g)} style={kucukBtn("#EF4444")}>Sil</button>}
                        </div>
                      )}
                    </div>
                    {g.aciklama&&<div style={{fontSize:12,marginTop:4}}>{g.aciklama}</div>}
                    <div style={{fontSize:11,color:"var(--text-2)",marginTop:2}}>
                      {g.sorumlu_usta&&<>👷 {g.sorumlu_usta}</>}
                      {g.durum==="tamam"&&<> · Bitiren: {g.bitiren_usta} ({trTarihZaman(g.bitis_trh)})</>}
                    </div>
                    {g.durum==="beklemede"&&g.bekleme_nedeni&&<div style={{fontSize:11,color:"#B45309",marginTop:4}}>⏸ {g.bekleme_nedeni}</div>}
                    {bekleme?.gorev.id===g.id&&(
                      <div style={{display:"flex",gap:6,marginTop:8,flexWrap:"wrap"}}>
                        <input autoFocus value={bekleme.neden} onChange={e=>setBekleme(p=>({...p,neden:e.target.value}))} placeholder="Neden bekliyor? (örn. parça bekleniyor)" style={{...kucukInp,flex:1,minWidth:180}}/>

      })}

  );
}

// ─── FOTOĞRAF VE EVRAK (depo: API, imzalı URL) ───────────────────────────────
// Çok parçalı yükleme; apiCall ile aynı oturum ve hata davranışı
async function apiYukleme(endpoint,dosya,alanlar={}){
  const token=localStorage.getItem("ht_token");
  const fd=new FormData();
  for(const [k,v] of Object.entries(alanlar))if(v!==undefined&&v!==null&&v!=="")fd.append(k,v);
  fd.append("dosya",dosya,dosya.name||"dosya");
  let res;
  try{res=await fetch(`${API_URL}${endpoint}`,{method:"POST",headers:token?{Authorization:`Bearer ${token}`}:{},body:fd});}
  catch(e){const err=new Error("Sunucuya ulaşılamadı");err.status=0;throw err;}
  if(!res.ok){
    const j=await res.json().catch(()=>({}));
    const err=new Error(j.error||(res.status===413?"Dosya çok büyük (en fazla 4 MB)":`HTTP ${res.status}`));err.status=res.status;
    if(res.status===401&&token){localStorage.removeItem("ht_token");window.dispatchEvent(new Event("ht-oturum-bitti"));}
    throw err;
  }
  return res.json();
}
// Fotoğrafı yüklemeden önce küçültür (uzun kenar 1600 px, JPEG). Desteklenmezse olduğu gibi döner.
async function gorselKucult(f,maks=1600,kalite=0.82){
  if(!/^image\/(jpeg|png|webp)$/.test(f.type))return f;
  try{
    const bmp=await createImageBitmap(f);
    const o=Math.min(1,maks/Math.max(bmp.width,bmp.height));
    if(o===1&&f.size<1.5*1048576)return f;
    const c=document.createElement("canvas");c.width=Math.round(bmp.width*o);c.height=Math.round(bmp.height*o);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    const b=await new Promise(r=>c.toBlob(r,"image/jpeg",kalite));
    return b?new File([b],f.name.replace(/\.[^.]+$/,"")+".jpg",{type:"image/jpeg"}):f;
  }catch(e){return f;}
}
const boyutMetni=(b)=>b?(b>=1048576?`${(b/1048576).toFixed(1)} MB`:`${Math.max(1,Math.round(b/1024))} KB`):"";
function esleFoto(f){
  return {id:f.id,url:f.url,etiket:f.etiket||f.dosya_adi||"Fotoğraf",kategori:f.kategori||"kaza",tarih:trTarihZaman(f.created_at),
    yukleyen:f.yukleyen_ad||(f.yukleyen_rol==="servis"?"Servis":"Admin"),boyut:boyutMetni(f.boyut_byte),isEmriId:f.is_emri_id||null};
}
function esleEvrak(e){
  return {id:e.id,ad:e.ad,kaynak:e.kaynak||"Admin",durum:e.durum,tarih:trTarihZaman(e.teslim_trh),uyari:e.uyari_not||"",
    url:e.url,dosyaAdi:e.dosya_adi||"",boyut:boyutMetni(e.boyut_byte),yukleyen:e.yukleyen_ad||"",pdf:e.mime_tipi==="application/pdf"};
}

function FotoGaleri({dosyaId,rol,onListe}){
  const [fotolar,setFotolar]=useState(null);

  const [kat,setKat]=useState("tumu");

  const [etiket,setEtiket]=useState(null); // {id,metin}
  const girdi=useRef();
  const yukle=async()=>{
    try{const l=(await apiCall(`/fotograflar/${dosyaId}`)).fotograflar.map(esleFoto);setFotolar(l);setHata("");if(onListe)onListe(l);}
    catch(e){setHata(e.message||"Fotoğraflar alınamadı.");}
  };
  useEffect(()=>{setFotolar(null);yukle();},[dosyaId]);
  const dosyalariYukle=async(liste)=>{
    const gorseller=Array.from(liste||[]).filter(f=>f.type.startsWith("image/"));
    if(!gorseller.length){setHata("Yalnız fotoğraf yüklenebilir (JPG, PNG, WEBP).");return;}
    setHata("");setYukleniyor(gorseller.length);
    const hatalar=[];
    for(const f of gorseller){
      try{await apiYukleme(`/fotograflar/${dosyaId}`,await gorselKucult(f),{kategori:kat!=="tumu"?kat:undefined});}
      catch(e){hatalar.push(`${f.name}: ${e.message}`);}
      setYukleniyor(n=>n-1);
    }
    if(hatalar.length)setHata(hatalar.join(" · "));
    await yukle();
  };
  const guncelle=async(id,alanlar)=>{try{await apiCall(`/fotograflar/${dosyaId}/${id}`,"PATCH",alanlar);setEtiket(null);await yukle();}catch(e){setHata(e.message);}};
  const sil=async(f)=>{if(!window.confirm(`"${f.etiket}" silinsin mi?`))return;try{await apiCall(`/fotograflar/${dosyaId}/${f.id}`,"DELETE");if(lightbox?.id===f.id)setLightbox(null);await yukle();}catch(e){setHata(e.message);}};

        <input ref={girdi} type="file" accept="image/*" multiple onChange={e=>{dosyalariYukle(e.target.files);e.target.value="";}} style={{display:"none"}}/>
        <div style={{fontSize:32,marginBottom:6}}>📷</div>
        <div style={{fontWeight:700,fontSize:13,color:"#8B5CF6"}}>{yukleniyor?`${yukleniyor} fotoğraf yükleniyor...`:rol==="servis"?"Onarım fotoğrafı yükle":"Fotoğraf yükle"}</div>
        <div style={{fontSize:11,color:"var(--text-2)",marginTop:3}}>Sürükleyin veya tıklayın · JPG, PNG, WEBP · {kat!=="tumu"?`"${KATEGORILER.find(k=>k.id===kat)?.label}" kategorisine`:"varsayılan kategoriye"} eklenir</div>
      </div>
      {hata&&<HataKutusu hata={hata} onTekrar={fotolar?undefined:yukle}/>}
      <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
        {KATEGORILER.map(k=>{const n=k.id==="tumu"?(fotolar||[]).length:(fotolar||[]).filter(f=>f.kategori===k.id).length;return(
          <button key={k.id} onClick={()=>setKat(k.id)} style={{padding:"5px 11px",borderRadius:7,fontSize:11,fontWeight:700,border:`1px solid ${kat===k.id?"rgba(59,130,246,0.45)":"var(--border-md)"}`,background:kat===k.id?"rgba(59,130,246,0.12)":"transparent",color:kat===k.id?"#2563EB":"var(--text-2)"}}>{k.ikon} {k.label} ({n})</button>
        );})}
      </div>
      {!fotolar?<div style={{fontSize:12,color:"var(--text-2)"}}><span style={{animation:"pulse .8s infinite"}}>Fotoğraflar yükleniyor...</span></div>
      :liste.length===0?<div style={{fontSize:12,color:"var(--text-2)",textAlign:"center",padding:20}}>Bu kategoride fotoğraf yok.</div>
      :<div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(170px,1fr))",gap:12}}>
        {liste.map(f=>(
          <div key={f.id} className="photo-card" style={{background:"var(--surface-2)",border:"1px solid var(--border)",borderRadius:10,overflow:"hidden"}}>
            {f.url?<img src={f.url} alt={f.etiket} loading="lazy" onClick={()=>setLightbox(f)} style={{width:"100%",aspectRatio:"4/3",objectFit:"cover",display:"block",cursor:"pointer",background:"var(--border)"}}/>
              :<div style={{aspectRatio:"4/3",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,color:"var(--text-3)"}}>Görsel alınamadı</div>}
            <div style={{padding:"8px 9px"}}>
              {etiket?.id===f.id
                ?<div style={{display:"flex",gap:4}}><input autoFocus value={etiket.metin} onChange={e=>setEtiket(p=>({...p,metin:e.target.value}))} onKeyDown={e=>e.key==="Enter"&&guncelle(f.id,{etiket:etiket.metin})} style={{...kucukInp,flex:1,minWidth:0,padding:"3px 6px"}}/><button onClick={()=>guncelle(f.id,{etiket:etiket.metin})} style={kucukBtn("#10B981")}>✓</button></div>

              <div style={{fontSize:10,color:"var(--text-2)",marginTop:2}}>{f.tarih} · {f.yukleyen}{f.boyut&&` · ${f.boyut}`}</div>
