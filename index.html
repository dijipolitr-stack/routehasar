function EvrakListesi({dosyaId,rol,onListe}){
  const [evrak,setEvrak]=useState(null);
  const [hata,setHata]=useState("");
  const [yuklenen,setYuklenen]=useState(null); // evrak id
  const [hedef,setHedef]=useState(null);
  const [eksikNot,setEksikNot]=useState(null); // {id,metin}
  const [yeni,setYeni]=useState(null);          // {ad,kaynak}
  const girdi=useRef();
  const yukle=async()=>{
    try{const l=(await apiCall(`/evrak/${dosyaId}`)).evrak.map(esleEvrak);setEvrak(l);setHata("");if(onListe)onListe(l);}
    catch(e){setHata(e.message||"Evrak alınamadı.");}
  };
  useEffect(()=>{setEvrak(null);yukle();},[dosyaId]);
  const sec=(id)=>{setHedef(id);setTimeout(()=>girdi.current?.click(),0);};
  const dosyaSecildi=async(f)=>{
    if(!f||!hedef)return;
    setYuklenen(hedef);setHata("");
    try{await apiYukleme(`/evrak/${dosyaId}/${hedef}/yukle`,await gorselKucult(f,2000,0.85));await yukle();}
    catch(e){setHata(`${f.name}: ${e.message}`);}
    finally{setYuklenen(null);setHedef(null);}
  };
  const guncelle=async(id,alanlar)=>{try{await apiCall(`/evrak/${dosyaId}/${id}`,"PATCH",alanlar);setEksikNot(null);await yukle();}catch(e){setHata(e.message);}};
  const ekle=async()=>{try{await apiCall(`/evrak/${dosyaId}`,"POST",yeni);setYeni(null);await yukle();}catch(e){setHata(e.message);}};
  const sil=async(e)=>{if(!window.confirm(`"${e.ad}" listeden silinsin mi?`))return;try{await apiCall(`/evrak/${dosyaId}/${e.id}`,"DELETE");await yukle();}catch(x){setHata(x.message);}};

  if(!evrak)return hata?<HataKutusu hata={hata} onTekrar={yukle}/>:<div style={{fontSize:12,color:"var(--text-2)"}}><span style={{animation:"pulse .8s infinite"}}>Evrak yükleniyor...</span></div>;
  const say=(d)=>evrak.filter(e=>e.durum===d).length;
  return(
    <div style={{display:"flex",flexDirection:"column",gap:12}}>
      <input ref={girdi} type="file" accept=".pdf,image/jpeg,image/png,image/webp" onChange={e=>{dosyaSecildi(e.target.files[0]);e.target.value="";}} style={{display:"none"}}/>
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8}}>
        {[{l:"Teslim",v:say("tamam"),c:"#10B981"},{l:"Eksik",v:say("eksik"),c:"#EF4444"},{l:"Bekliyor",v:say("bekliyor"),c:"#64748B"}].map(k=>(
          <Card key={k.l} style={{textAlign:"center",padding:12}}><div style={{fontSize:20,fontWeight:800,color:k.c}}>{k.v}</div><div style={{fontSize:10,color:"var(--text-2)",marginTop:2}}>{k.l}</div></Card>
        ))}

      {hata&&<HataKutusu hata={hata}/>}

            <div style={{flex:1,minWidth:160}}>
              <div style={{fontWeight:700,fontSize:13}}>{e.ad}</div>
              <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap",marginTop:3}}>

                <Chip renk={s.renk} sm>{s.label}</Chip>
                {e.tarih&&<span style={{fontSize:10,color:"var(--text-2)"}}>{e.tarih}</span>}
                {e.url&&<a href={e.url} target="_blank" rel="noopener" style={{fontSize:11,fontWeight:700,color:"#2563EB"}}>{e.pdf?"📄":"🖼️"} {e.dosyaAdi||"Görüntüle"}{e.boyut&&` (${e.boyut})`}</a>}
              </div>
              {e.uyari&&<div style={{fontSize:11,color:"#B45309",marginTop:4}}>⚠ {e.uyari}</div>}
            </div>
            <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
              <button onClick={()=>sec(e.id)} disabled={!!yuklenen} style={kucukBtn("#8B5CF6")}>{yuklenen===e.id?"Yükleniyor...":e.url?"Değiştir":"Yükle"}</button>
              {e.durum!=="eksik"&&<button onClick={()=>setEksikNot({id:e.id,metin:e.uyari})} style={kucukBtn("#EF4444")}>Eksik</button>}
              {e.durum!=="tamam"&&e.url&&<button onClick={()=>guncelle(e.id,{durum:"tamam",uyari_not:null})} style={kucukBtn("#10B981")}>Teslim</button>}
              {rol==="admin"&&<button onClick={()=>sil(e)} title="Listeden sil" style={kucukBtn("#64748B")}>×</button>}
            </div>
          </div>
          {eksikNot?.id===e.id&&(
            <div style={{display:"flex",gap:6,marginTop:8,flexWrap:"wrap"}}>

              <button onClick={()=>guncelle(e.id,{durum:"eksik",uyari_not:eksikNot.metin})} style={kucukBtn("#EF4444")}>Kaydet</button>
              <button onClick={()=>setEksikNot(null)} style={kucukBtn("#64748B")}>Vazgeç</button>
            </div>
          )}
        </div>
      );})}
      {yeni?(
        <div style={{display:"flex",gap:6,flexWrap:"wrap",padding:10,background:"rgba(139,92,246,0.05)",borderRadius:9}}>
          <input autoFocus value={yeni.ad} onChange={e=>setYeni(p=>({...p,ad:e.target.value}))} placeholder="Evrak adı (örn. Çekici faturası)" style={{...kucukInp,flex:2,minWidth:180}}/>
          <select value={yeni.kaynak} onChange={e=>setYeni(p=>({...p,kaynak:e.target.value}))} style={kucukInp}>
            {["Araç Sahibi","Sigorta Şirketi","Eksper","Servis","Admin"].map(k=><option key={k}>{k}</option>)}
          </select>
          <button onClick={ekle} style={kucukBtn("#8B5CF6")}>Ekle</button>
          <button onClick={()=>setYeni(null)} style={kucukBtn("#64748B")}>Vazgeç</button>
        </div>
      ):<button onClick={()=>setYeni({ad:"",kaynak:rol==="servis"?"Servis":"Admin"})} style={{...kucukBtn("#8B5CF6"),alignSelf:"flex-start"}}>+ Evrak ekle</button>}
    </div>
  );
}

// ─── MESAJLAR (dosya bazında admin ↔ servis) ────────────────────────────────
const MESAJ_SABLON={
  admin:["Proforma ve fotoğraflı hasar formunu iletir misiniz?","Onarım fotoğraflarını yükler misiniz?","Tahmini teslim tarihi nedir?"],
  servis:["Onay durumu hakkında bilgi alabilir miyim?","Parça gecikmesi var, teslim tarihi kayacak.","Ek hasar bildirdim, onayınızı bekliyorum."],
};
const mesajZamani=(ts)=>{const d=new Date(ts);return Number.isNaN(d.getTime())?"":d.toLocaleString("tr-TR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});};
// Açıkken 20 sn'de bir yenilenir; açılınca karşı tarafın mesajları okundu olur (onOkundu ile rozet tazelenir)
function MesajPaneli({dosyaId,rol,taslak,onOkundu}){
  const [mesajlar,setMesajlar]=useState(null);
  const [metin,setMetin]=useState(taslak||"");
  const [hata,setHata]=useState("");
  const [gonderiliyor,setGonderiliyor]=useState(false);
  const liste=useRef();
  const yukle=async()=>{
    try{const d=await apiCall(`/mesajlar/${dosyaId}`);setMesajlar(d.mesajlar);setHata("");if(onOkundu)onOkundu();}
    catch(e){setHata(e.message||"Mesajlar alınamadı.");}
  };
  useEffect(()=>{setMesajlar(null);yukle();const t=setInterval(yukle,20000);return()=>clearInterval(t);},[dosyaId]);
  useEffect(()=>{if(taslak)setMetin(taslak);},[taslak]);
  useEffect(()=>{if(liste.current)liste.current.scrollTop=liste.current.scrollHeight;},[mesajlar?.length]);
  const gonder=async()=>{
    const m=metin.trim();if(!m||gonderiliyor)return;
    setGonderiliyor(true);setHata("");
    try{await apiCall(`/mesajlar/${dosyaId}`,"POST",{mesaj:m});setMetin("");await yukle();}
    catch(e){setHata(e.message||"Mesaj gönderilemedi.");}
    finally{setGonderiliyor(false);}
  };
  const karsi=rol==="admin"?"Servis":"Hasar Admin";
  return(
    <Card style={{display:"flex",flexDirection:"column",padding:0,overflow:"hidden"}}>
      <div style={{padding:"12px 16px",borderBottom:"1px solid var(--border)",fontWeight:700,fontSize:13}}>💬 {karsi} ile yazışma</div>
      <div ref={liste} style={{overflow:"auto",padding:"14px 16px",display:"flex",flexDirection:"column",gap:10,maxHeight:380,minHeight:120}}>
        {!mesajlar&&!hata&&<div style={{fontSize:12,color:"var(--text-2)"}}><span style={{animation:"pulse .8s infinite"}}>Mesajlar yükleniyor...</span></div>}
        {mesajlar&&mesajlar.length===0&&<div style={{fontSize:12,color:"var(--text-2)",textAlign:"center",padding:16}}>Henüz mesaj yok. {karsi} tarafına bu dosyayla ilgili yazabilirsiniz.</div>}
        {(mesajlar||[]).map(m=>{const ben=m.gonderen_rol===rol;const renk=m.gonderen_rol==="admin"?"#4F46E5":"#8B5CF6";return(
          <div key={m.id} style={{display:"flex",flexDirection:"column",alignItems:ben?"flex-end":"flex-start"}}>
            <div style={{fontSize:10,color:"var(--text-2)",marginBottom:3}}>
              <span style={{fontWeight:700,color:renk}}>{m.gonderen_rol==="admin"?"🛡️ Admin":"🔧 Servis"}</span>{m.gonderen_ad&&` · ${m.gonderen_ad}`} · {mesajZamani(m.created_at)}{ben&&m.okundu&&" · ✓ okundu"}
            </div>
            <div style={{maxWidth:"82%",padding:"9px 12px",borderRadius:10,background:ben?`${renk}1f`:"var(--surface-2)",border:`1px solid ${ben?`${renk}40`:"var(--border)"}`,fontSize:13,lineHeight:1.5,whiteSpace:"pre-wrap",wordBreak:"break-word"}}>{m.mesaj}</div>
          </div>
        );})}
      </div>
      <div style={{padding:"10px 16px",borderTop:"1px solid var(--border)"}}>
        {hata&&<div style={{marginBottom:8}}><HataKutusu hata={hata}/></div>}
        <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:8}}>
          {(MESAJ_SABLON[rol]||[]).map(t=><button key={t} onClick={()=>setMetin(t)} style={{padding:"4px 9px",borderRadius:6,border:"1px solid var(--border-md)",background:"transparent",color:"var(--text-2)",fontSize:10,fontWeight:600}}>{t}</button>)}
        </div>
        <div style={{display:"flex",gap:8}}>
          <textarea value={metin} onChange={e=>setMetin(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();gonder();}}} rows={2} maxLength={2000} placeholder={`${karsi} tarafına mesaj... (Enter gönderir, Shift+Enter yeni satır)`} style={{flex:1,background:"var(--border)",border:"1px solid var(--border-md)",borderRadius:8,color:"var(--text-1)",padding:"8px 10px",fontSize:12,resize:"vertical"}}/>
          <button onClick={gonder} disabled={gonderiliyor||!metin.trim()} style={{background:metin.trim()?"#4F46E5":"rgba(79,70,229,0.35)",border:"none",color:"#fff",borderRadius:8,padding:"0 16px",fontSize:13,fontWeight:700,flexShrink:0}}>{gonderiliyor?"...":"Gönder"}</button>
        </div>
      </div>
    </Card>
  );
}
// Okunmamış mesaj rozeti
const MesajRozet=({n})=>n>0?<span title={`${n} okunmamış mesaj`} style={{display:"inline-flex",alignItems:"center",gap:3,padding:"2px 7px",borderRadius:10,background:"#EF4444",color:"#fff",fontSize:10,fontWeight:800}}>💬 {n}</span>:null;

// ─── FATURALAR (servis faturaları + dış hizmet faturaları) ─────────────────
// Tutarlar KDV hariç girilir; KDV ve toplamı API hesaplar. Servis ve admin aynı ekranı kullanır.
const TARAFLAR=[{id:"sigorta",l:"Sigorta",c:"#3B82F6"},{id:"musteri",l:"Müşteri",c:"#F59E0B"},{id:"acente",l:"Acente",c:"#8B5CF6"},{id:"diger",l:"Diğer",c:"#64748B"}];
const tarafBul=(id)=>TARAFLAR.find(t=>t.id===id)||TARAFLAR[3];
const KDV_ORANLARI=[20,10,1,0];
const ODEME_DURUM={bekliyor:{l:"Ödeme bekliyor",c:"#F59E0B"},kismi:{l:"Kısmi ödendi",c:"#3B82F6"},odendi:{l:"Ödendi",c:"#10B981"}};
const BOS_SERVIS_FATURA={alici_tipi:"sigorta",alici_ad:"",alici_vkn:"",fatura_no:"",fatura_trh:"",tutar:"",kdv_orani:20,odenen_tutar:"",odeme_trh:"",notlar:""};
const BOS_DIS_FATURA={firma:"",firma_vkn:"",hizmet:"",is_emri_id:"",islem_id:"",fatura_no:"",fatura_trh:"",tutar:"",kdv_orani:20,yansitildi:false,notlar:""};

// API satırı -> form (TL ve GG.AA.YYYY metni)
function faturaFormu(tur,f){
  const b=tur==="servis"?BOS_SERVIS_FATURA:BOS_DIS_FATURA;
  const o={};
  for(const k of Object.keys(b)){
    const v=f[k];
    if(k==="fatura_trh"||k==="odeme_trh")o[k]=trTarih(v);
    else if(k==="tutar"||k==="odenen_tutar")o[k]=v===null||v===undefined?"":tlBicim(v);
    else if(k==="kdv_orani")o[k]=Number(v);
    else if(k==="yansitildi")o[k]=!!v;
    else o[k]=bos(v);
  }
  return o;
}
// form -> API gövdesi. Dönüşüm hatası istek atılmadan fırlatılır.
function faturaGovdesi(tur,f){
  const g={...f,fatura_trh:isoTarih(f.fatura_trh),tutar:tlSayi(f.tutar),kdv_orani:Number(f.kdv_orani)};
  if(g.tutar===null)throw new Error("Tutar (KDV hariç) zorunlu");
  if(tur==="servis"){g.odeme_trh=isoTarih(f.odeme_trh);g.odenen_tutar=tlSayi(f.odenen_tutar)||0;}
  else{g.islem_id=f.islem_id||null;g.is_emri_id=f.is_emri_id||null;}
  return g;
}

function FaturaPaneli({dosyaId,dosya,kalemler,isEmirleri,yenileAnahtar,onOzet}){
  const [veri,setVeri]=useState(null);
  const [hata,setHata]=useState("");
  const [form,setForm]=useState(null); // {tur, id|null, alanlar}
  const [formHata,setFormHata]=useState("");
  const [kaydediliyor,setKaydediliyor]=useState(false);
  const seq=useRef(0);
  const yukle=async()=>{
    const s=++seq.current;setHata("");
    try{const d=await apiCall(`/faturalar/${dosyaId}`);if(s!==seq.current)return;setVeri(d);if(onOzet)onOzet(d);}
    catch(e){if(s===seq.current)setHata(e.message||"Faturalar alınamadı.");}
  };
  useEffect(()=>{yukle();},[dosyaId,yenileAnahtar]);

  const formAc=(tur,f,ilk)=>{setFormHata("");setForm({tur,id:f?.id||null,alanlar:f?faturaFormu(tur,f):{...(tur==="servis"?BOS_SERVIS_FATURA:BOS_DIS_FATURA),...ilk}});};
  // Kalan payı olan taraf için alıcı bilgisi dosyadan önerilir
  const payIcinFatura=(taraf,tutar)=>{
    const ilk={alici_tipi:taraf,tutar:tlBicim(tutar)};
    if(taraf==="sigorta")ilk.alici_ad=dosya?.sigortaSirketi?.ad||"";
    if(taraf==="musteri"){ilk.alici_ad=dosya?.sahip?.ad||"";const tc=bos(dosya?.sahip?.tc).trim();if(/^\d{10,11}$/.test(tc))ilk.alici_vkn=tc;}
    formAc("servis",null,ilk);
  };
  const alanAyarla=(k,v)=>setForm(p=>({...p,alanlar:{...p.alanlar,[k]:v}}));
  const kaydet=async()=>{
    if(kaydediliyor)return;
    setFormHata("");
    let govde;
    try{govde=faturaGovdesi(form.tur,form.alanlar);}catch(e){setFormHata(e.message);return;}
    setKaydediliyor(true);
    try{
      const u=`/faturalar/${dosyaId}/${form.tur}`;
      if(form.id)await apiCall(`${u}/${form.id}`,"PATCH",govde);else await apiCall(u,"POST",govde);
      setForm(null);await yukle();
    }catch(e){setFormHata(e.message||"Kaydedilemedi.");}
    finally{setKaydediliyor(false);}
  };
  const sil=async(tur,f)=>{
    const ad=tur==="servis"?`${f.alici_ad} faturası`:`${f.firma} faturası`;
    if(!window.confirm(`${ad} silinsin mi?`))return;
    try{await apiCall(`/faturalar/${dosyaId}/${tur}/${f.id}`,"DELETE");if(form?.id===f.id)setForm(null);await yukle();}
    catch(e){setHata(e.message||"Silinemedi.");}
  };

  if(!veri)return hata?<HataKutusu hata={hata} onTekrar={yukle}/>:<Card><span style={{fontSize:12,color:"var(--text-2)",animation:"pulse .8s infinite"}}>Faturalar yükleniyor...</span></Card>;
  const {ozet}=veri;
  const inp={background:"var(--border)",border:"1px solid var(--border-hi)",borderRadius:7,color:"var(--text-1)",padding:"7px 10px",fontSize:12,width:"100%"};
  const lbl={fontSize:10,color:"var(--text-2)",fontWeight:600,marginBottom:4};
  const btn=(c)=>({background:`${c}1a`,border:`1px solid ${c}55`,color:c,borderRadius:7,padding:"5px 11px",fontSize:11,fontWeight:700});
  // Bileşen değil fonksiyon olarak çağrılır; böylece yazarken input odağı kaybolmaz
  const alan=(k,l,{ph,genis,tip}={})=>{
    const v=form.alanlar[k];
    return <div key={k} style={{gridColumn:genis?"1 / -1":undefined}}>
      <div style={lbl}>{l}</div>
      {tip==="taraf"?<select value={v} onChange={e=>alanAyarla(k,e.target.value)} style={inp}>{TARAFLAR.map(t=><option key={t.id} value={t.id}>{t.l}</option>)}</select>
      :tip==="kdv"?<select value={v} onChange={e=>alanAyarla(k,Number(e.target.value))} style={inp}>{KDV_ORANLARI.map(o=><option key={o} value={o}>%{o}</option>)}</select>
      :tip==="isemri"?<select value={v} onChange={e=>alanAyarla(k,e.target.value)} style={inp}><option value="">Ana iş emri</option>{(isEmirleri||[]).filter(x=>x.tur!=="ana").map(x=><option key={x.id} value={x.id}>{isEmriAdi(x)}</option>)}</select>
      :tip==="kalem"?<select value={v} onChange={e=>alanAyarla(k,e.target.value)} style={inp}><option value="">Bağlı değil</option>{(kalemler||[]).map(i=><option key={i.id} value={i.id}>{i.kategori}: {i.aciklama}</option>)}</select>
      :tip==="onay"?<label style={{display:"flex",gap:8,alignItems:"center",fontSize:12,color:"var(--text-1)",paddingTop:6}}><input type="checkbox" checked={!!v} onChange={e=>alanAyarla(k,e.target.checked)}/> Servis faturasına yansıtıldı</label>
      :<input value={v} onChange={e=>alanAyarla(k,e.target.value)} placeholder={ph||""} style={inp}/>}
    </div>;
  };
  const kdvMetni=(f)=>`KDV %${Number(f.kdv_orani)}: ${tlBicim(f.kdv_tutar)} · Toplam ${tlBicim(f.toplam)}`;
  const gorunenTaraflar=TARAFLAR.filter(t=>ozet.pay[t.id]||ozet.faturalanan[t.id]);

  return(
    <div style={{display:"flex",flexDirection:"column",gap:14}}>
      {hata&&<HataKutusu hata={hata} onTekrar={yukle}/>}

      {/* Pay özeti: kim ne kadar ödeyecek, ne kadarı faturalandı */}
      <Card>
        <ST>🧾 Fatura Payları (KDV hariç)</ST>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))",gap:10}}>
          {gorunenTaraflar.map(t=>{
            const kalan=ozet.kalan[t.id];
            return <div key={t.id} style={{border:"1px solid var(--border)",borderRadius:10,padding:"10px 12px",background:"var(--surface-2)"}}>
              <div style={{fontSize:10,fontWeight:700,color:t.c,marginBottom:6}}>{t.l.toLocaleUpperCase("tr-TR")} PAYI</div>
              <div style={{fontSize:16,fontWeight:800,fontFamily:"var(--font-mono)"}}>{tlBicim(ozet.pay[t.id])}</div>
              <div style={{fontSize:11,color:"var(--text-2)",marginTop:4}}>Faturalanan: {tlBicim(ozet.faturalanan[t.id])}</div>
              {kalan>0?<button onClick={()=>payIcinFatura(t.id,kalan)} style={{...btn(t.c),marginTop:8,width:"100%"}}>+ {tlBicim(kalan)} için fatura</button>
              :kalan<0?<div style={{fontSize:11,color:"#EF4444",marginTop:6}}>Paydan {tlBicim(-kalan)} fazla faturalandı</div>
              :<div style={{fontSize:11,color:"#10B981",marginTop:6}}>✓ Tamamı faturalandı</div>}
            </div>;
          })}
          {gorunenTaraflar.length===0&&<div style={{fontSize:12,color:"var(--text-2)"}}>Henüz kalem yok. Kalemlerdeki "Ödeyen" alanına göre paylar burada hesaplanır.</div>}
        </div>
        {ozet.muafiyet>0&&<div style={{fontSize:11,color:"var(--text-2)",marginTop:10}}>Muafiyet {tlBicim(ozet.muafiyet)} sigorta payından düşülüp müşteri payına eklendi.</div>}
      </Card>

      {/* Servis faturaları */}
      <Card>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12,gap:8,flexWrap:"wrap"}}>
          <ST>📄 Servis Faturaları ({veri.servis_faturalari.length})</ST>
          <button onClick={()=>formAc("servis")} style={btn("#8B5CF6")}>+ Fatura</button>
        </div>
        {veri.servis_faturalari.length===0&&<div style={{fontSize:12,color:"var(--text-2)"}}>Henüz servis faturası girilmedi.</div>}
        {veri.servis_faturalari.map(f=>{const t=tarafBul(f.alici_tipi),od=ODEME_DURUM[f.odeme_durumu]||ODEME_DURUM.bekliyor;return(
          <div key={f.id} style={{padding:"10px 0",borderTop:"1px solid var(--border)",display:"flex",gap:10,alignItems:"flex-start",flexWrap:"wrap"}}>
            <div style={{flex:1,minWidth:180}}>
              <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>
                <Chip renk={t.c} sm>{t.l}</Chip>
                <span style={{fontWeight:700,fontSize:13}}>{f.alici_ad}</span>
                <span style={{fontSize:10,fontWeight:700,color:od.c}}>{od.l}</span>
              </div>
              <div style={{fontSize:11,color:"var(--text-2)",marginTop:4}}>{[f.fatura_no&&`No ${f.fatura_no}`,trTarih(f.fatura_trh),f.alici_vkn&&`VKN/TCKN ${f.alici_vkn}`].filter(Boolean).join(" · ")||"Fatura no ve tarih girilmedi"}</div>
              <div style={{fontSize:11,color:"var(--text-2)",marginTop:2}}>{kdvMetni(f)}{Number(f.odenen_tutar)>0&&` · Ödenen ${tlBicim(f.odenen_tutar)}${f.odeme_trh?` (${trTarih(f.odeme_trh)})`:""}`}</div>
              {f.notlar&&<div style={{fontSize:11,color:"var(--text-2)",marginTop:2}}>📝 {f.notlar}</div>}
            </div>
            <div style={{textAlign:"right"}}>
              <div style={{fontWeight:800,fontFamily:"var(--font-mono)",fontSize:14}}>{tlBicim(f.tutar)}</div>
              <div style={{display:"flex",gap:4,marginTop:6,justifyContent:"flex-end"}}>
                <button onClick={()=>formAc("servis",f)} style={btn("#64748B")}>Düzenle</button>
                <button onClick={()=>sil("servis",f)} style={btn("#EF4444")}>Sil</button>
              </div>
            </div>
          </div>
        );})}
      </Card>

      {/* Dış hizmet faturaları */}
      <Card>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12,gap:8,flexWrap:"wrap"}}>
          <ST>🔗 Dış Hizmet Faturaları ({veri.dis_faturalar.length}) · {tlBicim(ozet.dis_toplam)}</ST>
          <button onClick={()=>formAc("dis")} style={btn("#10B981")}>+ Dış Fatura</button>
        </div>
        {veri.dis_faturalar.length===0&&<div style={{fontSize:12,color:"var(--text-2)"}}>Cam, döşeme, rot-balans gibi dışarıdan alınan hizmetlerin faturaları burada tutulur.</div>}
        {veri.dis_faturalar.map(f=>{const k=(kalemler||[]).find(i=>i.id===f.islem_id);const fie=(isEmirleri||[]).find(x=>x.id===f.is_emri_id);return(
          <div key={f.id} style={{padding:"10px 0",borderTop:"1px solid var(--border)",display:"flex",gap:10,alignItems:"flex-start",flexWrap:"wrap"}}>
            <div style={{flex:1,minWidth:180}}>
              <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>
                <span style={{fontWeight:700,fontSize:13}}>{f.firma}</span>
                <span style={{fontSize:12,color:"var(--text-2)"}}>{f.hizmet}</span>
                <span style={{fontSize:10,fontWeight:700,color:f.yansitildi?"#10B981":"var(--text-3)"}}>{f.yansitildi?"✓ Faturaya yansıtıldı":"Yansıtılmadı"}</span>
              </div>
              <div style={{fontSize:11,color:"var(--text-2)",marginTop:4}}>{[f.fatura_no&&`No ${f.fatura_no}`,trTarih(f.fatura_trh),f.firma_vkn&&`VKN ${f.firma_vkn}`,fie&&fie.tur!=="ana"&&isEmriAdi(fie),k&&`Kalem: ${k.aciklama}`].filter(Boolean).join(" · ")||"Fatura no ve tarih girilmedi"}</div>
              <div style={{fontSize:11,color:"var(--text-2)",marginTop:2}}>{kdvMetni(f)}</div>
              {f.notlar&&<div style={{fontSize:11,color:"var(--text-2)",marginTop:2}}>📝 {f.notlar}</div>}
            </div>
            <div style={{textAlign:"right"}}>
              <div style={{fontWeight:800,fontFamily:"var(--font-mono)",fontSize:14}}>{tlBicim(f.tutar)}</div>
              <div style={{display:"flex",gap:4,marginTop:6,justifyContent:"flex-end"}}>
                <button onClick={()=>formAc("dis",f)} style={btn("#64748B")}>Düzenle</button>
                <button onClick={()=>sil("dis",f)} style={btn("#EF4444")}>Sil</button>
              </div>
            </div>
          </div>
        );})}
      </Card>

      {/* Fatura formu (ekle / düzenle) */}
      {form&&(
        <Card style={{border:"1.5px solid rgba(139,92,246,0.35)"}}>
          <ST>{form.id?"Faturayı düzenle":form.tur==="servis"?"Yeni servis faturası":"Yeni dış hizmet faturası"}</ST>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(170px,1fr))",gap:10}}>
            {form.tur==="servis"?[
              alan("alici_tipi","ALICI",{tip:"taraf"}),
              alan("alici_ad","ALICI ADI / ÜNVANI",{ph:"Örn. Anadolu Sigorta"}),
              alan("alici_vkn","VKN / TCKN",{ph:"10 veya 11 hane"}),
              alan("fatura_no","FATURA NO"),
              alan("fatura_trh","FATURA TARİHİ",{ph:"GG.AA.YYYY"}),
              alan("tutar","TUTAR (KDV HARİÇ) ₺",{ph:"0"}),
              alan("kdv_orani","KDV",{tip:"kdv"}),
              alan("odenen_tutar","ÖDENEN (KDV DAHİL) ₺",{ph:"0"}),
              alan("odeme_trh","ÖDEME TARİHİ",{ph:"GG.AA.YYYY"}),
              alan("notlar","NOT",{genis:true}),
            ]:[
              alan("firma","FİRMA",{ph:"Örn. Cam Usta Ltd."}),
              alan("firma_vkn","FİRMA VKN",{ph:"10 veya 11 hane"}),
              alan("hizmet","HİZMET",{ph:"Örn. Ön cam değişimi"}),
              alan("is_emri_id","İŞ EMRİ",{tip:"isemri"}),
              alan("islem_id","BAĞLI KALEM",{tip:"kalem"}),
              alan("fatura_no","FATURA NO"),
              alan("fatura_trh","FATURA TARİHİ",{ph:"GG.AA.YYYY"}),
              alan("tutar","TUTAR (KDV HARİÇ) ₺",{ph:"0"}),
              alan("kdv_orani","KDV",{tip:"kdv"}),
              alan("yansitildi","DURUM",{tip:"onay"}),
              alan("notlar","NOT",{genis:true}),
            ]}
          </div>
          {formHata&&<div style={{marginTop:10}}><HataKutusu hata={formHata}/></div>}
          <div style={{display:"flex",gap:8,marginTop:12}}>
            <button onClick={kaydet} disabled={kaydediliyor} style={{background:"#8B5CF6",border:"none",color:"#fff",borderRadius:8,padding:"9px 18px",fontSize:12,fontWeight:700}}>{kaydediliyor?"Kaydediliyor...":"Kaydet"}</button>
            <button onClick={()=>setForm(null)} style={{background:"var(--border)",border:"1px solid var(--border-md)",color:"var(--text-2)",borderRadius:8,padding:"9px 14px",fontSize:12}}>Vazgeç</button>
          </div>
        </Card>
      )}
    </div>
  );
}

function MuhasebeGorunum({islemler:tumIslemler,setIslemler,onayDurumu:onayProp,setOnayDurumu,muhasebe,setMuhasebe,dosya,rol,exportCSV,exportPDF,api:apiTum,onFaturaOzet,isEmirleri}){
  const [isMobile,setIsMobile]=useState(false);
  const [aramaMetni,setAramaMetni]=useState("");
  const [filtreKat,setFiltreKat]=useState("tumu");
  const [siralama,setSiralama]=useState({alan:"kategori",yon:"asc"});
  const [duzenleId,setDuzenleId]=useState(null);
  const [yeniAcik,setYeniAcik]=useState(false);
  const [topluAcik,setTopluAcik]=useState(false);
  const [topluMetin,setTopluMetin]=useState("");
  const [topluHata,setTopluHata]=useState("");
  const [yeniForm,setYeniForm]=useState({kategori:"Kaporta",aciklama:"",birim:"Adet",miktar:"1",birimFiyat:"",odeyen:"sigorta"});
  const [adminNot,setAdminNot]=useState("");
  const [onayLoading,setOnayLoading]=useState(false);
  const [kapaliKatlar,setKapaliKatlar]=useState({});
  const [islemHata,setIslemHata]=useState("");
  const [seciliIE,setSeciliIE]=useState(null);
  const [ekHasar,setEkHasar]=useState(null); // açıklama metni (form açıkken)
  const [eksperAd,setEksperAd]=useState("");
  const [musteriAd,setMusteriAd]=useState("");
  useEffect(()=>{setEksperAd(dosya?.eksper?.ad||"");setMusteriAd(dosya?.sahip?.ad||"");},[dosya?.id]);
  // İş emri: seçilmediyse onay bekleyen, yoksa düzenlenebilir son iş emri, yoksa ana
  const gorunenIE=(isEmirleri||[]).filter(x=>x.durum!=="iptal");
  const ie=gorunenIE.find(x=>x.id===seciliIE)||gorunenIE.find(x=>x.onay_durumu==="bekliyor")
    ||[...gorunenIE].reverse().find(x=>x.onay_durumu!=="onaylandi")||gorunenIE[0]||null;
  const islemler=ie?tumIslemler.filter(i=>i.isEmriId===ie.id):tumIslemler;
  const onayDurumu=ie?ie.onay_durumu:onayProp;
  const api=apiTum&&ie?{...apiTum,
    kalemEkle:(f)=>apiTum.kalemEkle({...f,isEmriId:ie.id}),
    kalemToplu:(l)=>apiTum.kalemToplu(l,ie.id),
    onayaGonder:()=>apiTum.onayaGonder(ie.id),
    adminKarar:(k,n)=>apiTum.adminKarar(k,n,{is_emri_id:ie.id,eksper_ad:eksperAd||undefined,musteri_ad:musteriAd||undefined}),
  }:apiTum;
  const anaOnayli=gorunenIE.some(x=>x.tur==="ana"&&x.onay_durumu==="onaylandi");
  useEffect(()=>{const c=()=>setIsMobile(window.innerWidth<768);c();window.addEventListener("resize",c);return()=>window.removeEventListener("resize",c);},[]);

  const servisEdit = rol==="servis" && (onayDurumu==="taslak"||onayDurumu==="reddedildi");
  const adminEdit  = rol==="admin"  && onayDurumu==="bekliyor";
  const KATEGORILER_ISL=["Kaporta","Boya","Parça","İşçilik","Malzeme","Diğer"];

  // Filtre + arama + sıralama
  const filtrelenmis = islemler
    .filter(i=>{
      const aramaUygun = !aramaMetni || i.aciklama.toLowerCase().includes(aramaMetni.toLowerCase()) || i.kategori.toLowerCase().includes(aramaMetni.toLowerCase());
      const katUygun = filtreKat==="tumu" || i.kategori===filtreKat;
      return aramaUygun && katUygun;
    })
    .sort((a,b)=>{
      const [al,yon]=[ siralama.alan, siralama.yon];
      const va = al==="toplam"?a.birimFiyat*a.miktar : a[al];
      const vb = al==="toplam"?b.birimFiyat*b.miktar : b[al];
      return yon==="asc" ? (va>vb?1:-1) : (va<vb?1:-1);
    });

  // Kategori bazlı gruplama
  const gruplar = KATEGORILER_ISL.reduce((acc,k)=>{
    const items=filtrelenmis.filter(i=>i.kategori===k);
    if(items.length>0) acc[k]=items;
    return acc;
  },{});
  if(filtrelenmis.some(i=>!KATEGORILER_ISL.includes(i.kategori))){
    gruplar["Diğer"]=filtrelenmis.filter(i=>!KATEGORILER_ISL.includes(i.kategori));
  }

  // Özetler
  const toplamFatura    = islemler.reduce((s,i)=>s+i.birimFiyat*i.miktar,0);
  const onaylananToplam = islemler.filter(i=>i.durum==="onaylandi").reduce((s,i)=>s+i.birimFiyat*i.miktar,0);
  const sigortaOdeme    = tlSayiGuvenli(muhasebe?.sigortaOdeme);
  const fark            = onaylananToplam - sigortaOdeme;
  const bekleyenKalem   = islemler.filter(i=>i.durum==="bekliyor").length;

  // İşlem fonksiyonları: api verilmişse API'ye gider, yoksa yerel demo state
  const calis=async(fn)=>{setOnayLoading(true);setIslemHata("");try{await fn();}catch(e){setIslemHata(e.message||"İşlem başarısız");}finally{setOnayLoading(false);}};
  const islemGuncelle=(id,alan,val)=>{
    if(api&&(alan==="durum"||alan==="odeyen")){calis(()=>api.kalemKaydet(id,{[alan]:val}));return;}
    setIslemler(p=>p.map(i=>i.id===id?{...i,[alan]:alan==="miktar"||alan==="birimFiyat"?parseFloat(val)||0:val}:i));
  };
  const duzenleToggle=(isl,editing)=>{
    if(api&&editing)calis(()=>api.kalemKaydet(isl.id,{aciklama:isl.aciklama,miktar:isl.miktar,birim_fiyat:isl.birimFiyat}));
    setDuzenleId(editing?null:isl.id);
  };
  const islemSil=(id)=>{
    if(api){calis(()=>api.kalemSil(id));return;}
    setIslemler(p=>p.filter(i=>i.id!==id));
  };
  const islemEkle=()=>{
    if(!yeniForm.aciklama.trim()||!yeniForm.birimFiyat)return;
    const f={kategori:yeniForm.kategori,aciklama:yeniForm.aciklama,birim:yeniForm.birim,miktar:parseFloat(yeniForm.miktar)||1,birimFiyat:parseFloat(yeniForm.birimFiyat)||0,odeyen:yeniForm.odeyen};
    if(api){
      if(!f.birimFiyat){setIslemHata("Birim fiyat geçerli bir sayı olmalı");return;}
      calis(async()=>{await api.kalemEkle(f);setYeniForm(p=>({...p,aciklama:"",birimFiyat:""}));});
      return;
    }
    setIslemler(p=>[...p,{id:Date.now(),...f,durum:"bekliyor"}]);
    setYeniForm(p=>({...p,aciklama:"",birimFiyat:""}));
  };

  // Toplu import — her satır: Kategori | Açıklama | Birim | Miktar | Birim Fiyat
  const topluEkle=()=>{
    setTopluHata("");
    const satirlar=topluMetin.trim().split("\n").filter(s=>s.trim());
    const yeniIslemler=[];
    const hatalar=[];
    satirlar.forEach((satir,idx)=>{
      const parcalar=satir.split(/[\t|;]/).map(p=>p.trim());
      if(parcalar.length<3){hatalar.push(`Satır ${idx+1}: En az 3 sütun gerekli (Açıklama|Birim Fiyat|Miktar)`);return;}
      const [aciklama,birimFiyatStr,miktarStr,kategori,birim]=parcalar;
      const birimFiyat=tlSayiGuvenli(birimFiyatStr);
      const miktar=parseFloat(miktarStr||"1")||1;
      if(!birimFiyat){hatalar.push(`Satır ${idx+1}: Geçersiz birim fiyat "${birimFiyatStr}"`);return;}
      yeniIslemler.push({id:Date.now()+idx,kategori:KATEGORILER_ISL.includes(kategori)?kategori:"Diğer",aciklama,birim:birim||"Adet",miktar,birimFiyat,durum:"bekliyor"});
    });
    if(hatalar.length>0){setTopluHata(hatalar.join("\n"));return;}
    if(api){calis(async()=>{await api.kalemToplu(yeniIslemler);setTopluMetin("");setTopluAcik(false);});return;}
    setIslemler(p=>[...p,...yeniIslemler]);
    setTopluMetin("");setTopluAcik(false);
  };

  const onayaGonder=()=>{
    if(api){calis(()=>api.onayaGonder());return;}
    setOnayLoading(true);setTimeout(()=>{setOnayDurumu("bekliyor");setOnayLoading(false);},900);
  };
  const adminOnayla=()=>{
    if(api){calis(()=>api.adminKarar("onaylandi",adminNot));return;}
    setOnayLoading(true);setTimeout(()=>{setIslemler(p=>p.map(i=>({...i,durum:"onaylandi"})));setMuhasebe(p=>({...p,onaylananTutar:`${toplamFatura.toLocaleString("tr-TR")} ₺`,...(adminNot?{notlar:adminNot}:{})}));setOnayDurumu("onaylandi");setOnayLoading(false);},900);
  };
  const adminReddet=()=>{
    if(api){calis(()=>api.adminKarar("reddedildi",adminNot));return;}
    setOnayLoading(true);setTimeout(()=>{setMuhasebe(p=>({...p,...(adminNot?{notlar:adminNot}:{})}));setOnayDurumu("reddedildi");setOnayLoading(false);},900);
  };
  const katToggle=(k)=>setKapaliKatlar(p=>({...p,[k]:!p[k]}));
  const siralamaDegistir=(alan)=>setSiralama(p=>({alan,yon:p.alan===alan&&p.yon==="asc"?"desc":"asc"}));

  const DURUM_BADGE={
    taslak:    {l:"Taslak",          c:"var(--text-3)",bg:"rgba(100,116,139,0.12)"},
    bekliyor:  {l:"⏳ Onay Bekliyor", c:"#F59E0B",bg:"rgba(245,158,11,0.12)"},
    onaylandi: {l:"✓ Onaylandı",     c:"#10B981",bg:"rgba(16,185,129,0.12)"},
    reddedildi:{l:"✕ Reddedildi",    c:"#EF4444",bg:"rgba(239,68,68,0.12)"},
  };
  const badge=DURUM_BADGE[onayDurumu]||DURUM_BADGE.taslak;
  const selStyle={background:"var(--border)",border:"1px solid var(--border-hi)",borderRadius:7,color:"var(--text-1)",padding:"7px 10px",fontSize:12};
  const thStyle={textAlign:"left",padding:"8px 10px",color:"var(--text-2)",fontWeight:600,fontSize:10,whiteSpace:"nowrap",cursor:"pointer",userSelect:"none"};
  const SiraOk=({alan})=>siralama.alan===alan?<span style={{marginLeft:3,color:"#818CF8"}}>{siralama.yon==="asc"?"▲":"▼"}</span>:null;

  return(
    <div style={{display:"flex",flexDirection:"column",gap:14}}>

      {islemHata&&<HataKutusu hata={islemHata}/>}

      {/* Başlık + export */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}}>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <span style={{fontWeight:700,fontSize:14}}>💰 Muhasebe</span>
          <span style={{fontSize:10,fontWeight:700,padding:"3px 9px",borderRadius:5,background:badge.bg,color:badge.c,border:`1px solid ${badge.c}30`}}>{badge.l}</span>
          <span style={{fontSize:10,color:"var(--text-2)"}}>{islemler.length} kalem</span>
        </div>
        {rol==="admin"&&exportCSV&&(
          <div style={{display:"flex",gap:6}}>
            <button onClick={exportCSV} style={{background:"rgba(16,185,129,0.12)",border:"1px solid rgba(16,185,129,0.3)",color:"#10B981",borderRadius:7,padding:"5px 12px",fontSize:11,fontWeight:700}}>📊 Excel</button>
            <button onClick={exportPDF} style={{background:"rgba(239,68,68,0.1)",border:"1px solid rgba(239,68,68,0.25)",color:"#EF4444",borderRadius:7,padding:"5px 12px",fontSize:11,fontWeight:700}}>🖨️ PDF</button>
          </div>
        )}
      </div>

      {/* İş emri seçimi (ana + ek hasar turları) */}
      {apiTum&&gorunenIE.length>0&&(
        <div style={{display:"flex",gap:6,flexWrap:"wrap",alignItems:"center"}}>
          {gorunenIE.map(x=>{const oz=ONAY_ROZET[x.onay_durumu]||ONAY_ROZET.taslak;const aktif=ie?.id===x.id;return(
            <button key={x.id} onClick={()=>setSeciliIE(x.id)} style={{padding:"6px 11px",borderRadius:8,fontSize:11,fontWeight:700,border:`1.5px solid ${aktif?oz.c:"var(--border-md)"}`,background:aktif?`${oz.c}14`:"transparent",color:aktif?oz.c:"var(--text-2)"}}>
              {isEmriAdi(x)} · {oz.l}{x.onay_durumu==="bekliyor"&&x.gonderim_trh?` (${trTarihZaman(x.gonderim_trh)})`:""}
            </button>
          );})}
          {(rol==="servis"||rol==="admin")&&anaOnayli&&ekHasar===null&&(
            <button onClick={()=>setEkHasar("")} style={{padding:"6px 11px",borderRadius:8,fontSize:11,fontWeight:700,border:"1.5px dashed #EF4444",background:"rgba(239,68,68,0.06)",color:"#EF4444"}}>+ Ek hasar bildir</button>
          )}
        </div>
      )}
      {ekHasar!==null&&(
        <div style={{padding:12,background:"rgba(239,68,68,0.05)",border:"1px solid rgba(239,68,68,0.25)",borderRadius:10}}>
          <div style={{fontSize:12,fontWeight:700,color:"#EF4444",marginBottom:6}}>Ek hasar bildirimi</div>
          <div style={{fontSize:11,color:"var(--text-2)",marginBottom:8}}>Söküm veya onarım sırasında çıkan yeni hasar için ayrı bir iş emri açılır. Kalemlerini girip ayrıca onaya gönderirsiniz. Sigorta kalemlerini eksper, sigorta harici kalemleri müşteri onaylar.</div>
          <textarea autoFocus value={ekHasar} onChange={e=>setEkHasar(e.target.value)} rows={2} placeholder="Ne bulundu? (örn. söküm sonrası sağ ön panelde ezik)" style={{width:"100%",background:"var(--border)",border:"1px solid var(--border-md)",borderRadius:8,color:"var(--text-1)",padding:"8px 10px",fontSize:12,resize:"vertical"}}/>
          <div style={{display:"flex",gap:8,marginTop:8}}>
            <button disabled={onayLoading||!ekHasar.trim()} onClick={()=>calis(async()=>{const r=await apiTum.ekHasar(ekHasar.trim());setEkHasar(null);setSeciliIE(r.id);})} style={{background:"#EF4444",border:"none",color:"#fff",borderRadius:7,padding:"7px 14px",fontSize:12,fontWeight:700}}>Ek hasar iş emri aç</button>
            <button onClick={()=>setEkHasar(null)} style={{background:"var(--border)",border:"1px solid var(--border-md)",color:"var(--text-2)",borderRadius:7,padding:"7px 12px",fontSize:12}}>Vazgeç</button>
          </div>
        </div>
      )}
      {ie?.aciklama&&ie.tur==="ek_hasar"&&<div style={{fontSize:12,color:"var(--text-2)"}}>📝 {ie.aciklama}</div>}

      {/* Red uyarısı */}
      {rol==="servis"&&onayDurumu==="reddedildi"&&(
        <div style={{padding:"12px 14px",background:"rgba(239,68,68,0.08)",border:"1px solid rgba(239,68,68,0.25)",borderRadius:10,fontSize:12,color:"#EF4444",lineHeight:1.6}}>
          ✕ <strong>Reddedildi.</strong> Kalemleri güncelleyip tekrar gönderebilirsiniz.
          {(ie?.karar_notu||muhasebe?.notlar)&&<div style={{marginTop:6,color:"var(--text-2)"}}>Admin notu: {ie?.karar_notu||muhasebe.notlar}</div>}
        </div>
      )}

      {/* Özet kartları */}
      <div style={{display:"grid",gridTemplateColumns:isMobile?"1fr 1fr":"repeat(4,1fr)",gap:10}}>
        {[
          {l:"Toplam Fatura",   v:`${toplamFatura.toLocaleString("tr-TR")} ₺`,                                    c:"#EF4444",sub:`${islemler.length} kalem`},
          {l:"Onaylanan",       v:onaylananToplam>0?`${onaylananToplam.toLocaleString("tr-TR")} ₺`:"Bekliyor",    c:"#3B82F6", sub:`${islemler.filter(i=>i.durum==="onaylandi").length} kalem`},
          {l:"Sigorta Ödemesi", v:muhasebe?.sigortaOdeme||"Bekleniyor",                                            c:muhasebe?.sigortaOdeme?"#10B981":"var(--text-3)",sub:"Alınan ödeme"},
          {l:"Net Fark",        v:muhasebe?.sigortaOdeme&&onaylananToplam>0?`${fark>=0?"+":""}${fark.toLocaleString("tr-TR")} ₺`:"—",c:fark>=0?"#10B981":"#EF4444",sub:fark>=0?"Fazla":"Eksik"},
        ].map(k=>(
          <div key={k.l} style={{background:"var(--surface-2)",border:"1px solid var(--border)",borderRadius:12,padding:"12px 14px"}}>
            <div style={{fontSize:9,color:"var(--text-2)",fontWeight:700,marginBottom:5}}>{k.l.toUpperCase()}</div>
            <div style={{fontSize:isMobile?14:18,fontWeight:800,color:k.c,marginBottom:2}}>{k.v}</div>
            <div style={{fontSize:9,color:"rgba(15,23,42,0.06)"}}>{k.sub}</div>
          </div>
        ))}
      </div>

      {/* Araçlar: Arama + Filtre + Toplu Ekle */}
      <div style={{background:"var(--surface-2)",border:"1px solid var(--border)",borderRadius:12,overflow:"hidden"}}>
        {/* Toolbar */}
        <div style={{padding:"12px 14px",borderBottom:"1px solid rgba(255,255,255,0.06)",display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>

          <div style={{position:"relative",flex:1,minWidth:160}}>

          {/* Kategori filtre */}
          <select value={filtreKat} onChange={e=>setFiltreKat(e.target.value)} style={{...selStyle,padding:"7px 10px",fontSize:11}}>

          {/* Servis butonları */}
          {servisEdit&&(
            <div style={{display:"flex",gap:6}}>
              <button onClick={()=>{setYeniAcik(a=>!a);setTopluAcik(false);}} style={{background:yeniAcik?"rgba(139,92,246,0.2)":"rgba(139,92,246,0.1)",border:"1px solid rgba(139,92,246,0.3)",color:"#A78BFA",borderRadius:7,padding:"6px 12px",fontSize:11,fontWeight:700}}>+ Kalem</button>
              <button onClick={()=>{setTopluAcik(a=>!a);setYeniAcik(false);}} style={{background:topluAcik?"rgba(59,130,246,0.2)":"rgba(59,130,246,0.08)",border:"1px solid rgba(59,130,246,0.3)",color:"#60A5FA",borderRadius:7,padding:"6px 12px",fontSize:11,fontWeight:700}}>📋 Toplu Ekle</button>
            </div>
          )}
          {!servisEdit&&!adminEdit&&<div style={{fontSize:10,color:"var(--text-2)",padding:"4px 9px",background:"var(--surface-3)",borderRadius:6}}>🔒 Salt okunur</div>}
          <div style={{fontSize:11,color:"var(--text-2)",marginLeft:"auto",flexShrink:0}}>{filtrelenmis.length} / {islemler.length} kalem</div>
        </div>

        {/* Tek kalem ekleme formu */}
        {servisEdit&&yeniAcik&&(
          <div style={{padding:"12px 14px",borderBottom:"1px solid rgba(255,255,255,0.06)",background:"rgba(139,92,246,0.04)"}}>
            <div style={{fontSize:11,color:"#A78BFA",fontWeight:700,marginBottom:10}}>YENİ KALEM</div>
            <div style={{display:"grid",gridTemplateColumns:isMobile?"1fr 1fr":"2fr 3fr 1fr 1fr 1fr 1.3fr auto",gap:8,alignItems:"end"}}>
              <div>
                <div style={{fontSize:10,color:"var(--text-2)",fontWeight:600,marginBottom:4}}>KATEGORİ</div>
                <select value={yeniForm.kategori} onChange={e=>setYeniForm(p=>({...p,kategori:e.target.value}))} style={selStyle}>
                  {KATEGORILER_ISL.map(k=><option key={k} value={k}>{k}</option>)}
                </select>
              </div>
              <div>
                <div style={{fontSize:10,color:"var(--text-2)",fontWeight:600,marginBottom:4}}>AÇIKLAMA</div>
                <input value={yeniForm.aciklama} onChange={e=>setYeniForm(p=>({...p,aciklama:e.target.value}))} onKeyDown={e=>e.key==="Enter"&&islemEkle()} placeholder="Yapılan iş..." style={{...selStyle,width:"100%"}}/>
              </div>
              <div>
                <div style={{fontSize:10,color:"var(--text-2)",fontWeight:600,marginBottom:4}}>BİRİM</div>
                <input value={yeniForm.birim} onChange={e=>setYeniForm(p=>({...p,birim:e.target.value}))} placeholder="Adet" style={{...selStyle,width:"100%"}}/>
              </div>
              <div>
                <div style={{fontSize:10,color:"var(--text-2)",fontWeight:600,marginBottom:4}}>MİKTAR</div>
                <input type="number" value={yeniForm.miktar} onChange={e=>setYeniForm(p=>({...p,miktar:e.target.value}))} style={{...selStyle,width:"100%"}}/>
              </div>
              <div>
                <div style={{fontSize:10,color:"var(--text-2)",fontWeight:600,marginBottom:4}}>BİRİM FİYAT ₺</div>
                <input type="number" value={yeniForm.birimFiyat} onChange={e=>setYeniForm(p=>({...p,birimFiyat:e.target.value}))} onKeyDown={e=>e.key==="Enter"&&islemEkle()} placeholder="0" style={{...selStyle,width:"100%"}}/>
              </div>
              <div>
                <div style={{fontSize:10,color:"var(--text-2)",fontWeight:600,marginBottom:4}}>ÖDEYEN</div>
                <select value={yeniForm.odeyen} onChange={e=>setYeniForm(p=>({...p,odeyen:e.target.value}))} style={{...selStyle,width:"100%"}}>
                  {TARAFLAR.map(t=><option key={t.id} value={t.id}>{t.l}</option>)}
                </select>
              </div>
              <button onClick={islemEkle} style={{background:"#8B5CF6",border:"none",color:"#fff",borderRadius:7,padding:"8px 14px",fontSize:13,fontWeight:800,height:36}}>+</button>
            </div>
            <div style={{fontSize:10,color:"var(--text-2)",marginTop:8}}>💡 Enter ile hızlıca ekleyebilirsiniz</div>
          </div>
        )}

        {/* Toplu ekleme */}
        {servisEdit&&topluAcik&&(
          <div style={{padding:"12px 14px",borderBottom:"1px solid rgba(255,255,255,0.06)",background:"rgba(59,130,246,0.04)"}}>
            <div style={{fontSize:11,color:"#60A5FA",fontWeight:700,marginBottom:6}}>📋 TOPLU KALEM EKLEME</div>
            <div style={{fontSize:11,color:"var(--text-2)",marginBottom:8,lineHeight:1.6}}>
              Her satıra bir kalem girin. Sütunları <strong style={{color:"var(--text-2)"}}>Tab</strong>, <strong style={{color:"var(--text-2)"}}>|</strong> veya <strong style={{color:"var(--text-2)"}}>;</strong> ile ayırın:<br/>
              <span style={{fontFamily:"var(--font-mono)",color:"#818CF8"}}>Açıklama | Birim Fiyat | Miktar | Kategori | Birim</span>
            </div>
            <div style={{padding:"8px 12px",background:"var(--surface-3)",borderRadius:7,marginBottom:8,fontSize:10,color:"var(--text-2)",fontFamily:"var(--font-mono)",lineHeight:1.8}}>
              Sağ ön far komple | 8500 | 1 | Parça | Adet<br/>
              Motor kapağı boya | 2200 | 1 | Boya | Adet<br/>
              Söküm işçiliği | 450 | 3 | İşçilik | Saat
            </div>
            <textarea value={topluMetin} onChange={e=>setTopluMetin(e.target.value)} rows={8} placeholder={"Açıklama | Birim Fiyat | Miktar | Kategori | Birim"} style={{width:"100%",background:"var(--border)",border:"1px solid var(--border-md)",borderRadius:8,color:"var(--text-1)",padding:"10px 12px",fontSize:12,resize:"vertical",lineHeight:1.8,fontFamily:"var(--font-mono)"}}/>
            {topluHata&&<div style={{marginTop:6,padding:"8px 10px",background:"rgba(239,68,68,0.08)",borderRadius:7,fontSize:11,color:"#EF4444",fontFamily:"var(--font-mono)",whiteSpace:"pre-wrap"}}>{topluHata}</div>}
            <div style={{display:"flex",gap:8,marginTop:10}}>
              <button onClick={topluEkle} disabled={!topluMetin.trim()} style={{background:topluMetin.trim()?"#3B82F6":"rgba(59,130,246,0.3)",border:"none",color:"#fff",borderRadius:7,padding:"9px 20px",fontSize:12,fontWeight:700}}>✓ {topluMetin.trim().split("\n").filter(s=>s.trim()).length} Kalem Ekle</button>
              <button onClick={()=>{setTopluAcik(false);setTopluMetin("");setTopluHata("");}} style={{background:"rgba(15,23,42,0.05)",border:"1px solid var(--border-md)",color:"var(--text-2)",borderRadius:7,padding:"9px 14px",fontSize:12}}>İptal</button>
            </div>
          </div>
        )}

        {/* Tablo — Kategoriye göre gruplu */}
        {filtrelenmis.length===0?(
          <div style={{padding:"32px 16px",textAlign:"center",color:"rgba(15,23,42,0.06)"}}>
            <div style={{fontSize:32,marginBottom:8}}>🔍</div>
            <div style={{fontSize:13,fontWeight:600}}>{aramaMetni?"Arama sonucu yok":"Henüz kalem girilmedi"}</div>
          </div>

          <div>

              const renk=ISLEM_KAT_RENK[kat]||"var(--text-3)";

              const katOnaylanan=items.filter(i=>i.durum==="onaylandi").reduce((s,i)=>s+i.birimFiyat*i.miktar,0);

                <div key={kat} style={{borderBottom:"1px solid rgba(255,255,255,0.06)"}}>

                    <div style={{width:10,height:10,borderRadius:2,background:renk,flexShrink:0}}/>
                    <span style={{fontWeight:700,fontSize:12,color:renk,flex:1}}>{kat}</span>
                    <span style={{fontSize:11,color:"var(--text-2)"}}>{items.length} kalem</span>
                    <span style={{fontSize:12,fontWeight:700,color:"var(--text-1)",fontFamily:"var(--font-mono)"}}>{katToplam.toLocaleString("tr-TR")} ₺</span>

                            <th style={{...thStyle,width:70}} onClick={()=>siralamaDegistir("birim")}>Birim<SiraOk alan="birim"/></th>
                            <th style={{...thStyle,width:70,textAlign:"right"}} onClick={()=>siralamaDegistir("miktar")}>Miktar<SiraOk alan="miktar"/></th>
                            <th style={{...thStyle,width:100,textAlign:"right"}} onClick={()=>siralamaDegistir("birimFiyat")}>Birim Fiyat<SiraOk alan="birimFiyat"/></th>
                            <th style={{...thStyle,width:100,textAlign:"right"}} onClick={()=>siralamaDegistir("toplam")}>Toplam<SiraOk alan="toplam"/></th>
                            <th style={{...thStyle,width:90}}>Ödeyen</th>
                            <th style={{...thStyle,width:80}}>Durum</th>
                            {(servisEdit||adminEdit)&&<th style={{width:64}}/>}
                          </tr>
                        </thead>
                        <tbody>
                          {items.map((isl,idx)=>{
                            const toplam=isl.birimFiyat*isl.miktar;
                            const editing=duzenleId===isl.id&&servisEdit;
                            return(
                              <tr key={isl.id} style={{borderBottom:"1px solid rgba(255,255,255,0.03)",background:idx%2===0?"transparent":"rgba(255,255,255,0.01)"}}>
                                <td style={{padding:"8px 10px",color:"var(--text-1)"}}>
                                  {editing?<input value={isl.aciklama} onChange={e=>islemGuncelle(isl.id,"aciklama",e.target.value)} style={{...selStyle,padding:"4px 8px",width:"100%"}}/>:isl.aciklama}
                                  {isl.onaylayanAd&&<div style={{fontSize:10,color:"var(--text-3)",marginTop:2}}>✓ {ONAYLAYAN_AD[isl.onaylayanTip]||"Onaylayan"}: {isl.onaylayanAd}</div>}
                                </td>
                                <td style={{padding:"8px 10px",color:"var(--text-2)"}}>{isl.birim}</td>
                                <td style={{padding:"8px 10px",color:"var(--text-2)",textAlign:"right"}}>
                                  {editing?<input type="number" value={isl.miktar} onChange={e=>islemGuncelle(isl.id,"miktar",e.target.value)} style={{...selStyle,padding:"4px 6px",width:60,textAlign:"right"}}/>:isl.miktar}
                                </td>
                                <td style={{padding:"8px 10px",color:"var(--text-2)",textAlign:"right",fontFamily:"var(--font-mono)"}}>
                                  {editing?<input type="number" value={isl.birimFiyat} onChange={e=>islemGuncelle(isl.id,"birimFiyat",e.target.value)} style={{...selStyle,padding:"4px 6px",width:80,textAlign:"right"}}/>:`${isl.birimFiyat.toLocaleString("tr-TR")} ₺`}
                                </td>
                                <td style={{padding:"8px 10px",fontWeight:700,textAlign:"right",fontFamily:"var(--font-mono)",color:"var(--text-1)"}}>{toplam.toLocaleString("tr-TR")} ₺</td>
                                <td style={{padding:"8px 10px"}}>
                                  {servisEdit||adminEdit?(
                                    <select value={isl.odeyen||"sigorta"} onChange={e=>islemGuncelle(isl.id,"odeyen",e.target.value)} style={{...selStyle,padding:"3px 6px",fontSize:11,color:tarafBul(isl.odeyen||"sigorta").c}}>
                                      {TARAFLAR.map(t=><option key={t.id} value={t.id}>{t.l}</option>)}
                                    </select>
                                  ):<span style={{fontSize:10,fontWeight:700,color:tarafBul(isl.odeyen||"sigorta").c}}>{tarafBul(isl.odeyen||"sigorta").l}</span>}
                                </td>
                                <td style={{padding:"8px 10px"}}>
                                  {adminEdit?(
                                    <div style={{display:"flex",gap:4}}>
                                      <button onClick={()=>islemGuncelle(isl.id,"durum","onaylandi")} style={{background:isl.durum==="onaylandi"?"rgba(16,185,129,0.2)":"var(--border)",border:`1px solid ${isl.durum==="onaylandi"?"rgba(16,185,129,0.4)":"var(--border-md)"}`,color:isl.durum==="onaylandi"?"#10B981":"var(--text-3)",borderRadius:5,padding:"3px 7px",fontSize:10,fontWeight:700}}>✓</button>
                                      <button onClick={()=>islemGuncelle(isl.id,"durum","reddedildi")} style={{background:isl.durum==="reddedildi"?"rgba(239,68,68,0.15)":"var(--border)",border:`1px solid ${isl.durum==="reddedildi"?"rgba(239,68,68,0.35)":"var(--border-md)"}`,color:isl.durum==="reddedildi"?"#EF4444":"var(--text-3)",borderRadius:5,padding:"3px 7px",fontSize:10,fontWeight:700}}>✕</button>
                                    </div>
                                  ):(
                                    <span style={{fontSize:9,fontWeight:700,padding:"2px 6px",borderRadius:4,background:isl.durum==="onaylandi"?"rgba(16,185,129,0.15)":isl.durum==="reddedildi"?"rgba(239,68,68,0.12)":"rgba(245,158,11,0.1)",color:isl.durum==="onaylandi"?"#10B981":isl.durum==="reddedildi"?"#EF4444":"#F59E0B"}}>
                                      {isl.durum==="onaylandi"?"✓ Onaylı":isl.durum==="reddedildi"?"✕ Red":"⏳ Bekliyor"}
                                    </span>
                                  )}
                                </td>
                                {servisEdit&&(
                                  <td style={{padding:"8px 6px"}}>
                                    <div style={{display:"flex",gap:3}}>
                                      <button onClick={()=>duzenleToggle(isl,editing)} style={{background:editing?"rgba(16,185,129,0.15)":"rgba(15,23,42,0.05)",border:`1px solid ${editing?"rgba(16,185,129,0.3)":"var(--border-md)"}`,color:editing?"#10B981":"var(--text-2)",borderRadius:5,width:24,height:24,fontSize:10,display:"flex",alignItems:"center",justifyContent:"center"}}>{editing?"✓":"✏"}</button>
                                      <button onClick={()=>islemSil(isl.id)} style={{background:"rgba(239,68,68,0.08)",border:"1px solid rgba(239,68,68,0.15)",color:"#EF4444",borderRadius:5,width:24,height:24,fontSize:11,display:"flex",alignItems:"center",justifyContent:"center"}}>×</button>
                                    </div>
                                  </td>
                                )}
                                {adminEdit&&<td/>}
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>
                  )}
                </div>
              );
            })}

            <div style={{padding:"11px 14px",background:"rgba(15,23,42,0.02)",display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}}>
              <span style={{fontSize:12,fontWeight:700,color:"var(--text-2)"}}>GENEL TOPLAM — {filtrelenmis.length} kalem</span>
              <div style={{display:"flex",gap:16,flexWrap:"wrap"}}>
                <span style={{fontSize:14,fontWeight:800,color:"#EF4444",fontFamily:"var(--font-mono)"}}>{filtrelenmis.reduce((s,i)=>s+i.birimFiyat*i.miktar,0).toLocaleString("tr-TR")} ₺</span>
                {filtrelenmis.some(i=>i.durum==="onaylandi")&&<span style={{fontSize:12,fontWeight:700,color:"#10B981",fontFamily:"var(--font-mono)"}}>✓ Onaylı: {filtrelenmis.filter(i=>i.durum==="onaylandi").reduce((s,i)=>s+i.birimFiyat*i.miktar,0).toLocaleString("tr-TR")} ₺</span>}
              </div>
            </div>
          </div>
        )}
      </div>

      {/* Ödeme durumu */}
      <div style={{background:"var(--surface-2)",border:"1px solid var(--border)",borderRadius:12,padding:14}}>
        <div style={{fontWeight:700,fontSize:13,marginBottom:12}}>💳 Ödeme Durumu</div>
        {[
          {l:"Toplam Fatura",    v:`${toplamFatura.toLocaleString("tr-TR")} ₺`, c:"#EF4444"},
          {l:"Muallak Hasar",    v:dosya?.muallakHasar||"—",                     c:"#F59E0B"},
          {l:"Sigorta Onayı",    v:muhasebe?.onaylananTutar||"Bekleniyor",        c:"#3B82F6"},
          {l:"Sigorta Ödemesi",  v:muhasebe?.sigortaOdeme||"Bekleniyor",          c:muhasebe?.sigortaOdeme?"#10B981":"var(--text-3)"},
          {l:"Müşteri Muafiyeti",v:dosya?.sigortaSirketi?.muafiyet||"—",          c:"#F59E0B"},
        ].map(r=>(
          <div key={r.l} style={{display:"flex",justifyContent:"space-between",padding:"7px 0",borderBottom:"1px solid rgba(255,255,255,0.04)"}}>
            <span style={{fontSize:12,color:"var(--text-2)"}}>{r.l}</span>
            <span style={{fontSize:12,fontWeight:700,color:r.c}}>{r.v}</span>
          </div>
        ))}
        {muhasebe?.sigortaOdeme&&onaylananToplam>0&&(
          <div style={{display:"flex",justifyContent:"space-between",padding:"10px 14px",marginTop:8,background:fark>=0?"rgba(16,185,129,0.1)":"rgba(239,68,68,0.1)",borderRadius:9,border:`1px solid ${fark>=0?"rgba(16,185,129,0.25)":"rgba(239,68,68,0.25)"}`}}>
            <span style={{fontSize:13,fontWeight:700}}>Net Fark</span>
            <span style={{fontSize:16,fontWeight:800,color:fark>=0?"#10B981":"#EF4444"}}>{fark>=0?"+":""}{fark.toLocaleString("tr-TR")} ₺</span>
          </div>
        )}
        {muhasebe?.notlar&&<div style={{marginTop:8,padding:"9px 12px",background:"var(--surface-3)",border:"1px solid var(--border)",borderRadius:8,fontSize:12,color:"var(--text-2)",lineHeight:1.6}}>📝 {muhasebe.notlar}</div>}
      </div>

      {apiTum&&dosya?.id&&<FaturaPaneli dosyaId={dosya.id} dosya={dosya} kalemler={tumIslemler} isEmirleri={gorunenIE} onOzet={onFaturaOzet}
        yenileAnahtar={tumIslemler.map(i=>`${i.id}:${i.odeyen}:${i.miktar*i.birimFiyat}:${i.durum}`).join("|")}/>}

      {/* Servis — Onaya Gönder */}
      {rol==="servis"&&(onayDurumu==="taslak"||onayDurumu==="reddedildi")&&(
        <button onClick={onayaGonder} disabled={onayLoading||islemler.length===0} style={{background:islemler.length>0?"#8B5CF6":"rgba(139,92,246,0.3)",border:"none",color:"#fff",borderRadius:10,padding:"14px",fontSize:14,fontWeight:800,display:"flex",alignItems:"center",justifyContent:"center",gap:10}}>
          {onayLoading?<><span style={{width:18,height:18,border:"2px solid rgba(255,255,255,0.3)",borderTop:"2px solid #fff",borderRadius:"50%",display:"inline-block",animation:"spin .7s linear infinite"}}/> Gönderiliyor...</>:<><span style={{fontSize:20}}>📤</span> Hasar Admin'e Onaya Gönder ({islemler.length} kalem · {toplamFatura.toLocaleString("tr-TR")} ₺)</>}
        </button>
      )}
      {rol==="servis"&&onayDurumu==="bekliyor"&&(
        <div style={{padding:"12px 16px",background:"rgba(245,158,11,0.07)",border:"1px solid rgba(245,158,11,0.25)",borderRadius:10,fontSize:12,color:"#F59E0B",display:"flex",gap:10,alignItems:"center"}}>
          <span style={{fontSize:20}}>⏳</span>
          <div><div style={{fontWeight:700,marginBottom:2}}>Onay Bekleniyor</div><div style={{color:"var(--text-2)"}}>Kalemler Hasar Admin'e iletildi. Onay sonrası bildirim alacaksınız.</div></div>
        </div>
      )}
      {rol==="servis"&&onayDurumu==="onaylandi"&&(
        <div style={{padding:"12px 16px",background:"rgba(16,185,129,0.07)",border:"1px solid rgba(16,185,129,0.25)",borderRadius:10,fontSize:12,color:"#10B981",display:"flex",gap:10,alignItems:"center"}}>
          <span style={{fontSize:20}}>✅</span>
          <div><div style={{fontWeight:700,marginBottom:2}}>Onaylandı</div><div style={{color:"var(--text-2)"}}>Kalemler Hasar Admin tarafından onaylandı.</div></div>
        </div>
      )}

      {/* Admin — Onay paneli */}

// ─── ARAÇ KABUL VE TESLİM TUTANAĞI ────────────────────────────────────────
// Kabul teslimden önce düzeltilebilir. Teslim bir kez kaydedilir, "Araç Teslimi" adımını kapatır (API).
const YAKIT_SEC=[0,25,50,75,100];
const KONTROL_ETIKET={tamam:"Tamam",yok:"Uygulanmaz"};
function tutanakYazdir(tip,t,b){
  const satir=(l,v)=>`<tr><td class="l">${htmlKac(l)}</td><td>${htmlKac(v)}</td></tr>`;
  const aks=Object.entries(t.aksesuarlar||{}).map(([a,v])=>`<span class="aks">${v?"☑":"☐"} ${htmlKac(a)}</span>`).join(" ")||"—";
  const kontrol=Object.entries(t.kontrol||{}).map(([m,d])=>satir(m,KONTROL_ETIKET[d]||d)).join("");
  const kabul=tip==="kabul";
  const html=`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${kabul?"Araç Kabul":"Araç Teslim"} Tutanağı ${htmlKac(b.dosyaNo)}</title><style>body{font-family:Arial,sans-serif;font-size:12px;color:#222;margin:28px}h2{margin:0 0 4px}p.alt{color:#666;font-size:11px;margin:0 0 16px}table{width:100%;border-collapse:collapse;margin-bottom:14px}td{padding:6px 8px;border:1px solid #ccc;vertical-align:top}td.l{width:38%;font-weight:bold;background:#f5f5f5}h3{font-size:12px;margin:16px 0 6px;text-transform:uppercase;color:#555}.aks{display:inline-block;margin:0 14px 4px 0}.imza{display:flex;gap:40px;margin-top:40px}.imza div{flex:1;border-top:1px solid #333;padding-top:6px;font-size:11px}@media print{body{margin:12mm}}</style></head><body>
    <h2>${kabul?"Araç Kabul Tutanağı":"Araç Teslim Tutanağı"}</h2>
    <p class="alt">${htmlKac(b.servisAd||"HasarTrack")} · Dosya ${htmlKac(b.dosyaNo)} · ${htmlKac(new Date(t.created_at).toLocaleString("tr-TR"))}</p>
    <table>${satir("Plaka",b.plaka)}${satir("Araç",[b.marka,b.model].filter(Boolean).join(" "))}${satir("Araç sahibi",b.sahipAd)}${satir("Kilometre",Number(t.km).toLocaleString("tr-TR")+" km")}${satir("Yakıt / şarj",t.yakit_yuzde==null?"Belirtilmedi":"%"+t.yakit_yuzde)}</table>
    <h3>Araçtaki aksesuar ve belgeler</h3><div>${aks}</div>
    ${kontrol?`<h3>Son kontrol</h3><table>${kontrol}</table>`:""}
    <h3>${kabul?"Mevcut hasar ve notlar":"Açıklama"}</h3><div>${htmlKac(t.aciklama||"—")}</div>
    <div class="imza"><div>${kabul?"Aracı teslim eden":"Aracı teslim alan"}: ${htmlKac(t.musteri_ad)}<br><br>İmza</div><div>${kabul?"Aracı teslim alan (servis)":"Aracı teslim eden (servis)"}: ${htmlKac(t.personel_ad)}<br><br>İmza</div></div>
  </body></html>`;
  const w=window.open("","_blank","width=800,height=900");
  if(!w)return;
  w.document.write(html);w.document.close();setTimeout(()=>w.print(),400);
}
function TutanakOzet({t,tip,bilgi,onDuzelt}){
  const aks=Object.entries(t.aksesuarlar||{}).filter(([,v])=>v).map(([a])=>a);
  const S=({l,v})=><div style={{display:"flex",justifyContent:"space-between",gap:10,padding:"5px 0",borderBottom:"1px solid var(--border)",fontSize:12}}><span style={{color:"var(--text-2)"}}>{l}</span><span style={{fontWeight:600,textAlign:"right"}}>{v}</span></div>;
  return(
    <div>
      <S l="Kilometre" v={`${Number(t.km).toLocaleString("tr-TR")} km`}/>

      <S l="Aksesuarlar" v={aks.join(", ")||"Yok"}/>
      {t.aciklama&&<S l={tip==="kabul"?"Mevcut hasar":"Açıklama"} v={t.aciklama}/>}
      <S l={tip==="kabul"?"Getiren":"Teslim alan"} v={t.musteri_ad}/>

        {onDuzelt&&<button onClick={onDuzelt} style={{background:"none",border:"1px solid var(--border)",color:"var(--text-2)",borderRadius:7,padding:"5px 12px",fontSize:11,fontWeight:700}}>Düzelt</button>}
      </div>
    </div>
  );
}
function TutanakPaneli({dosyaId,bilgi,onDegisti}){
  const [veri,setVeri]=useState(null);const [hata,setHata]=useState("");const [form,setForm]=useState(null);const [kaydediliyor,setKaydediliyor]=useState(false);
  const yukle=()=>apiCall(`/tutanaklar/${dosyaId}`).then(setVeri).catch(e=>setHata(e.message));
  useEffect(()=>{setVeri(null);setForm(null);setHata("");yukle();},[dosyaId]);
  if(!veri)return <Card><ST>📝 Kabul ve Teslim Tutanağı</ST>{hata?<HataKutusu hata={hata} onTekrar={yukle}/>:<div style={{fontSize:12,color:"var(--text-2)"}}>Yükleniyor...</div>}</Card>;
  const {kabul,teslim,secenekler}=veri;
  const formAc=(tip)=>{
    setHata("");
    const kaynak=tip==="kabul"?kabul:null;
    setForm({tip,km:kaynak?String(kaynak.km):tip==="teslim"?String(kabul.km):"",yakit_yuzde:kaynak?kaynak.yakit_yuzde:tip==="teslim"?kabul.yakit_yuzde:null,
      aksesuarlar:{...(kaynak?.aksesuarlar||(tip==="teslim"?kabul.aksesuarlar:{}))},kontrol:{},aciklama:kaynak?.aciklama||"",
      musteri_ad:kaynak?.musteri_ad||bilgi.sahipAd||"",personel_ad:kaynak?.personel_ad||""});
  };

  const eksikAks=form?.tip==="teslim"?Object.entries(kabul.aksesuarlar||{}).filter(([a,v])=>v&&!form.aksesuarlar[a]).map(([a])=>a):[];
  const kaydet=async()=>{
    if(form.tip==="teslim"&&!confirm("Teslim tutanağı kaydedilince değiştirilemez ve 'Araç Teslimi' adımı tamamlanır. Devam edilsin mi?"))return;
    setKaydediliyor(true);setHata("");
    try{
      const govde={km:form.km===""?null:Number(form.km),yakit_yuzde:form.yakit_yuzde,aksesuarlar:form.aksesuarlar,aciklama:form.aciklama,musteri_ad:form.musteri_ad,personel_ad:form.personel_ad,...(form.tip==="teslim"&&{kontrol:form.kontrol})};
      const r=form.tip==="kabul"?await apiCall(`/tutanaklar/${dosyaId}/kabul`,"PUT",govde):await apiCall(`/tutanaklar/${dosyaId}/teslim`,"POST",govde);
      setVeri(v=>({...v,...r}));setForm(null);onDegisti&&onDegisti();
    }catch(e){setHata(e.message);}finally{setKaydediliyor(false);}
  };

  const secBtn=(aktif,renk="#3B82F6")=>({padding:"5px 10px",borderRadius:7,fontSize:11,fontWeight:aktif?700:500,border:`1px solid ${aktif?renk:"var(--border)"}`,background:aktif?`${renk}18`:"transparent",color:aktif?renk:"var(--text-2)"});

  return(
    <Card>
      <ST>📝 Kabul ve Teslim Tutanağı</ST>
      {hata&&<div style={{marginBottom:10}}><HataKutusu hata={hata}/></div>}
      {form?(
        <div>

          {form.tip==="teslim"&&<div style={{fontSize:10,color:"var(--text-2)",marginTop:4}}>Kabulde: {Number(kabul.km).toLocaleString("tr-TR")} km</div>}
          {etiket("YAKIT / ŞARJ")}
          <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
            {YAKIT_SEC.map(y=><button key={y} onClick={()=>f("yakit_yuzde",y)} style={secBtn(form.yakit_yuzde===y)}>%{y}</button>)}
            <button onClick={()=>f("yakit_yuzde",null)} style={secBtn(form.yakit_yuzde==null,"#64748B")}>Belirtilmedi</button>
          </div>
          {etiket("ARAÇTAKİ AKSESUAR VE BELGELER")}
          <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
            {secenekler.aksesuarlar.map(a=><button key={a} onClick={()=>f("aksesuarlar",{...form.aksesuarlar,[a]:!form.aksesuarlar[a]})} style={secBtn(!!form.aksesuarlar[a],"#10B981")}>{form.aksesuarlar[a]?"✓ ":""}{a}</button>)}
          </div>
          {eksikAks.length>0&&<div style={{fontSize:11,color:"#F59E0B",marginTop:6}}>⚠ Kabulde vardı, şimdi işaretli değil: {eksikAks.join(", ")}. Açıklama yazın.</div>}
          {form.tip==="teslim"&&<>
            {etiket("SON KONTROL")}
            {secenekler.teslim_kontrol.map(m=>(
              <div key={m} style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8,padding:"5px 0",borderBottom:"1px solid var(--border)"}}>
                <span style={{fontSize:12}}>{m}</span>
                <div style={{display:"flex",gap:4,flexShrink:0}}>
                  <button onClick={()=>f("kontrol",{...form.kontrol,[m]:"tamam"})} style={secBtn(form.kontrol[m]==="tamam","#10B981")}>Tamam</button>
                  <button onClick={()=>f("kontrol",{...form.kontrol,[m]:"yok"})} style={secBtn(form.kontrol[m]==="yok","#64748B")}>Uygulanmaz</button>
                </div>
              </div>
            ))}
          </>}
          {etiket(form.tip==="kabul"?"MEVCUT HASAR VE NOTLAR":"AÇIKLAMA")}
          <textarea value={form.aciklama} onChange={e=>f("aciklama",e.target.value)} rows={2} className="inp" placeholder={form.tip==="kabul"?"Örn. sağ arka çamurlukta eski çizik":"İsteğe bağlı"} style={{resize:"vertical"}}/>
          {etiket(form.tip==="kabul"?"ARACI GETİREN":"ARACI TESLİM ALAN")}
          <input value={form.musteri_ad} onChange={e=>f("musteri_ad",e.target.value)} className="inp" placeholder="Ad soyad"/>
          {etiket(form.tip==="kabul"?"TESLİM ALAN PERSONEL":"TESLİM EDEN PERSONEL")}
          <input value={form.personel_ad} onChange={e=>f("personel_ad",e.target.value)} className="inp" placeholder="Ad soyad"/>
          <div style={{display:"flex",gap:8,marginTop:14}}>
            <button onClick={kaydet} disabled={kaydediliyor} className="btn-primary" style={{padding:"9px 16px",fontSize:12}}>{kaydediliyor?"Kaydediliyor...":form.tip==="kabul"?"Kabul tutanağını kaydet":"Teslim et ve kaydet"}</button>
            <button onClick={()=>{setForm(null);setHata("");}} style={{background:"none",border:"1px solid var(--border)",color:"var(--text-2)",borderRadius:8,padding:"9px 14px",fontSize:12}}>Vazgeç</button>
          </div>
        </div>
      ):(
        <div style={{display:"flex",flexDirection:"column",gap:16}}>
          <div>
            {baslik("Kabul",kabul?<Chip renk="#10B981" sm>✓ Dolduruldu</Chip>:<Chip renk="#64748B" sm>Yok</Chip>)}
            {kabul
              ?<TutanakOzet t={kabul} tip="kabul" bilgi={bilgi} onDuzelt={teslim?null:()=>formAc("kabul")}/>

                :<div style={{fontSize:11,color:"var(--text-2)"}}>Önce kabul tutanağı doldurulmalı.</div>}
          </div>
        </div>
      )}
    </Card>
  );
}

// ─── MÜŞTERİ TAKİP LİNKİ ──────────────────────────────────────────────────
// Admin/servis süreli link üretir; müşteri ?takip=<token> adresinden giriş yapmadan durumu görür.
// Token yalnız oluşturulduğu an döner (API özetini saklar), sonra tekrar gösterilemez.
const takipAdresi=(token)=>`${location.origin}${location.pathname}?takip=${token}`;
// "0532 111 22 33" -> "905321112233"; geçersizse ""
function waNumara(tel){
  const r=bos(tel).replace(/\D/g,"");
  if(/^905\d{9}$/.test(r))return r;
  if(/^05\d{9}$/.test(r))return "9"+r;
  if(/^5\d{9}$/.test(r))return "90"+r;
  return "";
}
function TakipLinkiPaneli({dosyaId,sahipTel,sahipAd,plaka}){
  const [linkler,setLinkler]=useState([]);const [yeni,setYeni]=useState(null);
  const [hata,setHata]=useState("");const [isleniyor,setIsleniyor]=useState(false);const [kopyalandi,setKopyalandi]=useState(false);
  const yukle=()=>apiCall(`/takip/dosya/${dosyaId}`).then(r=>setLinkler(r.linkler||[])).catch(e=>setHata(e.message));
  useEffect(()=>{setYeni(null);setHata("");yukle();},[dosyaId]);
  const olustur=async()=>{
    setIsleniyor(true);setHata("");setKopyalandi(false);
    try{const r=await apiCall(`/takip/dosya/${dosyaId}`,"POST",{gun:30});setYeni({...r,url:takipAdresi(r.token)});await yukle();}
    catch(e){setHata(e.message);}finally{setIsleniyor(false);}
  };
  const iptal=async(id)=>{
    if(!confirm("Bu link iptal edilsin mi? Müşteri bu linkle artık durumu göremez."))return;
    try{await apiCall(`/takip/dosya/${dosyaId}/${id}`,"DELETE");if(yeni?.id===id)setYeni(null);await yukle();}catch(e){setHata(e.message);}
  };
  const kopyala=async()=>{try{await navigator.clipboard.writeText(yeni.url);setKopyalandi(true);}catch(e){setHata("Kopyalanamadı, linki elle seçip kopyalayın.");}};
  const wa=waNumara(sahipTel);
  const waMetin=yeni?`Merhaba${sahipAd?" "+sahipAd.split(" ")[0]:""}, ${plaka||"aracınızın"} onarım durumunu bu linkten takip edebilirsiniz: ${yeni.url}`:"";
  const aktifler=linkler.filter(l=>l.aktif);
  return(
    <Card>
      <ST>🔗 Müşteri Takip Linki</ST>
      <div style={{fontSize:12,color:"var(--text-2)",lineHeight:1.6,marginBottom:12}}>Müşteri bu linkle giriş yapmadan onarım adımlarını, tahmini teslim tarihini ve servis iletişim bilgisini görür. Tutarlar ve iç notlar gösterilmez. Link 30 gün geçerlidir.</div>
      {hata&&<div style={{marginBottom:10}}><HataKutusu hata={hata}/></div>}
      {yeni?(
        <div style={{padding:12,background:"rgba(16,185,129,0.06)",border:"1px solid rgba(16,185,129,0.25)",borderRadius:10,marginBottom:12}}>
          <div style={{fontSize:11,color:"#10B981",fontWeight:700,marginBottom:6}}>Link hazır. Bu adres yalnız şimdi gösterilir.</div>
          <input readOnly value={yeni.url} onFocus={e=>e.target.select()} className="inp mono" style={{fontSize:11,marginBottom:8}}/>
          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
            <button onClick={kopyala} className="btn-primary" style={{padding:"7px 14px",fontSize:12}}>{kopyalandi?"✓ Kopyalandı":"Kopyala"}</button>
            {wa
              ?<a href={`https://wa.me/${wa}?text=${encodeURIComponent(waMetin)}`} target="_blank" rel="noopener noreferrer" style={{padding:"7px 14px",fontSize:12,fontWeight:700,borderRadius:8,background:"#16A34A",color:"#fff",textDecoration:"none"}}>WhatsApp ile gönder</a>
              :<span style={{fontSize:11,color:"var(--text-2)",alignSelf:"center"}}>Müşteri telefonu geçerli değil, linki elle iletin.</span>}
          </div>
        </div>
      ):(
        <button onClick={olustur} disabled={isleniyor} className="btn-primary" style={{padding:"9px 16px",fontSize:12,marginBottom:12}}>{isleniyor?"Oluşturuluyor...":"+ Yeni takip linki oluştur"}</button>
      )}
      {aktifler.length>0&&(
        <div>
          <div style={{fontSize:10,color:"var(--text-2)",fontWeight:700,letterSpacing:".6px",marginBottom:6}}>AKTİF LİNKLER ({aktifler.length})</div>
          {aktifler.map(l=>(
            <div key={l.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8,padding:"7px 0",borderTop:"1px solid var(--border)",fontSize:11}}>
              <span style={{color:"var(--text-2)"}}>{trTarihZaman(l.created_at)} · {l.olusturan_ad||(l.olusturan_rol==="servis"?"Servis":"Admin")} · son gün {trTarihZaman(l.son_gecerlilik)} · {l.erisim_sayisi} açılış</span>
              <button onClick={()=>iptal(l.id)} style={{background:"none",border:"1px solid rgba(239,68,68,0.35)",color:"#EF4444",borderRadius:6,padding:"2px 8px",fontSize:10,fontWeight:700}}>İptal et</button>
            </div>
          ))}
        </div>
      )}
    </Card>
  );
}

// Linkten token çıkarır: tam adres ya da yalnız kod yapıştırılabilir
function takipTokenAyikla(metin){
  const t=bos(metin).trim();
  const m=/[?&]takip=([A-Za-z0-9_-]{43})/.exec(t);
  if(m)return m[1];
  return /^[A-Za-z0-9_-]{43}$/.test(t)?t:"";
}
function MusteriGiris({onGeri}){
  const [metin,setMetin]=useState("");const [hata,setHata]=useState("");
  const ac=()=>{const t=takipTokenAyikla(metin);if(!t){setHata("Geçerli bir takip linki yapıştırın.");return;}location.href=takipAdresi(t);};
  return(
    <GirisKabuk ikon="👤" baslik="Araç Takibi" renk="#F59E0B" onGeri={onGeri} aciklama="Aracınızın onarım durumunu görün">
      <div style={{display:"flex",flexDirection:"column",gap:12}}>
        <div style={{padding:13,background:"rgba(245,158,11,0.07)",border:"1px solid rgba(245,158,11,0.2)",borderRadius:10,fontSize:12,color:"var(--text-2)",lineHeight:1.6}}>
          Servisiniz size WhatsApp veya mesajla bir takip linki gönderir. Linke dokunmanız yeterli, şifre gerekmez. Linki bulamıyorsanız servisinizden yenisini isteyin.
        </div>
        <div>
          <div style={{fontSize:10,color:"var(--text-2)",fontWeight:700,letterSpacing:".6px",marginBottom:6}}>TAKİP LİNKİ</div>
          <input value={metin} onChange={e=>{setMetin(e.target.value);setHata("");}} onKeyDown={e=>e.key==="Enter"&&ac()} placeholder="Linki buraya yapıştırın" className={`inp${hata?" error":""}`}/>
          {hata&&<div style={{fontSize:11,color:"var(--red)",marginTop:5}}>⚠ {hata}</div>}
        </div>
        <button onClick={ac} style={{width:"100%",background:"linear-gradient(135deg,#D97706,#B45309)",border:"none",color:"#fff",borderRadius:10,padding:13,fontSize:13,fontWeight:700}}>Durumu Göster →</button>
      </div>
    </GirisKabuk>
  );
}

// ─── MÜŞTERİ TAKİP SAYFASI (herkese açık, token ile) ─────────────────────
function TakipSayfasi({token,onCikis}){
  const [veri,setVeri]=useState(null);const [hata,setHata]=useState("");const [yukleniyor,setYukleniyor]=useState(true);
  const yukle=async()=>{
    setYukleniyor(true);setHata("");
    try{
      // Oturum tokenı gönderilmez; uç herkese açık
      const res=await fetch(`${API_URL}/takip/${encodeURIComponent(token)}`);
      const j=await res.json().catch(()=>({}));
      if(!res.ok)throw new Error(j.error||`HTTP ${res.status}`);
      setVeri(j);
    }catch(e){setHata(e instanceof TypeError?"Sunucuya ulaşılamadı":e.message);}
    finally{setYukleniyor(false);}
  };
  useEffect(()=>{yukle();},[token]);
  if(yukleniyor&&!veri)return <YuklemeEkrani metin="Aracınızın durumu yükleniyor..."/>;
  const kabuk=(icerik)=>(
    <div style={{fontFamily:"var(--font-body)",background:"var(--bg)",minHeight:"100vh",color:"var(--text-1)"}}>
      <div className="glass-header" style={{padding:"0 16px",height:56,display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:50}}>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <div style={{width:32,height:32,borderRadius:9,background:"linear-gradient(135deg,#92400E,#D97706)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16}}>🚗</div>
          <div><div style={{fontWeight:700,fontSize:14}}>HasarTrack</div><div style={{fontSize:10,color:"var(--text-2)"}}>Araç Takibi</div></div>
        </div>
        {veri&&<button onClick={yukle} disabled={yukleniyor} className="btn-primary" style={{padding:"5px 12px",fontSize:12}}>{yukleniyor?"...":"Yenile"}</button>}
      </div>
      <div style={{padding:16,maxWidth:600,margin:"0 auto",display:"flex",flexDirection:"column",gap:14}}>{icerik}</div>
    </div>
  );
  if(!veri)return kabuk(<>
    <HataKutusu hata={hata} onTekrar={hata==="Sunucuya ulaşılamadı"?yukle:null}/>
    <div style={{fontSize:12,color:"var(--text-2)",lineHeight:1.6}}>Link süresi dolmuş veya iptal edilmiş olabilir. Servisinizden yeni bir takip linki isteyin.</div>
    <button onClick={onCikis} style={{background:"none",border:"none",color:"#F59E0B",fontSize:12,textDecoration:"underline",cursor:"pointer",alignSelf:"flex-start",padding:0}}>Ana sayfaya dön</button>
  </>);
  const adimlar=veri.adimlar||[];const tamam=adimlar.filter(a=>a.durum==="tamamlandi").length;
  const pct=adimlar.length?Math.round(tamam/adimlar.length*100):0;
  const aktif=adimlar.find(a=>a.durum==="aktif");
  const baslik=veri.durum==="Tamamlandı"?"Onarım tamamlandı":veri.durum==="İptal"?"Dosya kapatıldı":aktif?aktif.ad:tamam===adimlar.length&&adimlar.length?"Tüm adımlar tamamlandı":"Dosyanız açıldı";
  const a=veri.arac||{};
  return kabuk(<>
    {hata&&<HataKutusu hata={hata}/>}
    <Card style={{background:"linear-gradient(135deg,rgba(245,158,11,0.08),rgba(245,158,11,0.02))"}}>
      <div style={{fontSize:10,color:"#F59E0B",fontWeight:700,letterSpacing:".8px",marginBottom:6}}>HOŞ GELDİNİZ</div>
      <div style={{fontWeight:800,fontSize:20,marginBottom:4}}>Merhaba{veri.sahip_ad?`, ${veri.sahip_ad}`:""}</div>
      <div style={{fontSize:13,color:"var(--text-2)",marginBottom:12}}>{[a.marka,a.model].filter(Boolean).join(" ")}{a.yil?` (${a.yil})`:""}</div>
      <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>{a.plaka&&<Chip renk="#F59E0B">{a.plaka}</Chip>}<Chip renk="var(--text-3)">{veri.dosya_no}</Chip></div>
    </Card>
    <Card style={{background:"rgba(59,130,246,0.06)",borderColor:"rgba(59,130,246,0.18)"}}>
      <div style={{fontSize:10,color:"#60A5FA",fontWeight:700,letterSpacing:".8px",marginBottom:8}}>⬤ MEVCUT DURUM</div>
      <div style={{fontWeight:800,fontSize:20,marginBottom:12}}>{baslik}</div>
      {adimlar.length>0&&<>
        <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}><span style={{fontSize:12,color:"var(--text-2)"}}>İlerleme</span><span style={{fontSize:12,fontFamily:"var(--font-mono)",color:"#60A5FA"}}>%{pct}</span></div>
        <div style={{height:8,background:"rgba(15,23,42,0.05)",borderRadius:4,overflow:"hidden"}}><div style={{height:"100%",width:`${pct}%`,borderRadius:4,background:"linear-gradient(90deg,#3B82F6,#2563EB)",transition:"width .6s ease"}}/></div>
        <div style={{fontSize:11,color:"var(--text-2)",marginTop:6}}>{tamam} / {adimlar.length} adım tamamlandı</div>
      </>}
