// ─── SERVİS PANELİ ────────────────────────────────────────────────────────
function ServisPanel({servisBilgi,onCikis}){
  const [tab,setTab]=useState("araclar");
  const [dosyalar,setDosyalar]=useState([]);
  const [listeYukleniyor,setListeYukleniyor]=useState(true);
  const [listeHata,setListeHata]=useState("");
  const [seciliId,setSeciliId]=useState(null);
  const [detay,setDetay]=useState(null);
  const [detayYukleniyor,setDetayYukleniyor]=useState(false);
  const [detayHata,setDetayHata]=useState("");
  const [adimlar,setAdimlar]=useState([]);
  const [adimHata,setAdimHata]=useState("");
  const [adimLoading,setAdimLoading]=useState(false);
  const [islemler,setIslemler]=useState([]);
  const [onayDurumu,setOnayDurumu]=useState("taslak");
  const [isEmirleri,setIsEmirleri]=useState([]);
  const [muhasebeData,setMuhasebeData]=useState({});
  const detaySeq=useRef(0);
  const [isMobile,setIsMobile]=useState(false);
  useEffect(()=>{const c=()=>setIsMobile(window.innerWidth<768);c();window.addEventListener("resize",c);return()=>window.removeEventListener("resize",c);},[]);

  const listeYukle=async(sessiz)=>{
    if(!sessiz)setListeYukleniyor(true);
    setListeHata("");
    try{const d=await apiCall("/dosyalar?limit=200");setDosyalar(esleListe(d.dosyalar));}
    catch(e){setListeHata(e.message||"Dosyalar alınamadı.");}
    finally{setListeYukleniyor(false);}
  };
  const detayYukle=async(id,sessiz)=>{
    const sira=++detaySeq.current;
    if(!sessiz)setDetayYukleniyor(true);
    setDetayHata("");
    try{
      const [d,i]=await Promise.all([apiCall(`/dosyalar/${id}`),apiCall(`/islemler/${id}`)]);
      if(sira!==detaySeq.current)return;
      const dm=esleDetay(d);
      setDetay(dm);setMuhasebeData(dm.muhasebe);
      setAdimlar((d.onarim_adimlari||[]).map(esleAdim));
      setIslemler((i.kalemler||[]).map(esleKalem));
      setOnayDurumu(i.onay_durumu||"taslak");
      setIsEmirleri(i.is_emirleri||[]);
    }catch(e){if(sira===detaySeq.current)setDetayHata(e.message||"Dosya alınamadı.");}
    finally{if(sira===detaySeq.current)setDetayYukleniyor(false);}
  };
  useEffect(()=>{listeYukle();},[]);
  const dosyaSec=(id)=>{setSeciliId(id);setDetay(null);setAdimHata("");detayYukle(id);setTab("onarim");};
  const islemApi=seciliId?islemApiOlustur(seciliId,async()=>{await detayYukle(seciliId,true);listeYukle(true);}):null;

  // Sayaçlar API listesinden hesaplanır
  const atananDosyalar=dosyalar;
  const seciliOzet=dosyalar.find(d=>d.id===seciliId);
  const aktifAdim=adimlar.find(a=>a.durum==="aktif");
  const oP=adimlar.length?Math.round((adimlar.filter(a=>a.durum==="tamamlandi").length/adimlar.length)*100):0;
  const P=isMobile?12:24;

  const adimTamamla=async(id)=>{
    if(adimLoading||!seciliId)return;
    setAdimLoading(true);setAdimHata("");
    try{
      const r=await apiCall(`/dosyalar/${seciliId}/adim/${id}/tamamla`,"POST");
      setAdimlar((r.onarim_adimlari||[]).map(esleAdim));
      listeYukle(true);
    }catch(e){setAdimHata(e.message||"Adım tamamlanamadı.");}
    finally{setAdimLoading(false);}
  };
  const TABS=[{id:"araclar",l:"Araçlar",mi:"🚗"},{id:"pano",l:"Pano",mi:"🗂️"},{id:"onarim",l:"Onarım",mi:"🔧"},{id:"stok",l:"Stok",mi:"📦"},{id:"muhasebe",l:"Muhasebe",mi:"💰"},{id:"evrak",l:"Evrak",mi:"📄"},{id:"fotolar",l:"Foto",mi:"📷"},{id:"iletisim",l:"İletişim",mi:"📞"}];

  return(
    <div style={{fontFamily:"var(--font-body)",background:"var(--bg)",minHeight:"100vh",color:"var(--text-1)",display:"flex",flexDirection:"column",paddingBottom:isMobile?64:0}}>
      <div className="glass-header" style={{padding:`0 ${P}px`,height:56,display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:50}}>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <div style={{width:32,height:32,borderRadius:9,background:"linear-gradient(135deg,#5B21B6,#7C3AED)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16}}>🔧</div>
          <div><div style={{fontWeight:700,fontSize:14}}>{servisBilgi.ad}</div><div style={{fontSize:10,color:"var(--text-2)"}}>Servis Paneli</div></div>
        </div>
        <button onClick={onCikis} className="btn-danger" style={{padding:"5px 12px"}}>Çıkış</button>
      </div>
      {!isMobile&&<div style={{background:"#FFFFFF",borderBottom:"1px solid var(--border)",padding:"0 0",display:"flex",gap:0,overflowX:"auto",WebkitOverflowScrolling:"touch"}}>{TABS.map(t=><button key={t.id} onClick={()=>setTab(t.id)} className={`nav-tab${tab===t.id?" active":""}`} style={{borderBottomColor:tab===t.id?"#8B5CF6":"transparent",padding:"12px 10px",fontSize:11,flexShrink:0}}>{t.mi} {t.l}</button>)}</div>}
      <div style={{flex:1,overflow:"auto",padding:`${isMobile?12:24}px ${P}px`}}>
        {tab==="araclar"&&(
          <div style={{display:"flex",flexDirection:"column",gap:12}}>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:4}}>
              {[{l:"Atanan Araç",v:atananDosyalar.length,c:"#8B5CF6"},{l:"Aktif Onarım",v:atananDosyalar.filter(d=>d.durum==="Aktif").length,c:"#3B82F6"}].map(k=>(
                <Card key={k.l} glow={k.c}><div style={{fontSize:9,color:"var(--text-2)",fontWeight:700,marginBottom:6}}>{k.l.toUpperCase()}</div><div style={{fontSize:26,fontWeight:800,color:k.c}}>{listeYukleniyor?"…":k.v}</div></Card>
              ))}
            </div>
            {listeHata&&<HataKutusu hata={listeHata} onTekrar={()=>listeYukle()}/>}
            {listeYukleniyor?(
              <div style={{textAlign:"center",padding:"40px 20px",color:"var(--text-2)",fontSize:13}}><span style={{animation:"pulse .8s infinite"}}>Araçlar yükleniyor...</span></div>
            ):!listeHata&&atananDosyalar.length===0?(
              <div style={{textAlign:"center",padding:"40px 20px",color:"var(--text-2)"}}>
                <div style={{fontSize:44,marginBottom:12}}>🚗</div>
                <div style={{fontWeight:700,fontSize:14}}>Henüz araç atanmadı</div>
              </div>
            ):(
              atananDosyalar.map(d=>(
                <div key={d.id} onClick={()=>dosyaSec(d.id)} style={{background:"var(--surface-2)",border:`1px solid ${seciliId===d.id?"rgba(139,92,246,0.5)":"var(--border)"}`,borderRadius:12,padding:16,cursor:"pointer",transition:"all .2s"}}
                  onMouseEnter={e=>{e.currentTarget.style.borderColor="rgba(139,92,246,0.35)";e.currentTarget.style.background="var(--surface-3)";}}
                  onMouseLeave={e=>{e.currentTarget.style.borderColor=seciliId===d.id?"rgba(139,92,246,0.5)":"var(--border)";e.currentTarget.style.background="var(--surface-2)";}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
                    <div style={{display:"flex",gap:10,alignItems:"center"}}>
                      <div style={{fontFamily:"var(--font-mono)",fontSize:11,fontWeight:600,color:"#A78BFA",background:"rgba(139,92,246,0.1)",padding:"3px 8px",borderRadius:5}}>{d.dosyaNo}</div>
                      <div style={{fontWeight:700,fontSize:14}}>{d.plaka}</div>
                    </div>
                    <Chip renk={d.durum==="Aktif"?"#3B82F6":"#10B981"} sm>{d.durum}</Chip>
                  </div>
                  <div style={{display:"flex",gap:16,flexWrap:"wrap",marginBottom:8}}>
                    <div style={{fontSize:12,color:"var(--text-2)"}}>🚗 {d.arac}</div>
                    <div style={{fontSize:12,color:"var(--text-2)"}}>👤 {d.sahip}</div>
                  </div>
                  <div style={{display:"flex",gap:8,alignItems:"center"}}>
                    <div style={{flex:1,height:4,background:"rgba(15,23,42,0.06)",borderRadius:2,overflow:"hidden"}}><div style={{height:"100%",width:`${d.ilerleme}%`,borderRadius:2,background:"linear-gradient(90deg,#8B5CF6,#6D28D9)",transition:"width .6s"}}/></div>
                    <span style={{fontSize:10,color:"var(--text-2)",fontFamily:"var(--font-mono)",flexShrink:0}}>%{d.ilerleme} · {d.aktifAdim}</span>
                  </div>
                </div>
              ))
            )}
          </div>
        )}
        {tab==="onarim"&&(
          <div style={{display:"flex",flexDirection:"column",gap:14}}>
            {!seciliId?(
              <div style={{textAlign:"center",padding:"40px 20px",color:"var(--text-2)",fontSize:13}}>Önce Araçlar sekmesinden bir araç seçin.</div>
            ):detayYukleniyor&&!detay?(
              <div style={{textAlign:"center",padding:"40px 20px",color:"var(--text-2)",fontSize:13}}><span style={{animation:"pulse .8s infinite"}}>Dosya yükleniyor...</span></div>
            ):detayHata&&!detay?(
              <HataKutusu hata={detayHata} onTekrar={()=>detayYukle(seciliId)}/>
            ):(
              <>
                <div style={{fontSize:11,color:"var(--text-2)"}}>Seçili dosya: <strong style={{color:"#A78BFA",fontFamily:"var(--font-mono)"}}>{detay?.dosyaNo||seciliOzet?.dosyaNo}</strong> · {detay?.arac?.plaka}</div>
                {adimHata&&<HataKutusu hata={adimHata}/>}
                {aktifAdim&&(
                  <Card style={{background:"rgba(139,92,246,0.06)",borderColor:"rgba(139,92,246,0.22)"}}>
                    <div style={{fontSize:10,color:"#A78BFA",fontWeight:700,letterSpacing:".8px",marginBottom:6}}>⬤ AKTİF ADIM</div>
                    <div style={{fontWeight:800,fontSize:17,marginBottom:6}}>{aktifAdim.ad}</div>
                    <div style={{fontSize:12,color:"var(--text-2)",lineHeight:1.6,marginBottom:14}}>{aktifAdim.not||"Bu adım için servis işlem yapmalıdır."}</div>
                    <button onClick={()=>adimTamamla(aktifAdim.id)} disabled={adimLoading} style={{background:"linear-gradient(135deg,#7C3AED,#6D28D9)",border:"none",color:"#fff",borderRadius:8,padding:"10px 18px",fontSize:12,fontWeight:700,boxShadow:"0 2px 8px rgba(109,40,217,0.3)"}}>{adimLoading?"Kaydediliyor...":"✓ Adımı Tamamla"}</button>
                  </Card>
                )}
                <Card>
                  <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}><span style={{fontSize:12,color:"var(--text-2)"}}>İlerleme</span><span style={{fontSize:12,fontFamily:"var(--font-mono)",color:"#A78BFA"}}>%{oP}</span></div>
                  <div style={{height:6,background:"rgba(15,23,42,0.05)",borderRadius:3,marginBottom:20,overflow:"hidden"}}><div style={{height:"100%",width:`${oP}%`,borderRadius:3,background:"linear-gradient(90deg,#8B5CF6,#6D28D9)",transition:"width .6s"}}/></div>
                  <OnarimTimeline adimlar={adimlar} onTamamla={adimTamamla}/>
                </Card>
                <IsEmriPaneli dosyaId={seciliId} yenileAnahtar={isEmirleri.map(x=>x.onay_durumu).join()} onDegisti={()=>{detayYukle(seciliId,true);listeYukle(true);}}/>
              </>
            )}
          </div>
        )}
        {tab==="pano"&&<BolumPanosu onDosyaAc={dosyaSec}/>}

// ─── SERVİS GİRİŞ HESABI (Admin) ─────────────────────────────────────────
// Hesap yoksa e-posta + şifreyle açar, varsa şifreyi yeniler
function GirisHesabiKarti({servis,onKaydedildi}){
  const hesapVar=!!servis.kullanici_email;
  const [email,setEmail]=useState("");
  const [sifre,setSifre]=useState("");
  const [kaydediliyor,setKaydediliyor]=useState(false);
  const [mesaj,setMesaj]=useState(null); // {tip:"ok"|"hata",metin}
  const inp={width:"100%",background:"var(--surface-1)",border:"1px solid var(--border-md)",borderRadius:8,padding:"8px 10px",fontSize:12,color:"var(--text-1)",boxSizing:"border-box"};
  const kaydet=async()=>{
    setMesaj(null);
    if(sifre.length<8){setMesaj({tip:"hata",metin:"Şifre en az 8 karakter olmalı."});return;}
    if(!hesapVar&&!email.trim()){setMesaj({tip:"hata",metin:"Giriş e-postası gerekli."});return;}
    setKaydediliyor(true);
    try{
      await apiCall(`/servisler/${servis.id}`,"PATCH",hesapVar?{sifre}:{sifre,kullanici_email:email.trim()});
      setSifre("");setEmail("");
      setMesaj({tip:"ok",metin:hesapVar?"Şifre güncellendi.":"Giriş hesabı açıldı."});
      onKaydedildi&&onKaydedildi();
    }catch(e){setMesaj({tip:"hata",metin:e.message||"Kaydedilemedi."});}
    finally{setKaydediliyor(false);}
  };
  return(
    <div style={{background:"var(--surface-2)",border:"1px solid var(--border)",borderRadius:12,padding:"14px 16px",marginBottom:24}}>
      <ST>Giriş Hesabı</ST>
      <div style={{fontSize:12,color:"var(--text-2)",marginBottom:10}}>
        {hesapVar?<>Giriş e-postası: <b style={{color:"var(--text-1)"}}>{servis.kullanici_email}</b></>:"Bu servisin giriş hesabı yok. E-posta ve şifre girerek açabilirsin."}
      </div>
      <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
        {!hesapVar&&<input type="email" placeholder="Giriş e-postası" value={email} onChange={e=>setEmail(e.target.value)} style={{...inp,flex:"1 1 200px",width:"auto"}}/>}
        <input type="password" placeholder={hesapVar?"Yeni şifre (en az 8)":"Şifre (en az 8)"} value={sifre} onChange={e=>setSifre(e.target.value)} style={{...inp,flex:"1 1 160px",width:"auto"}}/>
        <button onClick={kaydet} disabled={kaydediliyor} style={{background:"#4F46E5",color:"#fff",border:"none",borderRadius:8,padding:"8px 14px",fontSize:12,fontWeight:700,opacity:kaydediliyor?.6:1}}>
          {kaydediliyor?"Kaydediliyor...":hesapVar?"Şifreyi Güncelle":"Hesap Aç"}
        </button>
      </div>
      {mesaj&&<div style={{fontSize:12,marginTop:8,color:mesaj.tip==="ok"?"#10B981":"#EF4444"}}>{mesaj.metin}</div>}
    </div>
  );
}

// ─── SERVİS DETAY (Admin Görünümü) ────────────────────────────────────────
function ServisDetayAdmin({servisId, onGeri}){
  const [acikDosya,setAcikDosya]=useState(null);
  const [isMobile,setIsMobile]=useState(false);
  const [servis,setServis]=useState(null);
  const [dosyalar,setDosyalar]=useState([]);
  const [islemVeri,setIslemVeri]=useState({}); // dosyaId -> {onayDurumu,kalemler}
  const [yukleniyor,setYukleniyor]=useState(true);
  const [hata,setHata]=useState("");
  useEffect(()=>{const c=()=>setIsMobile(window.innerWidth<768);c();window.addEventListener("resize",c);return()=>window.removeEventListener("resize",c);},[]);

  const yukle=async()=>{
    setYukleniyor(true);setHata("");
    try{
      const [sl,dl]=await Promise.all([
        apiCall("/servisler"),
        apiCall(`/dosyalar?servis_id=${encodeURIComponent(servisId)}&limit=200`),
      ]);
      const s=(sl.servisler||[]).find(x=>x.id===servisId);
      if(!s)throw new Error("Servis bulunamadı");
      const liste=esleListe(dl.dosyalar);
      const iv={};
      await Promise.all(liste.map(async d=>{
        const r=await apiCall(`/islemler/${d.id}`);
        iv[d.id]={onayDurumu:r.onay_durumu||"taslak",kalemler:(r.kalemler||[]).map(esleKalem)};
      }));
      setServis(s);setDosyalar(liste);setIslemVeri(iv);
    }catch(e){setHata(e.message||"Servis bilgileri alınamadı.");}
    finally{setYukleniyor(false);}
  };
  useEffect(()=>{yukle();},[servisId]);
  const P=isMobile?12:24;
  const kalemler=(id)=>(islemVeri[id]?.kalemler||[]);
  const toplamFatura=dosyalar.reduce((sum,d)=>sum+kalemler(d.id).reduce((s,k)=>s+k.birimFiyat*k.miktar,0),0);
  const onaylananToplam=dosyalar.reduce((sum,d)=>sum+kalemler(d.id).filter(k=>k.durum==="onaylandi").reduce((s,k)=>s+k.birimFiyat*k.miktar,0),0);
  const bekleyenOnay=dosyalar.filter(d=>islemVeri[d.id]?.onayDurumu==="bekliyor").length;

  const DURUM_BADGE={
    taslak:    {l:"Taslak",         c:"var(--text-3)",bg:"rgba(100,116,139,0.12)"},
    bekliyor:  {l:"⏳ Onay Bekliyor",c:"#F59E0B",bg:"rgba(245,158,11,0.12)"},
    onaylandi: {l:"✓ Onaylandı",    c:"#10B981",bg:"rgba(16,185,129,0.12)"},
    reddedildi:{l:"✕ Reddedildi",   c:"#EF4444",bg:"rgba(239,68,68,0.12)"},
  };

  if(yukleniyor)return <YuklemeEkrani metin="Servis bilgileri yükleniyor..."/>;
  if(hata||!servis)return(
    <div style={{fontFamily:"'Inter',sans-serif",background:"var(--bg)",minHeight:"100vh",color:"var(--text-1)",padding:24}}>
      <button onClick={onGeri} style={{background:"var(--border)",border:"1px solid var(--border-md)",color:"var(--text-2)",borderRadius:7,padding:"5px 12px",fontSize:11,fontWeight:600,marginBottom:16}}>← Geri</button>
      <HataKutusu hata={hata||"Servis bulunamadı"} onTekrar={yukle}/>
    </div>
  );

  return(
    <div style={{fontFamily:"'Inter',sans-serif",background:"var(--bg)",minHeight:"100vh",color:"var(--text-1)"}}>
      {/* Header */}
      <div style={{background:"var(--surface-1)",borderBottom:"1px solid rgba(255,255,255,0.07)",padding:`0 ${P}px`,height:56,display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:50}}>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <button onClick={onGeri} style={{background:"var(--border)",border:"1px solid var(--border-md)",color:"var(--text-2)",borderRadius:7,padding:"5px 12px",fontSize:11,fontWeight:600}}>← Geri</button>
          <div style={{width:32,height:32,borderRadius:8,background:"linear-gradient(135deg,#5B21B6,#8B5CF6)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16}}>🔧</div>
          <div>
            <div style={{fontWeight:800,fontSize:14}}>{servis.ad}</div>
            <div style={{fontSize:10,color:"var(--text-2)"}}>{servis.adres}</div>
          </div>
        </div>
        {bekleyenOnay>0&&(
          <div style={{display:"flex",alignItems:"center",gap:6,background:"rgba(245,158,11,0.12)",border:"1px solid rgba(245,158,11,0.3)",borderRadius:8,padding:"5px 12px"}}>
            <span style={{fontSize:16}}>⏳</span>
            <span style={{fontSize:12,fontWeight:700,color:"#F59E0B"}}>{bekleyenOnay} Onay Bekliyor</span>
          </div>
        )}
      </div>

      <div style={{maxWidth:860,margin:"0 auto",padding:`${isMobile?16:32}px ${P}px`}}>

        {/* Servis özet kartları */}
        <div style={{display:"grid",gridTemplateColumns:isMobile?"1fr 1fr":"repeat(4,1fr)",gap:10,marginBottom:24}}>
          {[
            {l:"Toplam Araç",     v:dosyalar.length,                                   c:"#8B5CF6"},
            {l:"Bekleyen Onay",   v:bekleyenOnay,                                       c:bekleyenOnay>0?"#F59E0B":"var(--text-3)"},
            {l:"Toplam Fatura",   v:`${toplamFatura.toLocaleString("tr-TR")} ₺`,        c:"#EF4444"},
            {l:"Onaylanan Tutar", v:`${onaylananToplam.toLocaleString("tr-TR")} ₺`,     c:"#10B981"},
          ].map(k=>(
            <div key={k.l} style={{background:"var(--surface-2)",border:"1px solid var(--border)",borderRadius:12,padding:"12px 14px"}}>
              <div style={{fontSize:9,color:"var(--text-2)",fontWeight:700,marginBottom:5}}>{k.l.toUpperCase()}</div>
              <div style={{fontSize:isMobile?16:22,fontWeight:800,color:k.c}}>{k.v}</div>
            </div>
          ))}
        </div>

        <GirisHesabiKarti servis={servis} onKaydedildi={yukle}/>

        {/* Her dosya için kart */}
        {dosyalar.length===0?(
          <div style={{textAlign:"center",padding:"40px 20px",color:"rgba(15,23,42,0.06)"}}>
            <div style={{fontSize:44,marginBottom:12}}>🚗</div>
            <div style={{fontWeight:700,fontSize:14}}>Bu servise atanmış araç yok</div>
          </div>
        ):(
          <div style={{display:"flex",flexDirection:"column",gap:12}}>
            {dosyalar.map(d=>{
              const islVeri=islemVeri[d.id]||{onayDurumu:"taslak",kalemler:[]};
              const badge=DURUM_BADGE[islVeri.onayDurumu]||DURUM_BADGE.taslak;
              const toplamD=islVeri.kalemler.reduce((s,k)=>s+k.birimFiyat*k.miktar,0);
              const onaylananD=islVeri.kalemler.filter(k=>k.durum==="onaylandi").reduce((s,k)=>s+k.birimFiyat*k.miktar,0);
              const acik=acikDosya===d.id;
              const dc=d.durum==="Aktif"?"#4F46E5":"#10B981";

              return(
                <div key={d.id} style={{background:"var(--surface-2)",border:`1px solid ${acik?"rgba(139,92,246,0.35)":"var(--border)"}`,borderRadius:14,overflow:"hidden"}}>

                      </div>
                      <div style={{display:"flex",gap:16,flexWrap:"wrap"}}>

                        <span style={{fontSize:12,color:"var(--text-2)"}}>👤 {d.sahip}</span>

// ─── ADMIN DASHBOARD ───────────────────────────────────────────────────────
function AdminDashboard({onDosyaSec,onYeniDosya,onCikis,onServisDetay}){

  const [durumFiltre,setDurumFiltre]=useState("");
  const [isMobile,setIsMobile]=useState(false);
  const [dosyalar,setDosyalar]=useState([]);
  const [toplamSonuc,setToplamSonuc]=useState(0);
  const [listeYukleniyor,setListeYukleniyor]=useState(true);
  const [listeHata,setListeHata]=useState("");
  const [ozet,setOzet]=useState(null);
  const [servisler,setServisler]=useState([]);
  const [ozetHata,setOzetHata]=useState("");
  const [yenile,setYenile]=useState(0);
  const listeSeq=useRef(0);
  useEffect(()=>{const c=()=>setIsMobile(window.innerWidth<768);c();window.addEventListener("resize",c);return()=>window.removeEventListener("resize",c);},[]);
  const P=isMobile?14:24;

  // Liste: arama 300 ms gecikmeli, durum filtresi API'ye gider
  useEffect(()=>{
    const sira=++listeSeq.current;
    setListeYukleniyor(true);setListeHata("");
    const t=setTimeout(async()=>{
      try{
        const q=new URLSearchParams({limit:"100"});
        if(arama.trim())q.set("arama",arama.trim());
        if(durumFiltre)q.set("durum",durumFiltre);
        const d=await apiCall(`/dosyalar?${q.toString()}`);
        if(sira!==listeSeq.current)return;
        setDosyalar(esleListe(d.dosyalar));setToplamSonuc(d.toplam||0);
      }catch(e){if(sira===listeSeq.current)setListeHata(e.message||"Dosyalar alınamadı.");}
      finally{if(sira===listeSeq.current)setListeYukleniyor(false);}
    },arama.trim()?300:0);
    return()=>clearTimeout(t);
  },[arama,durumFiltre,yenile]);

  // Sayaçlar ve servis kartları
  const ozetYukle=async()=>{
    setOzetHata("");
    try{
      const [o,s]=await Promise.all([apiCall("/raporlar/ozet"),apiCall("/servisler")]);
      setOzet(o);setServisler(s.servisler||[]);
    }catch(e){setOzetHata(e.message||"Özet alınamadı.");}
  };

  const filtreli=dosyalar;

        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <div style={{width:36,height:36,borderRadius:9,background:"linear-gradient(135deg,#1D4ED8,#2563EB)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:18}}>🛡️</div>
          <div><div style={{fontWeight:800,fontSize:15}}>HasarTrack</div><div style={{fontSize:10,color:"var(--text-2)"}}>Hasar Admin Paneli</div></div>
        </div>

          <div style={{position:"absolute",left:16,top:"50%",transform:"translateY(-50%)",fontSize:18,pointerEvents:"none"}}>🔍</div>

          {arama&&<button onClick={()=>setArama("")} style={{position:"absolute",right:14,top:"50%",transform:"translateY(-50%)",background:"var(--border-md)",border:"none",color:"var(--text-2)",borderRadius:"50%",width:26,height:26,fontSize:14,display:"flex",alignItems:"center",justifyContent:"center"}}>×</button>}
        </div>
        <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:14}}>
          {[["","Tümü"],["Aktif","Aktif"],["Tamamlandı","Tamamlandı"],["Askıda","Askıda"],["İptal","İptal"]].map(([v,l])=><button key={v||"tumu"} onClick={()=>setDurumFiltre(v)} style={{padding:"5px 12px",borderRadius:20,border:`1px solid ${durumFiltre===v?"rgba(79,70,229,0.5)":"var(--border-md)"}`,background:durumFiltre===v?"rgba(79,70,229,0.12)":"var(--surface-2)",color:durumFiltre===v?"#818CF8":"var(--text-2)",fontSize:11,fontWeight:700}}>{l}</button>)}
        </div>
        <button onClick={onYeniDosya} style={{width:"100%",background:"linear-gradient(135deg,rgba(59,130,246,0.12),rgba(59,130,246,0.04))",border:"2px dashed rgba(59,130,246,0.35)",borderRadius:14,padding:18,fontSize:14,fontWeight:700,color:"#60A5FA",marginBottom:24,display:"flex",alignItems:"center",justifyContent:"center",gap:10,transition:"all .2s"}} onMouseEnter={e=>{e.currentTarget.style.borderColor="rgba(59,130,246,0.6)";e.currentTarget.style.background="linear-gradient(135deg,rgba(59,130,246,0.18),rgba(59,130,246,0.08))";}} onMouseLeave={e=>{e.currentTarget.style.borderColor="rgba(59,130,246,0.35)";e.currentTarget.style.background="linear-gradient(135deg,rgba(59,130,246,0.12),rgba(59,130,246,0.04))";}}>
          <div style={{width:32,height:32,borderRadius:8,background:"rgba(79,70,229,0.2)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:18}}>+</div>
          Yeni Hasar Dosyası Oluştur
        </button>
        {!aktifFiltre&&(
          <>
            {ozetHata&&<div style={{marginBottom:12}}><HataKutusu hata={ozetHata} onTekrar={ozetYukle}/></div>}
            <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10,marginBottom:16}}>
              {[{l:"Toplam",v:ozet?Number(ozet.toplam_dosya):"…",c:"#818CF8"},{l:"Aktif",v:ozet?Number(ozet.aktif_dosya):"…",c:"#4F46E5"},{l:"Servissiz",v:ozet?Number(ozet.servissiz):"…",c:"#F59E0B"}].map(k=><Card key={k.l}><div style={{fontSize:9,color:"var(--text-2)",fontWeight:700,marginBottom:6}}>{k.l.toUpperCase()}</div><div style={{fontSize:26,fontWeight:800,color:k.c}}>{k.v}</div></Card>)}
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:14,marginBottom:16}}>
              <BekleyenOnaylar onDosyaAc={onDosyaSec}/>
              <BolumPanosu onDosyaAc={onDosyaSec}/>
            </div>
            <div style={{marginBottom:20}}>
              <div style={{fontSize:12,color:"var(--text-2)",fontWeight:600,marginBottom:10,letterSpacing:"0.5px"}}>SERVİSLER</div>
              <div style={{display:"grid",gridTemplateColumns:isMobile?"1fr":"repeat(3,1fr)",gap:8}}>
                {servisler.map(srv=>{
                  const so=servisOzet(srv.id);
                  const srvDosyalar={length:Number(so.dosya_sayisi)||0};
                  const bekleyen=Number(so.bekleyen_onay)||0;
                  const toplam=Number(so.toplam_muallak)||0;
                  return(
                    <button key={srv.id} onClick={()=>onServisDetay(srv.id)} style={{background:"var(--surface-2)",border:`1px solid ${bekleyen>0?"rgba(245,158,11,0.35)":"rgba(139,92,246,0.2)"}`,borderRadius:12,padding:"12px 14px",textAlign:"left",display:"flex",gap:10,alignItems:"flex-start"}}>
                      <div style={{width:36,height:36,borderRadius:9,background:"rgba(139,92,246,0.15)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,flexShrink:0}}>🔧</div>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontWeight:700,fontSize:12,color:"#C4B5FD",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",marginBottom:4}}>{srv.ad}</div>
                        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                          <span style={{fontSize:10,color:"var(--text-2)"}}>{srvDosyalar.length} araç</span>
                          {toplam>0&&<span style={{fontSize:10,color:"#EF4444",fontWeight:600}}>{toplam.toLocaleString("tr-TR")} ₺</span>}
                          {bekleyen>0&&<span style={{fontSize:9,fontWeight:700,padding:"1px 6px",borderRadius:4,background:"rgba(245,158,11,0.15)",color:"#F59E0B",border:"1px solid rgba(245,158,11,0.3)"}}>{bekleyen} onay</span>}
                        </div>
                      </div>
                      <span style={{color:"#8B5CF6",fontSize:16,flexShrink:0}}>›</span>
                    </button>
                  );
                })}
              </div>
            </div>
          </>
        )}
        <div style={{fontSize:12,color:"var(--text-2)",fontWeight:600,marginBottom:12,letterSpacing:"0.5px"}}>{aktifFiltre?`${toplamSonuc} sonuç${arama?` ("${arama}")`:""}`:"SON DOSYALAR"}</div>
        {listeHata?(
          <HataKutusu hata={listeHata} onTekrar={()=>setYenile(n=>n+1)}/>
        ):listeYukleniyor&&filtreli.length===0?(
          <div style={{textAlign:"center",padding:"40px 20px",color:"var(--text-2)",fontSize:13}}><span style={{animation:"pulse .8s infinite"}}>Dosyalar yükleniyor...</span></div>
        ):filtreli.length===0?(
          <div style={{textAlign:"center",padding:"40px 20px",color:"rgba(15,23,42,0.06)"}}>
            <div style={{fontSize:44,marginBottom:12}}>🔎</div>
            <div style={{fontWeight:700,fontSize:14,marginBottom:6}}>Sonuç bulunamadı</div>
            <button onClick={onYeniDosya} style={{marginTop:16,background:"rgba(79,70,229,0.15)",border:"1px solid rgba(79,70,229,0.3)",color:"#818CF8",borderRadius:9,padding:"10px 20px",fontSize:13,fontWeight:700}}>Yeni Dosya Oluştur</button>
          </div>
        ):(
          <div style={{display:"flex",flexDirection:"column",gap:10}}>
            {filtreli.map(d=>{
              const dc=dRenk[d.durum]||"var(--text-3)";
              const srv=d.atananServis?{ad:d.servisAd||"Servis"}:null;
              return(
                <div key={d.id} onClick={()=>onDosyaSec(d.id)} style={{background:"var(--surface-2)",border:"1px solid var(--border)",borderRadius:12,padding:16,cursor:"pointer"}}
                  onMouseEnter={e=>{e.currentTarget.style.background="#1a2030";e.currentTarget.style.borderColor="rgba(79,70,229,0.3)";}}
                  onMouseLeave={e=>{e.currentTarget.style.background="var(--surface-2)";e.currentTarget.style.borderColor="var(--border)";}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
                    <div style={{display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}>
                      <div style={{fontFamily:"var(--font-mono)",fontSize:12,fontWeight:700,color:"#818CF8",background:"rgba(79,70,229,0.12)",padding:"3px 9px",borderRadius:5}}>{d.dosyaNo}</div>
                      <div style={{fontWeight:800,fontSize:14}}>{d.plaka}</div>
                    </div>
                    <div style={{display:"flex",gap:6,alignItems:"center",flexShrink:0}}>
                      <Chip renk={dc} sm>{d.durum}</Chip>
                      <span style={{color:"var(--text-2)",fontSize:16}}>›</span>
                    </div>
                  </div>
                  <div style={{display:"flex",gap:isMobile?10:16,flexWrap:"wrap",marginBottom:8}}>
                    <div style={{fontSize:12,color:"var(--text-2)"}}>🚗 {d.arac}</div>
                    <div style={{fontSize:12,color:"var(--text-2)"}}>👤 {d.sahip}</div>
                    <div style={{fontSize:12,color:"var(--text-2)"}}>🏦 {d.sigorta}</div>
                    <div style={{fontSize:12,color:"#F59E0B",fontWeight:600}}>💰 {d.muallakHasar}</div>
                  </div>
                  {srv?(
                    <div style={{display:"inline-flex",alignItems:"center",gap:5,padding:"3px 8px",background:"rgba(139,92,246,0.12)",border:"1px solid rgba(139,92,246,0.25)",borderRadius:6,fontSize:10,color:"#A78BFA",fontWeight:600,marginBottom:8}}>🔧 {srv.ad}</div>
                  ):(
                    <div style={{display:"inline-flex",alignItems:"center",gap:5,padding:"3px 8px",background:"rgba(245,158,11,0.1)",border:"1px solid rgba(245,158,11,0.25)",borderRadius:6,fontSize:10,color:"#F59E0B",fontWeight:600,marginBottom:8}}>⚠ Servis atanmadı</div>
                  )}
                  <div style={{display:"flex",gap:8,alignItems:"center"}}>
                    <div style={{flex:1,height:4,background:"var(--border)",borderRadius:2}}><div style={{height:"100%",width:`${d.ilerleme}%`,borderRadius:2,background:`linear-gradient(90deg,${dc},${dc}80)`}}/></div>
                    <span style={{fontSize:10,color:"var(--text-2)",fontFamily:"var(--font-mono)",flexShrink:0}}>%{d.ilerleme} · {d.aktifAdim}</span>
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </div>
    </div>
  );
}

// ─── YENİ DOSYA SİHİRBAZI ─────────────────────────────────────────────────
function YeniDosyaWizard({onKapat,onKaydet}){
  const [adim,setAdim]=useState(1);
  const [ruhsatImg,setRuhsatImg]=useState(null);
  const [tarama,setTarama]=useState(false);
  const [taramaOk,setTaramaOk]=useState(false);
  const [taramaHata,setTaramaHata]=useState(false);
  const [belgeler,setBelgeler]=useState([]);
  const [fotograflar,setFotograflar]=useState([]);
  const [kayitOk,setKayitOk]=useState(false);
  const [isMobile,setIsMobile]=useState(false);
  const ruhsatRef=useRef();const belgeRef=useRef();const fotoRef=useRef();
  useEffect(()=>{const c=()=>setIsMobile(window.innerWidth<768);c();window.addEventListener("resize",c);return()=>window.removeEventListener("resize",c);},[]);
  const [form,setForm]=useState({plaka:"",saseNo:"",motorNo:"",marka:"",model:"",yil:"",ruhsatSeriNo:"",renk:"",sahipAd:"",tc:"",telefon:"",email:"",acente:"",sigortaSirketi:"",bransi:"",muallakHasar:"",policeNo:"",hasarNo:"",teminat:"",muafiyet:"",kazaTarihi:"",kazaAciklama:""});
  const sf=(k,v)=>setForm(p=>({...p,[k]:v}));
  const handleRuhsat=(files)=>{const f=files[0];if(!f)return;const r=new FileReader();r.onload=e=>{setRuhsatImg(e.target.result);setTaramaOk(false);};r.readAsDataURL(f);};
  const handleBelge=(files)=>Array.from(files).forEach(f=>{const r=new FileReader();r.onload=e=>setBelgeler(p=>[...p,{id:Date.now()+Math.random(),ad:f.name,url:e.target.result,boyut:(f.size/1048576).toFixed(1)+" MB"}]);r.readAsDataURL(f);});
  const handleFoto=(files)=>Array.from(files).filter(f=>f.type.startsWith("image/")).forEach(f=>{const r=new FileReader();r.onload=e=>setFotograflar(p=>[...p,{id:Date.now()+Math.random(),url:e.target.result,etiket:f.name.replace(/\.[^.]+$/,""),kategori:"kaza",tarih:new Date().toLocaleDateString("tr-TR"),yukleyen:"Admin",boyut:(f.size/1048576).toFixed(1)+" MB"}]);r.readAsDataURL(f);});
  const [kaydediliyor,setKaydediliyor]=useState(false);
  const [kayitHata,setKayitHata]=useState("");
  const kaydet=async()=>{
    if(kaydediliyor)return;
    setKayitHata("");
    let govde;
    try{govde=esleWizard(form);}catch(e){setKayitHata(e.message);return;}
    setKaydediliyor(true);
    try{
      const d=await apiCall("/dosyalar","POST",govde);
      setKayitOk(true);
      setTimeout(()=>onKaydet({id:d.id,dosyaNo:d.dosya_no}),1200);
    }catch(e){setKayitHata(e.message||"Dosya kaydedilemedi.");}
    finally{setKaydediliyor(false);}
  };
  const ADIMLAR=[{n:1,l:"Ruhsat",i:"📄"},{n:2,l:"Araç & Müşteri",i:"🚗"},{n:3,l:"Sigorta & Kaza",i:"🏦"},{n:4,l:"Belgeler",i:"📎"},{n:5,l:"Özet",i:"✅"}];
  const inp=(k,p,mono)=><input type="text" value={form[k]} onChange={e=>sf(k,e.target.value)} placeholder={p} style={{width:"100%",background:"rgba(15,23,42,0.05)",border:"1px solid var(--border-md)",borderRadius:9,color:"var(--text-1)",padding:"10px 13px",fontSize:13,fontFamily:mono?"var(--font-mono)":"inherit"}}/>;
  const lbl=(t,required)=><div style={{fontSize:11,color:required?"#F59E0B":"var(--text-3)",fontWeight:600,marginBottom:5,marginTop:10,display:"flex",alignItems:"center",gap:5}}>{t}{required&&<span style={{fontSize:9,color:"#EF4444"}}>✱ Zorunlu</span>}</div>;
  const g2={display:"grid",gridTemplateColumns:isMobile?"1fr":"1fr 1fr",gap:"0 14px"};
  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.75)",zIndex:200,display:"flex",alignItems:"flex-start",justifyContent:"center",padding:isMobile?0:24,overflowY:"auto"}}>
      <div style={{background:"var(--bg)",border:"1px solid var(--border-md)",borderRadius:isMobile?0:16,width:"100%",maxWidth:680,minHeight:isMobile?"100vh":"auto",display:"flex",flexDirection:"column",animation:"popIn .25s ease"}}>
        <div style={{background:"var(--surface-1)",borderBottom:"1px solid rgba(255,255,255,0.07)",borderRadius:isMobile?"0":"16px 16px 0 0",padding:"16px 20px",display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:10}}>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <div style={{width:34,height:34,borderRadius:8,background:"linear-gradient(135deg,#1D4ED8,#2563EB)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16}}>📁</div>
            <div><div style={{fontWeight:800,fontSize:15}}>Yeni Hasar Dosyası</div><div style={{fontSize:11,color:"var(--text-2)"}}>Adım {adim} / 5</div></div>
          </div>
          <button onClick={onKapat} style={{background:"var(--border)",border:"1px solid var(--border-md)",color:"var(--text-2)",borderRadius:"50%",width:32,height:32,fontSize:18,display:"flex",alignItems:"center",justifyContent:"center"}}>×</button>
        </div>
        <div style={{padding:"12px 20px",background:"var(--surface-1)",borderBottom:"1px solid rgba(255,255,255,0.05)",display:"flex",gap:4}}>
          {ADIMLAR.map(a=><div key={a.n} onClick={()=>a.n<adim&&setAdim(a.n)} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:4,cursor:a.n<adim?"pointer":"default"}}>
            <div style={{width:"100%",height:3,borderRadius:2,background:adim>=a.n?"#4F46E5":"var(--border-md)"}}/>
            <div style={{fontSize:9,color:adim===a.n?"#818CF8":adim>a.n?"#10B981":"rgba(15,23,42,0.06)",fontWeight:adim===a.n?700:500,textAlign:"center",whiteSpace:"nowrap"}}>{isMobile?a.i:`${a.i} ${a.l}`}</div>
          </div>)}
        </div>
        <div style={{flex:1,overflow:"auto",padding:20}}>
          {adim===1&&(
            <div style={{display:"flex",flexDirection:"column",gap:14}}>
              <div style={{padding:"12px 16px",background:"rgba(79,70,229,0.07)",border:"1px solid rgba(79,70,229,0.2)",borderRadius:10,fontSize:13,color:"var(--text-2)",lineHeight:1.7}}>📄 <strong style={{color:"#818CF8"}}>Ruhsat okuma kapalı</strong> — Bilgileri elle girin. Ruhsat fotoğrafı yalnız önizleme içindir, kaydedilmez.</div>
              <div onClick={()=>ruhsatRef.current?.click()} onDragOver={e=>e.preventDefault()} onDrop={e=>{e.preventDefault();handleRuhsat(e.dataTransfer.files);}} style={{border:`2px dashed ${ruhsatImg?"rgba(79,70,229,0.5)":"rgba(15,23,42,0.15)"}`,borderRadius:12,padding:ruhsatImg?"0":"32px",textAlign:"center",cursor:"pointer",background:ruhsatImg?"var(--bg)":"rgba(15,23,42,0.02)",position:"relative",overflow:"hidden",minHeight:180}}>
                <input ref={ruhsatRef} type="file" accept="image/*" onChange={e=>handleRuhsat(e.target.files)} style={{display:"none"}}/>
                {ruhsatImg?(
                  <div>
                    <img src={ruhsatImg} alt="Ruhsat" style={{width:"100%",maxHeight:260,objectFit:"contain",display:"block",borderRadius:10}}/>
                    <div style={{position:"absolute",top:8,right:8}}><button onClick={e=>{e.stopPropagation();setRuhsatImg(null);setTaramaOk(false);}} style={{background:"rgba(239,68,68,0.85)",border:"none",color:"#fff",borderRadius:6,padding:"4px 10px",fontSize:11,fontWeight:700}}>✕ Kaldır</button></div>
                    {taramaOk&&<div style={{position:"absolute",top:8,left:8,background:"rgba(16,185,129,0.9)",color:"#fff",borderRadius:6,padding:"4px 10px",fontSize:11,fontWeight:700}}>✓ Veriler çekildi</div>}
                  </div>
                ):(
                  <div>
                    <div style={{fontSize:48,marginBottom:12}}>📄</div>
                    <div style={{fontWeight:700,fontSize:14,color:"#818CF8",marginBottom:6}}>Ruhsat fotoğrafını sürükleyin</div>
                    <div style={{fontSize:12,color:"var(--text-2)",marginBottom:16}}>veya tıklayarak seçin · JPG, PNG</div>
                    <button style={{background:"rgba(79,70,229,0.2)",border:"1px solid rgba(79,70,229,0.4)",color:"#818CF8",borderRadius:9,padding:"10px 20px",fontSize:13,fontWeight:700}}>📷 Fotoğraf Seç</button>
                  </div>
                )}
              </div>
              {ruhsatImg&&<button disabled style={{background:"rgba(79,70,229,0.25)",border:"none",color:"#fff",borderRadius:10,padding:14,fontSize:14,fontWeight:800,cursor:"not-allowed"}}>Ruhsat okuma kapalı, bilgileri elle girin</button>}
                            {taramaOk&&<div style={{padding:"12px 16px",background:"rgba(16,185,129,0.07)",border:"1px solid rgba(16,185,129,0.25)",borderRadius:10}}>
                <div style={{fontWeight:700,fontSize:13,color:"#10B981",marginBottom:10}}>✓ Otomatik Çekilen Veriler</div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>{[["Plaka",form.plaka],["Sahip",form.sahipAd],["TC / Vergi No",form.tc],["Marka",form.marka],["Model",form.model],["Yıl",form.yil],["Şase No",form.saseNo],["Motor No",form.motorNo],["Ruhsat Seri No",form.ruhsatSeriNo],["Renk",form.renk]].filter(r=>r[1]).map(r=><div key={r[0]} style={{background:"var(--surface-3)",borderRadius:7,padding:"7px 10px"}}><div style={{fontSize:9,color:"var(--text-2)",fontWeight:600}}>{r[0]}</div><div style={{fontSize:12,fontWeight:600,color:"var(--text-1)"}}>{r[1]}</div></div>)}</div>
              </div>}
              <div style={{padding:"10px 14px",background:"rgba(15,23,42,0.02)",border:"1px solid var(--border)",borderRadius:9,fontSize:11,color:"var(--text-2)",textAlign:"center"}}>Ruhsat yoksa → <button onClick={()=>setAdim(2)} style={{background:"none",border:"none",color:"#818CF8",fontSize:11,textDecoration:"underline",cursor:"pointer"}}>Elle Gir</button></div>

// ─── SERVİS ATAMA MODALI ──────────────────────────────────────────────────
function ServisAtamaModal({dosya,servisler,onAta,onKapat}){
  const [secilen,setSecilen]=useState(dosya.atananServis||null);
  const [not,setNot]=useState(dosya.atamaNotu||"");
  const [loading,setLoading]=useState(false);
  const [hata,setHata]=useState("");
  const aktifler=(servisler||[]).filter(s=>s.aktif);
  const ata=async()=>{
    if(!secilen){setHata("Servis seçin.");return;}
    setLoading(true);setHata("");
    try{await onAta(secilen,not.trim());onKapat();}
    catch(e){setHata(e.message||"Servis atanamadı.");setLoading(false);}
  };
  return(
    <div onClick={onKapat} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.7)",zIndex:300,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
      <div onClick={e=>e.stopPropagation()} style={{background:"var(--bg)",border:"1px solid var(--border-md)",borderRadius:16,width:"100%",maxWidth:460,maxHeight:"90vh",overflowY:"auto",padding:20,animation:"popIn .25s ease"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
          <div style={{fontWeight:800,fontSize:15}}>🔧 Servis Ata</div>
          <button onClick={onKapat} style={{background:"var(--border)",border:"1px solid var(--border-md)",color:"var(--text-2)",borderRadius:"50%",width:30,height:30,fontSize:16}}>×</button>
        </div>
        <div style={{fontSize:11,color:"var(--text-2)",marginBottom:12}}>Dosya: <strong style={{fontFamily:"var(--font-mono)",color:"#818CF8"}}>{dosya.dosyaNo}</strong></div>
        {aktifler.length===0&&<div style={{fontSize:12,color:"var(--text-2)",padding:"10px 0"}}>Atanabilecek aktif servis yok.</div>}
        <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:14}}>
          {aktifler.map(s=>(
            <button key={s.id} onClick={()=>{setSecilen(s.id);setHata("");}} style={{background:secilen===s.id?"var(--violet-dim)":"var(--surface-2)",border:`1px solid ${secilen===s.id?"rgba(139,92,246,0.4)":"var(--border)"}`,borderRadius:10,padding:"10px 14px",textAlign:"left",display:"flex",alignItems:"center",gap:10}}>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontWeight:600,fontSize:12,color:secilen===s.id?"#C4B5FD":"var(--text-1)"}}>{s.ad}</div>
                {(s.adres||s.telefon)&&<div style={{fontSize:10,color:"var(--text-2)",marginTop:1}}>{[s.adres,s.telefon].filter(Boolean).join(" · ")}</div>}
              </div>
              {secilen===s.id&&<div style={{width:18,height:18,borderRadius:"50%",background:"#8B5CF6",display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,color:"#fff",flexShrink:0}}>✓</div>}
            </button>
          ))}
        </div>
        <div style={{fontSize:10,color:"var(--text-2)",fontWeight:700,letterSpacing:".6px",marginBottom:6}}>ATAMA NOTU (isteğe bağlı)</div>
        <textarea value={not} onChange={e=>setNot(e.target.value)} rows={2} style={{width:"100%",background:"var(--border)",border:"1px solid var(--border-md)",borderRadius:8,color:"var(--text-1)",padding:"9px 12px",fontSize:12,resize:"none",marginBottom:12}}/>
        {hata&&<div style={{marginBottom:10}}><HataKutusu hata={hata}/></div>}
        <button onClick={ata} disabled={loading||!secilen} style={{width:"100%",background:secilen?"linear-gradient(135deg,#7C3AED,#6D28D9)":"rgba(139,92,246,0.3)",border:"none",color:"#fff",borderRadius:9,padding:12,fontSize:13,fontWeight:800}}>{loading?"Atanıyor...":"Servisi Ata"}</button>
      </div>
    </div>
  );
}

  const [smsSaati,setSmsSaati]=useState("10:00");
  const [smsGon,setSmsGon]=useState(false);
  const [smsOk,setSmsOk]=useState(false);
  const [toast,setToast]=useState(null);
  const [servisModal,setServisModal]=useState(false);
  const [muhasebeEdit,setMuhasebeEdit]=useState(false);
  const [muhasebe,setMuhasebe]=useState({});
  const [islemler,setIslemler]=useState([]);
  const [onayDurumu,setOnayDurumu]=useState("taslak");
  const [yukleniyor,setYukleniyor]=useState(true);
  const [yuklemeHata,setYuklemeHata]=useState("");
  const [kayitHata,setKayitHata]=useState("");
  const [adimLoading,setAdimLoading]=useState(false);
  const [tumDosyalar,setTumDosyalar]=useState([]);
  const [servisler,setServisler]=useState([]);
  const [faturaVeri,setFaturaVeri]=useState(null);
  const orijinalRef=useRef(null);
  const seqRef=useRef(0);
  const fotoRef=useRef();
  useEffect(()=>{const c=()=>setIsMobile(window.innerWidth<768);c();window.addEventListener("resize",c);return()=>window.removeEventListener("resize",c);},[]);

  // Dosya, işlem kalemleri, dosya listesi ve servisler API'den gelir
  const yukle=async(sessiz)=>{
    const sira=++seqRef.current;
    if(!sessiz)setYukleniyor(true);
    setYuklemeHata("");
    try{
      const [d,i,l,sv,ev,ft]=await Promise.all([
        apiCall(`/dosyalar/${dosyaId}`),
        apiCall(`/islemler/${dosyaId}`),
        apiCall("/dosyalar?limit=200").catch(()=>({dosyalar:[]})),
        apiCall("/servisler").catch(()=>({servisler:[]})),
        apiCall(`/evrak/${dosyaId}`).catch(()=>({evrak:[]})),
        apiCall(`/fotograflar/${dosyaId}`).catch(()=>({fotograflar:[]})),
      ]);
      if(sira!==seqRef.current)return;
      const dm=esleDetay(d);
      orijinalRef.current=JSON.parse(JSON.stringify(dm));
      setDosya(dm);setMuhasebe(dm.muhasebe);
      setAdimlar((d.onarim_adimlari||[]).map(esleAdim));
      setIslemler((i.kalemler||[]).map(esleKalem));
      setOnayDurumu(i.onay_durumu||"taslak");
      setTumDosyalar(esleListe(l.dosyalar));
      setServisler(sv.servisler||[]);
      setIsEmirleri(i.is_emirleri||[]);
      setEvrak((ev.evrak||[]).map(esleEvrak));
      setPhotos((ft.fotograflar||[]).map(esleFoto));
    }catch(e){if(sira===seqRef.current)setYuklemeHata(e.message||"Dosya alınamadı.");}

  };

    </div>
  );

    ];
    const csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");
    const blob=new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8;"});

    a.download=`HasarTrack_Muhasebe_${new Date().toLocaleDateString("tr-TR").replace(/\./g,"-")}.csv`;
    a.click();
  };

  const exportPDF=()=>{
    const stil=`<style>body{font-family:Arial,sans-serif;font-size:12px;color:#333}h2{color:#4F46E5;border-bottom:2px solid #4F46E5;padding-bottom:8px}table{width:100%;border-collapse:collapse;margin-top:16px}th{background:#4F46E5;color:#fff;padding:8px;text-align:left;font-size:11px}td{padding:7px 8px;border-bottom:1px solid #eee;font-size:11px}tr:nth-child(even)td{background:#f9f9f9}.ozet{display:flex;gap:16px;margin:12px 0}.kart{background:#f3f4f6;border-radius:8px;padding:10px 16px;flex:1}.kart-baslik{font-size:9px;color:#666;font-weight:700;text-transform:uppercase;margin-bottom:4px}.kart-deger{font-size:18px;font-weight:800;color:#4F46E5}.fark-pos{color:#10B981}.fark-neg{color:#EF4444}@media print{body{margin:0}}</style>`;
    const tarih=new Date().toLocaleDateString("tr-TR",{year:"numeric",month:"long",day:"numeric"});
    const html=`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>HasarTrack Muhasebe Raporu</title>${stil}</head><body>
      <h2>🛡️ HasarTrack — Muhasebe Raporu</h2>

              <div style={{padding:"12px 16px",borderTop:"1px solid rgba(255,255,255,0.06)"}}>
                <div style={{display:"flex",gap:6,marginBottom:10,flexWrap:"wrap"}}>
                  {Object.keys(TC_CONF).filter(k=>k!=="Admin").map(t=><button key={t} onClick={()=>setHedef(t)} style={{padding:"5px 10px",borderRadius:6,border:"none",background:hedef===t?`${TC_CONF[t].renk}20`:"var(--border)",color:hedef===t?TC_CONF[t].renk:"var(--text-3)",fontSize:11,fontWeight:600,borderWidth:1,borderStyle:"solid",borderColor:hedef===t?`${TC_CONF[t].renk}35`:"var(--border)"}}>{TC_CONF[t].icon} {isMobile?"":t}</button>)}
                </div>
                <div style={{display:"flex",gap:8}}>
                  <textarea value={mesajMetin} onChange={e=>setMesajMetin(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();mesajGonder();}}} placeholder={`${hedef}'e mesaj...`} style={{flex:1,background:"var(--surface-3)",border:"1px solid var(--border-md)",borderRadius:8,color:"var(--text-1)",padding:"10px 12px",fontSize:13,resize:"none",minHeight:44,maxHeight:90}}/>
                  <button onClick={mesajGonder} style={{background:"#4F46E5",border:"none",color:"#fff",borderRadius:8,padding:"0 16px",fontSize:18,flexShrink:0}}>→</button>
                </div>
              </div>
            </Card>
            <Card>
              <ST>⚡ Hızlı Şablonlar</ST>
              <div style={{display:"grid",gridTemplateColumns:isMobile?"1fr":"1fr 1fr",gap:8}}>
                {[{l:"Eksper Raporu Talebi",m:"Ekspertiz raporunun sisteme yüklenmesini rica ederiz.",h:"Eksper"},{l:"Proforma Fatura Talebi",m:"Maliyet teklifi ve hasar formunun iletilmesini rica ederiz.",h:"Onarım Merkezi"},{l:"Sigorta Onay Takibi",m:"Proforma teklifin onaylanmasını bekliyoruz. Güncel durumu paylaşır mısınız?",h:"Sigorta Şirketi"},{l:"Araç Sahibi Bilgilendirme",m:"Sayın Müşterimiz, aracınızın ekspertiz aşaması tamamlandı.",h:"Araç Sahibi"}].map(s=>(
                  <button key={s.l} onClick={()=>{setMesajMetin(s.m);setHedef(s.h);}} style={{background:"rgba(15,23,42,0.02)",border:"1px solid var(--border)",color:"var(--text-2)",borderRadius:8,padding:"10px 12px",fontSize:11,textAlign:"left",lineHeight:1.5}}>
                    <div style={{fontWeight:700,color:"var(--text-1)",fontSize:12,marginBottom:2}}>{s.l}</div>
                    <div style={{fontSize:10,color:TC_CONF[s.h]?.renk||"var(--text-3)"}}>→ {s.h}</div>
                  </button>
                ))}
              </div>
            </Card>
          </div>
        )}

        {tab==="sms"&&(
          <div style={{display:"flex",flexDirection:"column",gap:14}}>
            <Card>
              <ST>📱 Otomatik SMS Ayarları</ST>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"13px 14px",background:smsAktif?"rgba(79,70,229,0.07)":"rgba(15,23,42,0.02)",border:`1px solid ${smsAktif?"rgba(79,70,229,0.25)":"var(--border)"}`,borderRadius:10,marginBottom:14}}>
                <div><div style={{fontWeight:700,fontSize:13,marginBottom:2}}>Günlük SMS Bildirimi</div><div style={{fontSize:11,color:"var(--text-2)"}}>Araç sahibine otomatik durum SMS'i</div></div>
                <label className="toggle"><input type="checkbox" checked={smsAktif} onChange={e=>setSmsAktif(e.target.checked)}/><span className="slider"></span></label>
              </div>
              <div style={{padding:"11px 13px",background:"rgba(245,158,11,0.06)",border:"1px solid rgba(245,158,11,0.18)",borderRadius:9,marginBottom:14,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div><div style={{fontSize:10,color:"#F59E0B",fontWeight:700,marginBottom:2}}>ALICI</div><div style={{fontWeight:700,fontSize:13}}>{dosya.sahip.ad}</div><div style={{fontSize:12,color:"var(--text-2)",fontFamily:"var(--font-mono)"}}>{dosya.sahip.telefon}</div></div>
                <Chip renk="#F59E0B">📱 SMS</Chip>
              </div>
              <div style={{marginBottom:14}}>
                <div style={{fontSize:11,color:"var(--text-2)",fontWeight:600,marginBottom:10}}>GÖNDERIM SAATİ</div>
                <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                  {["08:00","09:00","10:00","11:00","14:00","17:00"].map(s=><button key={s} onClick={()=>setSmsSaati(s)} style={{padding:"8px 14px",borderRadius:7,border:"none",background:smsSaati===s?"rgba(79,70,229,0.25)":"var(--border)",color:smsSaati===s?"#818CF8":"var(--text-3)",fontSize:13,fontWeight:700,fontFamily:"var(--font-mono)",borderWidth:1,borderStyle:"solid",borderColor:smsSaati===s?"rgba(79,70,229,0.4)":"var(--border-md)"}}>{s}</button>)}
                </div>
              </div>
              <div style={{marginBottom:14}}>
                <div style={{fontSize:11,color:"var(--text-2)",fontWeight:600,marginBottom:8}}>OTO-SMS TETİKLEYEN ADIMLAR</div>
                {ONARIM_ADIMLARI.filter(a=>a.otoSms).map(a=>(
                  <div key={a.id} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 12px",background:"rgba(16,185,129,0.04)",border:"1px solid rgba(16,185,129,0.15)",borderRadius:8,marginBottom:6}}>
                    <span style={{fontSize:16}}>📱</span>
                    <div style={{flex:1}}><div style={{fontSize:12,fontWeight:600,color:"var(--text-1)"}}>{a.ad}</div></div>
                    <Chip renk={a.durum==="tamamlandi"?"#10B981":a.durum==="aktif"?"#4F46E5":"var(--text-3)"} sm>{a.durum==="tamamlandi"?"✓ Gönderildi":a.durum==="aktif"?"⬤ Aktif":"Bekliyor"}</Chip>
                  </div>
                ))}
              </div>
              <button onClick={smsGonder} disabled={smsGon||!smsAktif} style={{width:"100%",background:smsOk?"#10B981":smsGon?"rgba(79,70,229,0.4)":"#4F46E5",border:"none",color:"#fff",borderRadius:9,padding:13,fontSize:13,fontWeight:700}}>
                {smsGon?<span style={{animation:"pulse .8s infinite"}}>⏳ Gönderiliyor...</span>:smsOk?"✓ İletildi!":"📤 Şimdi Gönder"}
              </button>
            </Card>
            <Card>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
                <div style={{fontWeight:700,fontSize:13}}>📜 SMS Geçmişi</div>
                <Chip renk="#4F46E5">{smsMesajlar.filter(m=>m.durum==="iletildi").length} iletildi</Chip>
              </div>
              {smsMesajlar.map(s=>(
                <div key={s.id} style={{padding:"11px 13px",background:s.durum==="iletildi"?"rgba(16,185,129,0.04)":"rgba(245,158,11,0.05)",border:`1px solid ${s.durum==="iletildi"?"rgba(16,185,129,0.15)":"rgba(245,158,11,0.2)"}`,borderRadius:9,marginBottom:8}}>
                  <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                    <div><div style={{fontWeight:700,fontSize:12,color:"var(--text-1)"}}>{s.adim}</div><div style={{fontSize:10,color:"var(--text-2)",fontFamily:"var(--font-mono)"}}>{s.tarih} · {s.saat}</div></div>
                    <div style={{display:"flex",gap:6,alignItems:"center"}}>
                      {s.oto&&<Chip renk="#10B981" sm>⚡ Otomatik</Chip>}
                      <Chip renk={s.durum==="iletildi"?"#10B981":"#F59E0B"} sm>{s.durum==="iletildi"?"✓ İletildi":"⏳ Bekliyor"}</Chip>
                    </div>
                  </div>
                  <div style={{fontSize:10,color:"var(--text-2)"}}>📞 {s.alici} · {s.n} kr</div>
                </div>
              ))}
            </Card>
          </div>
        )}
      </div>

      {/* MOBİL NAV */}
      {isMobile&&(
        <div style={{position:"fixed",bottom:0,left:0,right:0,background:"var(--surface-1)",borderTop:"1px solid rgba(255,255,255,0.08)",display:"flex",zIndex:100,paddingBottom:"env(safe-area-inset-bottom)"}}>
          {TABS.map(t=>(
            <button key={t.id} onClick={()=>setTab(t.id)} style={{flex:1,background:"none",border:"none",padding:"8px 2px 10px",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:2,position:"relative"}}>
              <span style={{fontSize:16}}>{t.mi}</span>
              <span style={{fontSize:7,fontWeight:tab===t.id?700:500,color:tab===t.id?"#818CF8":"var(--text-3)"}}>{t.l}</span>
              {tab===t.id&&<div style={{position:"absolute",top:0,left:"20%",right:"20%",height:2,background:"#4F46E5",borderRadius:"0 0 2px 2px"}}/>}
              {t.badge&&eksikEvrak.length>0&&<div style={{position:"absolute",top:5,right:"calc(50% - 14px)",background:"#EF4444",color:"#fff",borderRadius:"50%",width:12,height:12,fontSize:7,fontWeight:800,display:"flex",alignItems:"center",justifyContent:"center"}}>{eksikEvrak.length}</div>}
            </button>
          ))}
        </div>
      )}

      {/* SERVİS ATAMA MODALI */}
      {servisModal&&<ServisAtamaModal dosya={dosya} servisler={servisler} onAta={async(id,not)=>{await apiCall(`/dosyalar/${dosyaId}/servis-ata`,"POST",{servis_id:id,not_metni:not||undefined});await yukle(true);}} onKapat={()=>setServisModal(false)}/>}

      {/* TOAST */}
      {toast&&(
        <div style={{position:"fixed",bottom:isMobile?72:24,left:"50%",transform:"translateX(-50%)",zIndex:500,maxWidth:360,width:"calc(100% - 32px)",animation:"fadeUp .3s ease"}}>
          <div style={{background:"var(--surface-2)",border:"1px solid rgba(16,185,129,0.35)",borderRadius:14,padding:"14px 16px",boxShadow:"0 8px 32px rgba(0,0,0,0.5)"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
              <div style={{display:"flex",gap:8,alignItems:"center"}}>
                <div style={{width:32,height:32,borderRadius:8,background:"rgba(16,185,129,0.15)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,flexShrink:0}}>📱</div>
                <div><div style={{fontWeight:700,fontSize:13,color:"#10B981"}}>Otomatik SMS Gönderildi</div><div style={{fontSize:11,color:"var(--text-2)",marginTop:1}}>{toast.telefon}</div></div>
              </div>
              <button onClick={()=>setToast(null)} style={{background:"none",border:"none",color:"var(--text-2)",fontSize:18,marginLeft:8}}>×</button>
            </div>
            <div style={{background:"var(--surface-3)",border:"1px solid var(--border)",borderRadius:8,padding:"8px 10px",marginBottom:8}}>
              <div style={{fontSize:10,color:"var(--text-2)",fontWeight:600,marginBottom:4}}>GÖNDERİLEN MESAJ</div>
              <div style={{fontSize:12,color:"var(--text-2)",lineHeight:1.6}}>{toast.mesaj}</div>
            </div>
            <div style={{fontSize:10,color:"#10B981",display:"flex",gap:6,alignItems:"center"}}>
              <div style={{width:6,height:6,borderRadius:"50%",background:"#10B981",animation:"pulse 1.5s infinite"}}/>
              ✓ Adım tamamlandığında otomatik tetiklendi
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ─── ANA ROUTER ───────────────────────────────────────────────────────────
function App(){
  const [ekran,setEkran]=useState("rolsecim");
  const [wizardAcik,setWizardAcik]=useState(false);
  const [kullanici,setKullanici]=useState(null);
  const [seciliDosyaId,setSeciliDosyaId]=useState(null);
  const [oturumMesaj,setOturumMesaj]=useState("");

  const giris=(k)=>{setOturumMesaj("");setKullanici(k);setEkran(`${k.rol}-${k.rol==="admin"?"dashboard":k.rol==="servis"?"panel":k.rol==="acente"?"panel":"panel"}`);};
  const cikis=()=>{localStorage.removeItem("ht_token");setEkran("rolsecim");setKullanici(null);setSeciliDosyaId(null);};

  // Token süresi dolduğunda veya reddedildiğinde (401) giriş ekranına dön
  useEffect(()=>{
    const h=()=>{setKullanici(null);setSeciliDosyaId(null);setWizardAcik(false);setEkran("rolsecim");setOturumMesaj("Oturum sona erdi, lütfen tekrar giriş yapın.");};
    window.addEventListener("ht-oturum-bitti",h);
    return()=>window.removeEventListener("ht-oturum-bitti",h);
  },[]);

  return(
    <>
      {oturumMesaj&&ekran==="rolsecim"&&<div onClick={()=>setOturumMesaj("")} style={{position:"fixed",top:12,left:"50%",transform:"translateX(-50%)",zIndex:600,background:"rgba(239,68,68,0.95)",color:"#fff",borderRadius:10,padding:"10px 18px",fontSize:12,fontWeight:700,cursor:"pointer",maxWidth:"calc(100% - 32px)"}}>⚠ {oturumMesaj}</div>}
      {ekran==="rolsecim"&&<RolSecim onRol={r=>setEkran(`${r}-giris`)}/>}
      {ekran==="admin-giris"   &&<AdminGiris   onGiris={giris} onGeri={()=>setEkran("rolsecim")}/>}
      {ekran==="servis-giris"  &&<ServisGiris  onGiris={giris} onGeri={()=>setEkran("rolsecim")}/>}
      {ekran==="acente-giris"  &&<AcenteGiris  onGiris={giris} onGeri={()=>setEkran("rolsecim")}/>}
      {ekran==="musteri-giris" &&<MusteriGiris onGiris={giris} onGeri={()=>setEkran("rolsecim")}/>}
      {ekran==="admin-dashboard"&&(
        <>
          <AdminDashboard onDosyaSec={(id)=>{setSeciliDosyaId(id);setEkran("admin-panel");}} onYeniDosya={()=>setWizardAcik(true)} onCikis={cikis} onServisDetay={(id)=>{setKullanici(k=>({...k,servisDetayId:id}));setEkran("admin-servis-detay");}}/>
          {wizardAcik&&<YeniDosyaWizard onKapat={()=>setWizardAcik(false)} onKaydet={(d)=>{setWizardAcik(false);setSeciliDosyaId(d.id);setEkran("admin-panel");}}/>}
        </>
      )}
      {ekran==="admin-panel"  &&seciliDosyaId&&<AdminPanel dosyaId={seciliDosyaId} onCikis={()=>setEkran("admin-dashboard")}/>}
      {ekran==="admin-servis-detay"&&<ServisDetayAdmin servisId={kullanici?.servisDetayId} onGeri={()=>setEkran("admin-dashboard")}/>}
      {ekran==="servis-panel" &&<ServisPanel servisBilgi={kullanici?.servis||{id:"",ad:"Servis",adres:"",telefon:""}} onCikis={cikis}/>}
      {ekran==="acente-panel" &&<AcentePanel onCikis={cikis}/>}
      {ekran==="musteri-panel"&&<MusteriPanel onCikis={cikis}/>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
